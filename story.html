<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>Nuitai Story Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: turn order is a vertical bar on the left, current actor on top. The field (banner, two sides, commands, log) sits beside it. */
:root{
  --bg:#eaf3f4; --panel:#ffffff; --ink:#12242b; --muted:#52707a; --line:#c5d7dc; --accent:#0b7a8c; --accent-ink:#ffffff; --glow:#0b7a8c44;
  --hp:#2f9e58; --hp-low:#d0452f; --foe:#f4e9e6; --pal:#e3f1f4;
  --ahi:#c8372d; --ahi-ink:#ffffff; --lau:#2f7d3b; --lau-ink:#ffffff; --wai:#1f6fb5; --wai-ink:#ffffff;
  --la:#e2b100; --la-ink:#2a2000; --ata:#2b2630; --ata-ink:#ffffff; --mana:#7a3fb3; --mana-ink:#ffffff;
  --none:#dfe8ea; --none-ink:#12242b; --poison:#3f8f1f; --poison-ink:#ffffff;
  --display:"Fredoka","Trebuchet MS",sans-serif; --body:"Atkinson Hyperlegible",Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1a1f; --panel:#14282f; --ink:#e6f1f3; --muted:#8fabb3; --line:#2a4650; --accent:#4cc3d6; --accent-ink:#06222a; --glow:#4cc3d655;
  --hp:#46c277; --hp-low:#ef6a52; --foe:#2a2422; --pal:#183540;
  --ahi:#e2574b; --ahi-ink:#1c0503; --lau:#55b866; --lau-ink:#04180a; --wai:#4d9fe6; --wai-ink:#03121f;
  --la:#f0c62c; --la-ink:#2a2000; --ata:#6b6480; --ata-ink:#ffffff; --mana:#b07be6; --mana-ink:#16052a;
  --none:#24404a; --none-ink:#e6f1f3; --poison:#8bd450; --poison-ink:#0b1f02; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c1a1f; --panel:#14282f; --ink:#e6f1f3; --muted:#8fabb3; --line:#2a4650; --accent:#4cc3d6; --accent-ink:#06222a; --glow:#4cc3d655;
  --hp:#46c277; --hp-low:#ef6a52; --foe:#2a2422; --pal:#183540;
  --ahi:#e2574b; --ahi-ink:#1c0503; --lau:#55b866; --lau-ink:#04180a; --wai:#4d9fe6; --wai-ink:#03121f;
  --la:#f0c62c; --la-ink:#2a2000; --ata:#6b6480; --ata-ink:#ffffff; --mana:#b07be6; --mana-ink:#16052a;
  --none:#24404a; --none-ink:#e6f1f3; --poison:#8bd450; --poison-ink:#0b1f02; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px}
main{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.6rem;margin:0}
h2{font-family:var(--display);font-size:1rem;margin:0;letter-spacing:.02em}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.rowx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;transition:border-color .12s,background .12s,transform .12s}
button:hover:not(:disabled),button:focus-visible{border-color:var(--accent);background:var(--pal)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;text-align:center}
button.small{padding:3px 10px;font-size:.85rem}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.Ahi{background:var(--ahi);color:var(--ahi-ink)} .Lau{background:var(--lau);color:var(--lau-ink)}
.Wai{background:var(--wai);color:var(--wai-ink)} .La{background:var(--la);color:var(--la-ink)}
.Ata{background:var(--ata);color:var(--ata-ink)} .Mana{background:var(--mana);color:var(--mana-ink)}
.elem{font-size:1.15rem;line-height:1}
.none{background:var(--none);color:var(--none-ink)}
.poison{background:var(--poison);color:var(--poison-ink)}
.float.psn{color:var(--poison)}
.sndbtn{position:fixed;right:12px;bottom:12px;z-index:30;box-shadow:0 2px 8px #0003}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:1.3em}
/* Party picker cards, like Chrono Trigger: portrait on the left, elements above the name. Stats live on the character pages. */
.pgrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
button.pc{display:flex;align-items:center;gap:12px}
button.pc .face{margin-right:0;flex:none}
button.pc.soon{border-style:dashed}
.veg{font-size:1.15rem;line-height:1}
.veg-chip{background:var(--none);color:var(--none-ink)}
.noface{display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--muted)}
.pcw{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcw b{white-space:nowrap}

.battle{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:start}
.orderbox{position:sticky;top:env(safe-area-inset-top,0px)}
.order{display:flex;flex-direction:column;gap:5px}
.slot{border:2px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.88rem;font-weight:700;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.foe{background:var(--foe)}
.slot.me{border-color:var(--accent);background:var(--pal)}
.slot.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1rem;padding-block:8px;box-shadow:0 0 0 4px var(--glow)}
.slot.now.foe{background:var(--hp-low);border-color:var(--hp-low);color:#fff}
/* The fight fits one screen on a computer (Frankie, 10/9): the page title hides, the turn order and the log
   share the left column and scroll inside it, and the field takes the rest. Phones still scroll. */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
@media (min-width:701px){
  main:has(.battle)>header{display:none}
  body:has(.battle){padding-block:10px}
  .battle{height:calc(100dvh - 72px);min-height:480px;align-items:stretch}
  .orderbox{position:static;flex:1;min-height:0}
  .order{flex:1;min-height:0;overflow-y:auto;padding:4px}
  .order .slot{flex:none}
  .logbox{flex:none;height:min(220px,32%)}
  .logbox .log{max-height:none;flex:1;min-height:0}
  .field{min-height:0;overflow-y:auto;padding:4px;margin:-4px}
  .field .banner{min-height:2em}
  #menu>h2{display:none}
  button.cmd{padding-block:5px;font-size:.98rem}
  .cmds{gap:4px}
  .field .unit{padding-block:6px}
  .field .ubody{gap:3px}
  .field .panel{padding:10px;gap:8px}
  .field .unit .spr{height:52px}
  .field .banner{font-size:1.1rem}
  .field #menu{flex:1;min-height:0}
  .field .cmdwrap{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  .field .ctx{min-height:0;overflow-y:auto;padding:4px}
}
.embedded [data-do="setup"]{display:none}
/* A short screen, like a laptop with the browser's bars: the six commands go two to a row. */
@media (min-width:701px) and (max-height:700px){
  .field .cmds{display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .battle{grid-template-columns:1fr}
  .side{display:contents}
  .logbox{order:2}
  .orderbox{position:static}
  .order{flex-direction:row;overflow-x:auto;padding:5px}
  .slot{flex:none}
}
.banner{font-family:var(--display);font-size:1.25rem;min-height:2.9em;display:flex;align-items:center;text-wrap:balance}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.sides{grid-template-columns:1fr}}
.unit{position:relative;border:2px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0;background:var(--panel);transition:border-color .15s,box-shadow .15s,opacity .3s}
.unit.foe{background:var(--foe)}
.unit.active{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.unit.acting{border-color:var(--la);box-shadow:0 0 0 4px var(--la)}
.unit.aim{border-color:var(--accent);border-style:dashed;box-shadow:0 0 0 4px var(--glow)}
.unit.pick{cursor:pointer;border-style:dashed;border-color:var(--accent)}
.unit.dead{opacity:.35}
.unit .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.unit .name{font-weight:700}
.ubody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.upic .face,.upic .spr{margin-right:0}
.face{width:56px;height:56px;image-rendering:pixelated;border:2px solid var(--line);border-radius:6px;vertical-align:middle;margin-right:8px;background:var(--none)}
.face.s{width:32px;height:32px;image-rendering:auto;border-width:1px;border-radius:4px;margin-right:5px}
/* Monster sprites and element icons are the pygame game's own pictures, pasted in by game/shared/build.py. */
.spr{height:64px;width:auto;max-width:96px;image-rendering:pixelated;vertical-align:middle;margin-right:8px;object-fit:contain}
.spr.s{height:32px;max-width:40px;margin-right:5px}
.unit.foe.acting .spr{animation:lunge .45s ease-out}
@keyframes lunge{40%{transform:translateX(-14px) scale(1.08)}}
.ico{height:1.3em;width:auto;image-rendering:pixelated;vertical-align:-.25em}
.elem .ico{height:20px;vertical-align:-3px}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.bench button{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 4px}
.bench .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.swaph{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.hpt{font-variant-numeric:tabular-nums;font-size:.9rem}
.bar{height:9px;background:var(--none);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp);transition:width .45s ease-out}
.bar i.low{background:var(--hp-low)}
.float{position:absolute;right:32%;top:0;font-family:var(--display);font-size:1.5rem;font-weight:600;pointer-events:none;animation:rise 1s ease-out forwards;text-shadow:0 0 4px var(--panel),0 0 4px var(--panel)}
.float.hit{color:var(--hp-low)} .float.heal{color:var(--hp)} .float.miss,.float.status{color:var(--ink);font-size:1.05rem}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.glowheal{animation:gh .6s}
@keyframes gh{30%{box-shadow:0 0 0 6px var(--hp)}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.menu button{display:flex;flex-direction:column;gap:3px}
.menu .row{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%}
.menu .d{font-size:.82rem;color:var(--muted)}
.wait{font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.log{max-height:170px;overflow-y:auto;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.log .turn{font-weight:700;margin-top:4px}
/* Profiles and bestiary */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .tab{font-family:var(--display);font-size:1rem;padding:6px 14px;border-radius:999px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist button{display:inline-flex;align-items:center;gap:2px;padding:4px 10px 4px 4px;border-radius:999px;font-weight:700}
.face.xl{width:112px;height:112px;border-radius:10px;margin-right:0}
.ph{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ph h2{font-size:1.5rem}
.ph .t{font-family:var(--display);color:var(--muted);font-size:1.05rem;font-weight:500}
/* A full name, each part labelled: family name in the accent colour, given name in Magic's purple. */
.nm{display:inline-flex;gap:.4em;align-items:flex-start}
.nm>span{display:inline-flex;flex-direction:column;line-height:1.1}
.nm small{font-family:var(--body);font-size:.68rem;font-weight:700;letter-spacing:.03em}
.nm .fam small{color:var(--accent)} .nm .giv small{color:var(--mana)}
.big{font-size:3.4rem;line-height:1;width:112px;height:112px;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:var(--foe)}
.big .spr{height:96px;max-width:104px;margin:0}
.prof h3{font-family:var(--display);font-size:1.05rem;margin:4px 0 0}
.prof p{max-width:68ch}
.statrows{display:grid;gap:6px;max-width:520px}
.sr{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center}
.sr .k{font-weight:700;color:var(--c)}
.sr .k small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.1}
.sr .b{height:12px;border-radius:0 4px 4px 0;background:var(--none);overflow:hidden}
.sr .b i{display:block;height:100%;background:var(--c);border-radius:0 4px 4px 0}
.sr .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
.stbl th,.stbl td{padding:4px 10px;text-align:left;border-bottom:1px solid var(--line)}
.stbl td.n{text-align:right;font-weight:700}
.abl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ab{border:2px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.ab.sp{border-color:var(--accent);background:var(--pal)}
.ab .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ab .d{font-size:.85rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.sl{display:block;font-size:.78rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.sl b{color:var(--ink)}
/* The bag and pockets. An item is colored by what it does: green heals. */
.pockets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pk{border:2px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pkh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pkh .muted{margin-left:auto}
.pslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.pi{border-left:6px solid var(--k);padding:4px 8px;font-size:.88rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe{border:2px dashed var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem;color:var(--muted)}
.it{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.82rem;font-weight:700;border:2px solid var(--k);white-space:nowrap}
.itl{display:grid;gap:4px}
.itl div{border-left:6px solid var(--k);padding:2px 10px;font-size:.9rem}
.menu button.itm{border-left:6px solid var(--k)}
/* The command menu, like FFX: commands down the left third, what the chosen one holds in the right two thirds.
   Skills are edged in Strength's red, Magic in Magic's purple, Item in healing green. */
.cmdwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;align-items:start}
.cmds{display:flex;flex-direction:column;gap:6px}
button.cmd{font-family:var(--display);font-size:1.05rem;border-left:6px solid var(--k,var(--line))}
button.cmd.on,button.cmd:hover:not(:disabled),button.cmd:focus-visible{border-left-color:var(--k,var(--accent))}
.ctx{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:130px}
.ctx .menu{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.ctx .bench{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
@media (max-width:520px){button.cmd{font-size:.95rem;padding:8px 6px}}
/* A move's numbers: physical in Strength's red, magic in Magic's purple, healing in green, as on the stat rows. */
.stat{display:inline-block;border-radius:999px;padding:0 8px;margin-right:6px;font-size:.78rem;font-weight:700;border:2px solid var(--k);color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.float,.shake,.glowheal,.unit.foe.acting .spr{animation-duration:.01s}.bar i{transition:none}}
</style>
<main>
  <header class="col" style="gap:4px">
    <h1>Nuitai CTB Battle Test</h1>
    <p class="muted">The 10/6 rules plus stats (10/7), swapping, the bag, the Apostate, the Luminary, the Agent and Paku (10/8), playable. Every number is a placeholder.</p>
  </header>
  <div id="app" class="col" style="gap:16px"></div>
</main>

const face=(n,sm)=>PORTRAIT[n]?`<img class="face${sm?" s":""}" src="${PORTRAIT[n]}" alt="">`:"";
const sprite=(k,sm)=>ART.sprites[k]?`<img class="spr${sm?" s":""}" src="${ART.sprites[k]}" alt="">`:"";
/* A unit's picture: a party member's portrait, or a monster's sprite. */
const pic=(u,sm)=>u.sprite?sprite(u.sprite,sm):face(u.name,sm);
const FOE={Boar:"🐗",Tandayag:"🐗",Santelmo:"🔥",Nuno:"🧙",Sigbin:"🦇",Wicked:"🍄",Amaranhig:"🧟",Kaperosa:"👻"};
const ENCI={Beast:"🐗",Santelmo:"🔥",Sigbin:"🦇",Dwende:"🍄",Tandayag:"🐗",Kaperosa:"👻"};
const encPic=e=>{const k=ENC[e][0][8];return ART.sprites[k]?sprite(k,1):ENCI[e.split(" ")[0]]||""};
const chip=(el,txt)=>txt?`<span class="chip ${el||"none"}">${txt}</span>`:`<span class="elem" title="${el}" role="img" aria-label="${el}">${EL[el]}</span>`;
const nm=u=>(u.icon?u.icon+" ":"")+u.name;
const live=side=>S.units.filter(u=>u.hp>0&&(!side||u.side===side));
const byId=id=>S.units.find(u=>u.id===id)||(S.bench||[]).find(u=>u.id===id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- events: the rules run instantly and record what happened; the page then plays it back one step at a time ---- */
function snap(){ return {active:S.active,rows:rows(),units:S.units.map(u=>({id:u.id,hp:u.hp,status:{...u.status},ward:u.ward,haste:u.haste,berserk:u.berserk,tiger:u.tiger,defend:u.defend,ready:u.ready,guard:u.guard&&u.guard.kind}))} }
function seal(){ const q=S.queue; if(q.length&&!q[q.length-1].snap)q[q.length-1].snap=snap() }
function say(msg,o){ seal(); S.queue.push(Object.assign({msg},o||{})) }

function start(){
  if(S.rndP&&!S.embed)S.picks=Object.keys(ROSTER).sort(()=>Math.random()-.5).slice(0,3);
  S.foes=S.embed?S.embed.foes.map(f=>{const m=MON[f.monster];return [f.name,m.hp,cap(f.element),m.list,m.beast?1:0,m.immune,m.poison_rate||0,m.boss?1:0,f.sprite||null,m.steal||null]}):rollFoes();
  let id=0; S.units=[]; S.queue=[]; S.pending=null; S.cmd=null; S.lock=false; S.preview=null; S.over=null; S.active=null; S.spent=false; S.busy=false;
  S.picks.forEach(n=>{const st=statsFor(ROSTER[n]),hp=st.hp*C.hp/10;S.units.push({id:id++,name:n,side:"party",max:hp,hp,st,elements:ROSTER[n],pocket:INV.pockets[n],t:Math.random(),status:{},haste:0})});
  S.foes.forEach(m=>{const hp=Math.round(m[1]*C.mHP),spr=ART.sprites[m[8]]?m[8]:null;S.units.push({id:id++,name:m[0],sprite:spr,icon:spr?"":FOE[m[0].split(" ")[0]]||"",side:"foe",max:hp,hp,st:statsFor(m[7]?[m[2],m[2]]:[m[2]]),element:m[2],moves:m[3],beast:!!m[4],boss:!!m[7],immune:m[5]||[],pr:m[6]||C.poison,loot:m[9],elements:[],t:Math.random(),status:{},haste:0})});
  /* The bench: everyone not picked. They sit outside S.units, so nothing in the fight can see or hit them,
     and their clocks stand still. No random numbers are drawn for them, so the simulation's seeded fights stay the same. */
  S.bench=S.embed?[]:Object.keys(ROSTER).filter(n=>!S.picks.includes(n)).map(n=>{const st=statsFor(ROSTER[n]),hp=st.hp*C.hp/10;return {id:id++,name:n,side:"party",max:hp,hp,st,elements:ROSTER[n],pocket:INV.pockets[n],t:0,status:{},haste:0}});
  S.screen="battle"; build(); advance();
}
function deal(t,amt){ if(t.hp<=0)return; t.hp=Math.max(0,t.hp-amt); if(t.hp<=0){t.status={};t.guard=null;t.ward=false;t.haste=0;t.berserk=0;t.tiger=false;say(`${t.name} falls.`,{t:t.id})} }
function heal(t,amt,full){ if(t.hp<=0)return;
  if(t.status.burn){say(`${t.name} is burning and cannot be healed.`,{t:t.id,num:"no heal",fx:"miss"});return}
  if(t.status.zombie){const d=full?t.max:amt;say(`${t.name} is a zombie. The healing hurts for ${d}!`,{t:t.id,num:-d,fx:"hit"});deal(t,d);return}
  const before=t.hp; t.hp=full?t.max:Math.min(t.max,t.hp+amt); say(`${t.name} recovers ${t.hp-before} HP.`,{t:t.id,num:"+"+(t.hp-before),fx:"heal"}) }
function inflict(t,s){ if(t.hp<=0)return; if((t.immune||[]).includes(s)){say(`${t.name} is immune to ${s}.`,{t:t.id,num:"immune",fx:"miss"});return}
  if(Math.random()>C.statusHit){say(`${s} does not take hold on ${t.name}.`,{t:t.id,num:"resisted",fx:"miss"});return}
  if(s==="sleep"){t.status.sleep=C.sleep;t.guard=null} else if(s==="burn")t.status.burn=COMBO.scorch.burn_turns; else if(s==="doom"){if(!t.status.doom)t.status.doom=C.doom} else t.status[s]=true;
  say(`${t.name} is afflicted with ${s}.`,{t:t.id,num:ST[s]||s,fx:s==="poison"?"status psn":"status"}) }
function esuna(t){ ["blind","sleep","poison"].forEach(s=>delete t.status[s]) }
function guardFor(t,kinds){ return live(t.side).find(g=>g.guard&&kinds.includes(g.guard.kind)) }
function phys(a,t,power,el,statuses,noGuard){

/* Run the rules until the player has to choose, then play back what happened. */
function advance(){
  for(;;){
    seal();
    if(!live("foe").length){S.over="win";say("Victory.",{cls:"turn"});break}
    if(!live("party").length){S.over="lose";say("The party has fallen.",{cls:"turn"});break}
    const u=live().reduce((a,b)=>a.t<=b.t?a:b);
    S.active=u.id; S.spent=false; S.pending=null; S.cmd=null; S.lock=false; S.preview=null;
    say(`${u.name}'s turn`,{cls:"turn",a:u.id});
    if(!startTurn(u))continue;
    if(u.side==="foe"){foeTurn(u);continue}
    if(u.berserk>0){berserkTurn(u);continue}
    break }
  play() }
/* Swap, FFX style: on a party member's turn, trade them for anyone on the bench. It costs no time and does not
   end the turn: the one coming in takes over this same turn, and can swap again. Only an action ends it.
   The one going out keeps their HP and statuses, frozen, until they come back. Nobody fallen can swap, and
   the bench cannot save a lost fight: when all three on the field are down, it is over. */
/* The rules half of a swap, with no drawing, so the sweep's autopilot can swap too. */
function swapUnits(u,n){
  n.t=u.t; n.guard=null; n.defend=false; n.ready=false;
  S.units[S.units.indexOf(u)]=n; S.bench=S.bench.filter(x=>x!==n).concat(u);
  const order=Object.keys(ROSTER); S.bench.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));
  S.active=n.id; S.preview=null }
/* Tidal Wave's shuffle (D-159): nobody stays in place. Every place is refilled from the bench at random; whoever comes in
   takes the clock of the one they replace, never earlier than now, and into Paku's own place they come as if they had just used
   an element move. Only when the bench runs short does someone from the field come back, in a different place if possible,
   keeping their own clock. Everyone left over, the fallen included, goes to the bench. */
function shuffleParty(u){
  seal(); /* the wave's last hit is drawn with the old party */
  const slots=S.units.map((x,i)=>x.side==="party"?i:-1).filter(i=>i>=0), field=slots.map(i=>S.units[i]);
  const all=field.concat(S.bench||[]);
  const mix=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const comers=mix((S.bench||[]).filter(x=>x.hp>0)), movers=mix(field.filter(x=>x.hp>0)), nf=[];
  field.forEach((out,k)=>{
    if(comers.length){const n=comers.shift();n.t=out===u?u.t+C.element*down(n.st.spd):Math.max(out.t,u.t);n.guard=null;n.defend=false;n.ready=false;nf[k]=n;return}
    let i=movers.findIndex(x=>x!==out); if(i<0)i=movers.length?0:-1;
    nf[k]=i>=0?movers.splice(i,1)[0]:field.find(x=>!nf.includes(x)&&!movers.includes(x)) });
  slots.forEach((i,k)=>S.units[i]=nf[k]);
  const order=Object.keys(ROSTER); S.bench=all.filter(x=>!nf.includes(x)).sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));
  const moved=nf.filter((x,k)=>x!==field[k]).length;
  say(moved?`The wave washes over the deck! When it clears: ${nf.map(x=>x.name).join(", ")}.`:`The wave washes over the deck, and somehow nobody moved.`,{party:nf.map(unitCard).join(""),big:1}) }
function swap(id){
  if(S.busy||S.over||S.pending)return; const u=byId(S.active),n=(S.bench||[]).find(x=>x.id===id);
  if(!u||u.side!=="party"||u.hp<=0||!n||n.hp<=0)return;
  swapUnits(u,n); S.cmd=null; S.lock=false;
  const el=card(u.id), done=()=>{
    const tmp=document.createElement("div"); tmp.innerHTML=unitCard(n); const ne=tmp.firstElementChild; el.replaceWith(ne); swapIn(ne);
    addLog({msg:`${u.name} swaps out. ${n.name} comes in.`}); $("banner").textContent=`${n.name} comes in. ${n.name}'s turn. Choose a command.`;
    S.busy=false; paint(snap()); fx({t:n.id,num:"swapped in",fx:"heal"}); paintMenu() };
  if(calm()){done();return}
  S.busy=true; paintMenu(); $("banner").textContent=`${u.name} swaps out.`; swapOut(el).then(done) }
/* Swapping, drawn (Frankie, 10/10): the one leaving slides off and fades, the one coming in slides in from the other side. */
const swapOut=el=>el.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-60px)"}],{duration:320,easing:"ease-in",fill:"forwards"}).finished;
const swapIn=el=>{if(!calm())el.animate([{opacity:0,transform:"translateX(60px)"},{opacity:1,transform:"none"}],{duration:380,easing:"ease-out"})};
function act(a,t){ if(S.busy)return; const u=byId(S.active); S.cmd=null; S.lock=false;
  say(`${u.name} uses ${a.n}${t&&t!==u?" on "+t.name:""}.`,{a:u.id,t:t&&t!==u?t.id:null,big:1});
  a.run(u,t); spend(u,a.c); advance() }

/* ---- the autopilot: the player's half of the game, for the Autopilot switch and for the sweep in ctb-sweep.html.
   Simple rules, checked in order. ---- */
const frac=x=>x.hp/x.max;
const lowest=list=>list.reduce((a,b)=>frac(a)<=frac(b)?a:b);
const A=n=>ACTIONS.find(a=>a.n===n);
function choose(u){
  const mine=actionsFor(u), can=n=>mine.some(a=>a.n===n&&!a.off);
  const allies=live("party"), foes=live("foe"), others=allies.filter(a=>a!==u), weakest=lowest(allies);
  if(u.berserk>0)return bestAttack(u,foes);
  const fallen=S.units.filter(x=>x.side==="party"&&x.hp<=0); if(can("Revive")&&fallen.length)return["Revive",fallen[0]];
  const fm=foes.flatMap(f=>f.moves);
  const physThreat=fm.some(m=>m.kind==="phys"&&!m.all), magicThreat=fm.some(m=>m.kind==="magic"&&!m.all), shadowThreat=fm.some(m=>m.el==="Ata");
  if(can("Purification")){const doomed=allies.find(a=>a.status.zombie||a.status.doom);const p=doomed||(frac(weakest)<.25?weakest:null);if(p)return["Purification",p]}
  if(carries(u,"meat")){const hungry=targetsFor(u,A("Meat")).filter(a=>frac(a)<.45&&!a.status.zombie);if(hungry.length)return["Meat",lowest(hungry)]}
  /* A Potion is spent only by someone with no Cure, and only when an ally is badly hurt. */
  if(carries(u,"potion")&&!has(u,"Lau")){const hurt=allies.filter(a=>frac(a)<.35&&!a.status.zombie);if(hurt.length)return["Potion",lowest(hurt)]}
  if(has(u,"Lau")){
    const hurt=allies.filter(a=>frac(a)<.45&&!a.status.zombie); if(hurt.length)return["Cure",lowest(hurt)];
    const sick=allies.find(a=>a.status.sleep||a.status.poison); if(sick)return["Esuna",sick]}
  if(can("Celestial Mirror")&&magicThreat&&frac(weakest)<.8)return["Celestial Mirror",u];
  if(has(u,"Wai")&&physThreat&&!allies.some(a=>a.guard&&a.guard.kind!=="reflect")){
    if(can("Counter Guard")&&frac(weakest)<.7)return["Counter Guard",u];
    if(can("Spring Guard")&&frac(weakest)<.7&&!weakest.status.zombie)return["Spring Guard",u];
    const other=others.length?lowest(others):null;
    if(other&&frac(other)<.7){
      if(can("Provoke")){const blindable=foes.some(f=>f.moves.some(m=>m.kind==="phys")&&!f.status.blind&&!(f.immune||[]).includes("blind"));return[blindable&&can("Dirty Trick")?"Dirty Trick":"Provoke",u]}
      if(can("Sentinel"))return["Sentinel",u]}}
  if(can("Mug")){const rich=foes.filter(f=>f.loot);if(rich.length)return["Mug",rich.reduce((a,b)=>a.hp>=b.hp?a:b)]}
  if(can("Kill")){const big=foes.filter(f=>!f.boss&&f.hp>=140);if(big.length)return["Kill",big[0]]}
  if(can("Tidal Wave")&&foes.length>=2)return["Tidal Wave",u];
  if(can("Berserk")&&foes.reduce((s,f)=>s+f.hp,0)>100)return["Berserk",u];
  if(can("Were-tiger")&&foes.reduce((s,f)=>s+f.hp,0)>100)return["Were-tiger",u];
  if(can("Blessing")&&!allies.some(a=>a.status.protect||a.status.shell)&&foes.reduce((s,f)=>s+f.hp,0)>150)return["Blessing",u];
  if(can("Protect")){const bare=allies.filter(a=>!a.status.protect&&frac(a)<.8);if(physThreat&&bare.length)return["Protect",lowest(bare)]}
  if(can("Shell")){const bare=allies.filter(a=>!a.status.shell&&frac(a)<.8);if(magicThreat&&bare.length)return["Shell",lowest(bare)]}
  if(can("Regen")){const hurt=allies.filter(a=>!a.status.regen&&!a.status.zombie&&frac(a)<.6);if(hurt.length)return["Regen",lowest(hurt)]}
  if(has(u,"La")){
    if(shadowThreat&&!weakest.ward&&frac(weakest)<.8)return["Shaka's Light",weakest];
    const slow=allies.find(a=>a.haste===0&&(has(a,"Ahi")||has(a,"Mana"))); if(slow)return["Haste",slow]}
  if(has(u,"Ata")){
    const big=foes.reduce((a,b)=>a.hp>=b.hp?a:b), trio=["blind","sleep","poison"];
    const missing=trio.filter(s=>!big.status[s]&&!(big.immune||[]).includes(s));
    if(can("Regen and Poison")&&frac(u)<.7&&!u.status.regen&&missing.includes("poison"))return["Regen and Poison",big];
    if(can("Haste and Slow")&&big.hp>60&&!big.status.slow&&!(big.immune||[]).includes("slow")&&u.haste===0)return["Haste and Slow",big];
    if(can("Triple Trouble")&&big.hp>30&&missing.length>=2)return["Triple Trouble",big];
    if(big.hp>40&&missing.length){const order=big.hp>60?["poison","blind","sleep"]:["blind","sleep"];
      for(const s of order)if(missing.includes(s)&&!(s==="sleep"&&foes.length<2))return[s[0].toUpperCase()+s.slice(1),big]}}
  return bestAttack(u,foes);
}
/* Otherwise: whatever hits hardest per unit of wait, counting Drain and Hunt's healing. */
const bestAttack=(u,foes)=>attackPlan(u,foes).best;
function attackPlan(u,foes){
  const opts=[["Attack","phys",C.attack,null]];
  if(has(u,"Ahi"))opts.push([u.name===WHO.jago?"Flame Slash":"Flame Kick","phys",C.elem,"Ahi"]);
  if(has(u,"Mana"))opts.push(["Spirit Blast","magic",C.elem,"Mana"]);
  SHARED.moves.filter(m=>m.needs&&m.needs.every(e=>has(u,cap(e)))).forEach(m=>opts.push([m.name,m.effect==="physical"?"phys":"magic",m.power,cap(m.element)]));
  SHARED.moves.filter(m=>m.tier==="element"&&(m.owner&&WHO[m.owner]===u.name||(m.also||[]).some(x=>WHO[x]===u.name))&&m.power&&!opts.some(o=>o[0]===m.name)).forEach(m=>opts.push([m.name,m.effect==="physical"?"phys":"magic",m.power,cap(m.element)]));
  if(u.name===A("Throw").sp&&throwable(u))opts.push(["Throw","phys",ITEM[throwable(u)].power,"Ahi"]);
  for(const [n,k,p,e] of [["Flare","magic",C.flare,"Ahi"],["Drain","magic",C.drain,"Lau"],["Hunt","phys",C.hunt,"Ahi"]])
    if(u.name===A(n).sp)opts.push([n,k,p,e]);
  const missing=u.max-u.hp; let best=null,score=-1;
  for(const [n,k,p,e] of opts)for(const f of foes){
    const dmg=Math.min(p*(n==="Hunt"&&f.beast?C.huntBeast:1)*mult(e,f.element)*(k==="phys"?up(u.st.str)*down(f.st.vit)*(u.berserk>0?C.berserkPow:1):up(u.st.mag)*down(f.st.spr)),f.hp); let s=dmg;
    if(k==="phys"){if(u.status.blind)s*=1-C.blindMiss; if(f.status.sleep)s*=.5}
    if(!u.status.zombie){if(n==="Drain")s+=Math.min(dmg/2,missing); if(n==="Hunt"&&f.beast)s+=Math.min(dmg,missing)}
    s/=A(n).c; if(s>score){score=s;best=[n,f]}}
  return {best,score};
}

/* The swapping autopilot. Returns who should come in this turn, or null. At most one swap a turn, checked in order. */
function pickSwap(){
  const u=byId(S.active); if(!u||u.side!=="party"||u.berserk>0)return null;
  const bench=(S.bench||[]).filter(b=>b.hp>0); if(!bench.length)return null;
  const front=S.units.filter(x=>x.side==="party"), up=front.filter(x=>x.hp>0), foes=live("foe");
  const go=n=>n;
  const revives=x=>actionsFor(x).some(a=>a.n==="Revive"), heals=x=>has(x,"Lau"), score=x=>attackPlan(x,foes).score;
  // 1. Someone on the field is down and nobody there can revive: bring in whoever can.
  if(front.some(x=>x.hp<=0)&&!up.some(revives)){const h=bench.find(revives);if(h)return go(h)}
  // 2. Someone is hurt and nobody on the field can heal: bring in the healthiest healer.
  if(up.some(x=>frac(x)<.45)&&!up.some(heals)){const hs=bench.filter(heals);if(hs.length)return go(hs.reduce((a,b)=>frac(a)>=frac(b)?a:b))}
  // Never send away the only healer on the field.
  if(heals(u)&&up.filter(heals).length===1)return null;
  // 3. Nearly down: step out to rest and send in the hardest hitter who is still fresh.
  const fresh=bench.filter(b=>frac(b)>.6);
  if(frac(u)<.25&&fresh.length)return go(fresh.reduce((a,b)=>score(a)>=score(b)?a:b));
  // 4. The wrong elements for this fight: someone healthy on the bench hits at least half again as hard.
  const ok=bench.filter(b=>frac(b)>.5); if(!ok.length)return null;
  const best=ok.reduce((a,b)=>score(a)>=score(b)?a:b);
  if(score(best)>1.5*score(u))return go(best);
  return null;
}

/* The Autopilot switch: on a party turn, after the playback, the autopilot picks for you. "swap" also lets it swap. */
function autoStep(token){
  if(!S.auto||S.busy||S.over||S.pending||S.screen!=="battle"||S.token!==token)return; const u=byId(S.active); if(!u||u.side!=="party")return;
  if(S.auto==="swap"){const n=pickSwap(); if(n){swap(n.id); setTimeout(()=>autoAct(token),700*SPEEDS[S.speed]); return}}
  autoAct(token) }
/* One swap at most, as in the sweep, then the action that ends the turn. */
function autoAct(token){
  if(!S.auto||S.busy||S.over||S.pending||S.screen!=="battle"||S.token!==token)return; const u=byId(S.active); if(!u||u.side!=="party")return;
  const [name,t]=choose(u), a=actionsFor(u).find(x=>x.n===name)||A(name); act(a,a.tg==="none"?u:t) }
const autoLater=()=>{const tk=S.token; setTimeout(()=>autoStep(tk),450*SPEEDS[S.speed])};

/* ---- drawing ---- */
const card=id=>$("u"+id);
const unitCard=u=>`<div class="unit ${u.side==="foe"?"foe":""}" id="u${u.id}" data-u="${u.id}"><span class="upic">${pic(u)}</span><div class="ubody"><div class="top"><span class="name">${nm(u)}</span><span class="hpt"></span></div><div class="bar"><i></i></div><div class="chips"></div></div></div>`;
function build(){
  const sp=Object.keys(SPEEDS).map(k=>`<button class="small ${S.speed===k?"on":""}" data-speed="${k}">${k}</button>`).join("");
  const ap=[["","Off"],["play","Plays"],["swap","Plays and swaps"]].map(([k,l])=>`<button class="small ${(S.auto||"")===k?"on":""}" data-auto="${k||"off"}">${l}</button>`).join("");
  const mk=unitCard;
  app.innerHTML=`<div class="rowx"><div class="chips" id="speeds"><span class="muted">Playback</span>${sp}</div><div class="chips" id="autos"><span class="muted">🤖 Autopilot</span>${ap}</div><button class="small" data-do="setup">Leave fight</button></div>
  <div class="battle">
   <div class="side">
    <section class="panel orderbox"><h2 id="ordh">Turn order</h2><div class="order" id="ord"></div></section>
    <section class="panel logbox"><h2>Log</h2><div class="log" id="log"></div></section>
   </div>
   <div class="col field">
    <section class="panel"><div class="banner" id="banner" aria-live="polite"></div></section>
    <div class="sides"><section class="panel" id="partyp"><h2>Party</h2>${S.units.filter(u=>u.side==="party").map(mk).join("")}</section>
    <section class="panel"><h2>Enemies</h2>${S.units.filter(u=>u.side==="foe").map(mk).join("")}</section></div>
    <section class="panel" id="menu"></section>
   </div></div>` }
function paint(sn){
  sn.units.forEach(s=>{const u=byId(s.id),el=card(s.id),f=s.hp/u.max,st=[];
    for(const k in s.status)st.push(chip(k==="poison"?"poison":k==="regen"?"Lau":"none",ST[k]+(COUNTED.includes(k)?" "+s.status[k]:"")));
    if(s.ward)st.push(chip("La","🌟 Shaka's Light")); if(s.haste)st.push(chip("La",`⚡ haste ${s.haste}`)); if(s.berserk)st.push(s.tiger?chip("La",`🐯 tiger ${s.berserk}`):chip("Ahi",`😤 berserk ${s.berserk}`)); if(s.defend)st.push(chip("none","🛡️ defending")); if(s.ready)st.push(chip("La","🤝 ready for a combo"));
    if(s.guard)st.push(chip(s.guard==="reflect"?"La":s.guard==="trap"?"Ata":"Wai",{provoke:"😈 Provoking",trap:"😈 Dirty Trick ready",sentinel:"🛡️ Sentinel up",counter:"🛡️ Counter Guard up",spring:"🛡️ Spring Guard up",reflect:"🪞 Mirror up"}[s.guard]));
    const els=u.side==="party"?u.elements.map(e=>chip(e)).join(""):chip(u.element)+(u.boss?chip("none","👑 boss"):"")+(u.beast?chip("none","🐾 beast"):"");
    el.querySelector(".hpt").textContent=`${s.hp} / ${u.max}`;
    const bar=el.querySelector(".bar i"); bar.style.width=f*100+"%"; bar.className=f<.35?"low":"";
    el.querySelector(".chips").innerHTML=els+st.join("");
    el.classList.toggle("dead",s.hp<=0); el.classList.toggle("active",s.id===sn.active&&s.hp>0) });
  paintOrder(sn.rows) }
function paintOrder(list,label){
  const box=$("ord"),old={}; box.querySelectorAll(".slot").forEach(e=>old[e.dataset.k]=e.getBoundingClientRect());
  $("ordh").textContent=label||"Turn order";
  box.innerHTML=list.map(r=>`<div class="slot ${r.side==="foe"?"foe":""} ${r.now?"now":r.id===S.active?"me":""}" data-k="${r.key}">${r.now?"▶ ":""}${r.pic||""}${r.name}</div>`).join("");
  if(calm())return;
  box.querySelectorAll(".slot").forEach(e=>{const o=old[e.dataset.k],n=e.getBoundingClientRect();
    if(!o)e.animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"none"}],{duration:220});
    else{const dx=o.left-n.left,dy=o.top-n.top;if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:300,easing:"cubic-bezier(.2,.8,.2,1)"})}}) }
function fx(ev){
  document.querySelectorAll(".unit.acting").forEach(e=>e.classList.remove("acting"));
  if(ev.a!=null&&card(ev.a))card(ev.a).classList.add("acting");
  if(ev.t==null||!card(ev.t))return; const el=card(ev.t);
  if((ev.fx||"").startsWith("hit")){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
  if(ev.fx==="heal"){el.classList.remove("glowheal");void el.offsetWidth;el.classList.add("glowheal")}
  if(ev.num!=null){const f=document.createElement("span");f.className="float "+(ev.fx||"status");f.textContent=ev.num;el.appendChild(f);setTimeout(()=>f.remove(),1050);SND.blip(ev.fx)} }
function addLog(ev){ const lg=$("log"),d=document.createElement("div"); if(ev.cls)d.className=ev.cls; d.textContent=ev.msg; lg.appendChild(d); lg.scrollTop=lg.scrollHeight }
async function play(){
  S.busy=true; paintMenu(); const q=S.queue; S.queue=[]; if(q.length)q[q.length-1].snap=snap();
  const token=S.token=(S.token||0)+1;
  for(const ev of q){ if(S.token!==token||S.screen!=="battle")return;
    if(ev.party){const box=$("partyp"),tmp=document.createElement("div"); tmp.innerHTML=ev.party;
      const after=[...tmp.querySelectorAll(".unit")].map(e=>e.dataset.u), before=[...box.querySelectorAll(".unit")].map(e=>e.dataset.u);
      const going=[...box.querySelectorAll(".unit")].filter(e=>!after.includes(e.dataset.u));
      if(!calm()&&going.length){await Promise.all(going.map(swapOut)); if(S.token!==token||S.screen!=="battle")return}
      box.innerHTML="<h2>Party</h2>"+ev.party; box.querySelectorAll(".unit").forEach(e=>{if(!before.includes(e.dataset.u))swapIn(e)})}
    addLog(ev); $("banner").textContent=ev.msg; paint(ev.snap); fx(ev);
    await sleep((ev.cls==="turn"?420:ev.big?800:720)*SPEEDS[S.speed]) }
  if(S.token!==token||S.screen!=="battle")return;
  document.querySelectorAll(".unit.acting").forEach(e=>e.classList.remove("acting"));
  S.busy=false; const u=byId(S.active);
  if(!S.over)$("banner").textContent=S.auto?`${u.name}'s turn. The autopilot is choosing.`:`${u.name}'s turn. Choose a command.`;
  paintMenu(); if(S.auto&&!S.over)autoLater() }
/* The command menu, FFX style (Frankie, 10/8). Commands down the left third, never more than five (D-181): Attack,
   Techniques, Item, Defend, Swap. The right two thirds show what the command holds. Pointing at a command shows it; clicking or
   tapping chooses it and keeps it showing. Attack goes straight to choosing a target and Defend acts at once.
   Techniques holds every move: a combo first when one is ready, then physical moves (red edge), then magic (purple
   edge). Cure and Esuna follow the healer (D-095): physical for someone who heals with medicine (Lau with Ahi or
   Wai), magic for someone who heals with magic. */
const medicine=u=>u.elements.includes("Lau")&&u.elements.some(e=>e!=="Lau"&&MATERIAL.includes(e));
const menuOf=(u,a)=>a.menu==="heal"?(medicine(u)?"skill":"magic"):a.menu;
const CMDS=[["attack","⚔️ Attack"],["tech","✨ Techniques","var(--mana)"],["item","🎒 Item","var(--hp)"],["defend","🛡️ Defend"],["swap","🔄 Swap"]];
function abilityBtn(u,a){const i=ACTIONS.indexOf(a),dis=a.off||(a.tg!=="none"&&!targetsFor(u,a).length)||(a.n==="Throw"&&!throwable(u));
  return `<button class="itm" style="--k:var(${menuOf(u,a)==="skill"?"--ahi":"--mana"})" data-a="${i}" ${dis?"disabled":""}><span class="row"><b>${a.n}</b><span class="chips">${a.el?chip(a.el):""}<span class="wait">wait ${costFor(u,a.c)}</span></span></span><span class="d">${statChip(a.st)}${a.d}${a.off?" Not in the game yet.":""}</span></button>`}
const inMenu=(u,k)=>actionsFor(u).filter(a=>!a.item&&a.menu&&menuOf(u,a)===k);
const techs=u=>[...inMenu(u,"skill"),...inMenu(u,"magic")];
const comboBtn=(u,{cb,p})=>`<button class="itm" style="--k:var(--la)" data-combo="${cb.id}|${p.id}"><span class="row"><b>🤝 ${cb.name} <span class="muted">with ${p.name}</span></b><span class="chips">${cb.elements.map(e=>chip(cap(e))).join("")}<span class="wait">wait ${costFor(u,C.element)} each</span></span></span><span class="d">${cb.description} Uses up ${p.name}'s ${p.ready?"ready ":"next "}turn too.</span></button>`;
function ctxHTML(u){
  if(S.pending){const a=S.pending,ts=targetsFor(u,a);
    return `<h2>${a.n}: choose a target</h2><p class="muted">Or click a card above.</p><div class="menu">${ts.map(t=>`<button data-t="${t.id}"><span class="row"><b>${nm(t)}${t===u?" (self)":""}</b><span class="hpt">${t.hp} / ${t.max}</span></span></button>`).join("")}<button data-do="back">Back</button></div>`}
  const c=S.cmd;
  if(c==="attack"||c==="defend"){const a=A(c==="attack"?"Attack":"Defend");return `<h2>${CMDS.find(x=>x[0]===c)[1]}</h2><div class="menu">${abilityBtn(u,a)}</div>`}
  if(c==="tech"){const l=techs(u),cs=combosFor(u);return `<h2>✨ Techniques</h2>${l.length||cs.length?`<div class="menu">${cs.map(x=>comboBtn(u,x)).join("")}${l.map(a=>abilityBtn(u,a)).join("")}</div>`:`<p class="muted">${u.name} has none.</p>`}`}
  if(c==="item"){const its=actionsFor(u).filter(a=>a.item);
    return `<h2>🎒 ${u.name}'s pockets</h2>${its.length?`<div class="menu">${its.map(a=>{const i=ACTIONS.indexOf(a),n=u.pocket.filter(k=>k===a.item).length,dis=!targetsFor(u,a).length;
      return `<button class="itm" style="--k:${kc(a.item)}" data-a="${i}" ${dis?"disabled":""}><span class="row"><b>${ITEM[a.item].icon} ${a.n} x${n}</b><span class="wait">wait ${costFor(u,a.c)}</span></span><span class="d">${statChip(a.st)}${a.d}</span></button>`}).join("")}</div>`
      :`<p class="muted">Nothing in ${u.name}'s pockets. Fill them on the Bag tab before a fight.</p>`}`}
  if(c==="swap"){const bench=S.bench||[];
    return `<h2>🔄 Swap ${u.name} for</h2><p class="muted">Free, and it is still this turn.</p><div class="bench">${bench.map(b=>`<button data-swap="${b.id}"${b.hp<=0?" disabled":""}>${face(b.name,1)}<span class="who"><b>${b.name}</b><span class="chips">${b.elements.map(e=>chip(e)).join("")}<span class="hpt">${b.hp}/${b.max}</span>${Object.keys(b.status).map(k=>chip(k==="poison"?"poison":"none",ST[k])).join("")}</span></span></button>`).join("")}</div>`}
  return `<p class="muted">Point at a command to see what it holds. Click or tap to choose it.</p>` }
function cmdsHTML(u){
  const ok={attack:true,defend:true,tech:techs(u).length>0||combosFor(u).length>0,item:actionsFor(u).some(a=>a.item),swap:(S.bench||[]).some(b=>b.hp>0)};
  return CMDS.map(([k,l,col])=>{const a=k==="attack"?A("Attack"):k==="defend"?A("Defend"):null;
    return `<button class="cmd ${S.cmd===k?"on":""}" data-cmd="${k}"${a?` data-a="${ACTIONS.indexOf(a)}"`:""}${col?` style="--k:${col}"`:""} ${ok[k]?"":"disabled"}>${l}</button>`}).join("")}
/* Redraw only the right side, so pointing at commands does not rebuild the left column under the pointer. */
function paintCtx(){ const u=byId(S.active); if(!$("ctx"))return; $("ctx").innerHTML=ctxHTML(u);
  document.querySelectorAll("#cmds .cmd").forEach(b=>b.classList.toggle("on",b.dataset.cmd===S.cmd));
  document.querySelectorAll(".unit.pick,.unit.aim").forEach(e=>e.classList.remove("pick","aim"));
  if(S.pending)targetsFor(u,S.pending).forEach(t=>card(t.id).classList.add("pick")) }
function paintMenu(){
  const m=$("menu"),u=byId(S.active); document.querySelectorAll(".unit.pick,.unit.aim").forEach(e=>e.classList.remove("pick","aim"));
  if(S.busy){m.innerHTML=`<p class="muted">Watching the action...</p>`;return}
  if(S.over&&S.embed){m.innerHTML=`<div class="chips"><button class="go" data-do="storyback">Continue</button></div>`;return}
  if(S.over){m.innerHTML=`<div class="chips"><button class="go" data-do="again">Fight again</button><button data-do="setup">Change party</button></div>`;return}
  if(S.auto){m.innerHTML=`<p class="muted">🤖 The autopilot is playing ${u.name}${S.auto==="swap"?", and may swap with the bench":""}. Turn it off above to take over.</p>`;return}
  m.innerHTML=`<h2>${u.name}'s turn</h2><div class="cmdwrap"><div class="cmds" id="cmds">${cmdsHTML(u)}</div><div class="ctx" id="ctx"></div></div>`;
  paintCtx() }
/* ---- profiles and bestiary. Character text is condensed from their articles in lore/person/. ---- */
const PROFILE={
 "Kailo the Cook":{name:"Kailo",title:"the Wandering Chef",text:"A young cook from a small village in Māla Iki, selling food between islands from his own small boat. He starts out fighting with whatever is in the kitchen, knives, rolling pins and pot lids, and later merges Olola's Lelua and Genemon's Wai'Kenpō into a martial art of his own. Warm and optimistic on the outside, quietly anxious underneath."},
 "Holy Hina":{name:"Hina",title:"the Māla Priestess",text:"A devout young priestess of Shaka from Māla Iki: proud, ambitious, and far easier to provoke than her calm suggests. She was born in Kota Emas and must make a pilgrimage back to its golden temple to become high priestess of her village. A vegetarian, as is common among devotees of Lanu."},
 "Granny Tawiri":{name:"Tawiri",title:"the Elderly Caller",text:"An old caller of the dead from the gloomy Matua Archipelago, cynical and morbidly funny, to Hina's chagrin. She has lived too long in the company of the dead. Her staff doubles as a walking stick, hung with feathers and skulls. The third to join the party."},
 "Master Genemon":{name:"Genemon",title:"the Spring Guardian",text:"An old Kame from the Kame Kingdom, and the first Kame that Kailo and Hina ever meet. A master of Wai'Kenpō and of healing medicine, laid back and realistic. He gets on with Tawiri for their shared years, even when they disagree. Like most Kame he eats fish but no other meat."},
 "Dancer Olola":{name:"Olola",title:"the Fire Dancer",text:"A southern Nuitagata met in the Fire Islands. Intense, loud and dramatic, with no sense of humor or tact. A devout follower of Mauga with no belief in Shaka, she fights with Lelua, an acrobatic fire martial art."},
 "Maika the Sage":{name:"Maika",title:"the Maki Sage",text:"A young Maki Sage, first met in Māla Iki but joining later. Calm, well spoken and unusually worldly, but acerbic, a little arrogant, and fonder of flirting and drinking than a sage should be. He can admit when he is wrong. It is hard to tell when he is needling Hina on purpose."},
 "Prof. Sarjana":{name:"Sarjana",title:"the Archeologist",text:"A curious, bespectacled member of the archeological society, of Bandari ancestry, from the Matahari Atoll. The party finds him in the Lanuloa ruins running for his life from a stone golem his curiosity woke up. Skeptical and analytical, and brave while terrified."},
 "Hunter Leilagi":{name:"Leilagi",title:"the Huntress",text:"A serious, practical survivalist met in the Fire Islands, a southern Nuitagata with boar features: larger lower canines, boar ears and a thin tail. Devoted to Mauga and Lanu, not Shaka. Unlike many devotees of Lanu, she eats meat."},
 "Kiki Kaboom":{name:"Kiki",title:"the Witch Doctor",text:"Young, spunky and morbid, from the Matua Archipelago, with fingers stained from potion making and a record of accidental explosions. Of Vanara Bandari ancestry in a place of native Nuitai, which always made her feel like an outsider. She looks up to Tawiri."},
 "Zealot Damar":{fam:"Damar",given:"Jago",title:"the Zealot",text:"From the Matahari Atoll, of Bandari ancestry, but met much sooner than that. Stubborn, and he starts out as an antagonist because of a misunderstanding. He goes by Damar, his family name, as Bandari do; only close friends call him Jago. Damar is the Bandhasa word for tree resin and the torch made from it, and Jago is a champion, literally a fighting rooster."},
 "Tiger Karvara":{fam:"Karvara",given:"Citra",title:"the Apostate",text:"A Bandari of the Matahari Atoll, cast out of the Shakan faith for carrying the Cindaku curse, which turns him into a tiger. He never stopped believing, and keeps the observances alone. He hides in Tokelau, the frozen north, because its endless cloud keeps the sun, and the curse, away. He goes by Karvara, his family name, as Bandari do. Only people close to him call him Citra, and almost nobody is."},
 "The Luminary":{name:"Tahji",title:"the Luminary",text:"The spiritual leader of Kota Emas. By tradition the Luminary's face is never seen: he appears veiled, and people hear his voice but never see his face. This Luminary has not been seen in public at all. The temple says he is ill, and his audiences are held through a curtain, with an old priest repeating his words."},
 "Paku the Pilot":{name:"Paku",title:"the Navigator",text:"A big, loud old sailor and master chef with greying red hair. Years ago he left home to explore the seas, and he has been nearly everywhere: the frozen waters of Tokelau, and surfing near the eye of the Great Maelstrom. He learned Wai'Kenpō from the Kame and casts water magic through Mana. He laughs in the face of storms. He gives the party a bigger ship and becomes their guide."},
 "Agent Asap":{fam:"Asap",given:"Setia",title:"the Penyamun Agent",text:"A Ranagata frog man whose people are from Lanuloa, raised in Kota Emas, far from their forests. A devout Shakan, fiercely loyal to the Matahari government. Friendly, cold and calculated: his faith is his morals, taken from outside. He breathes fire as a trick. His name is Bandari and given family name first, the way the people who raised him do it: Asap is smoke, Setia is loyal."},
 "Capt. Kirasame":{fam:"Kirasame",given:"Ren",title:"the Pirate Captain",text:"Kirasame Ren, the Killer Shark, captain of the Blood Lotus pirates of the Bayang Seas. A master of Sila swordplay who wins by any means: a concealed pistol here, a poison-tipped dagger there. Her father was Ikagata, so she has gills and rows of teeth that can chew through steel. Ruthless, but a fair captain. She goes by Kirasame, her family name, as Bandari do, and her crew call her Captain Kirasame."}
};
/* Bestiary text comes from the shared battle file, so the pygame game shows the same words. */
const BEAST=Object.fromEntries(SHARED.bestiary.map(b=>[b.name,b.description]));
const STATK=[["hp","HP","--hp","how much you can take"],["str","Strength","--ahi","physical damage"],["mag","Magic","--mana","magic damage, healing"],["vit","Vitality","--wai","less physical damage"],["spr","Spirit","--la","less magic damage"],["spd","Speed","--accent","shorter waits"]];
const weakTo=el=>Object.keys(BEATS).find(k=>BEATS[k]===el);
function statRows(st,hp,fixed){return `<div class="statrows">${STATK.map(([k,l,c,h])=>{const v=st[k],own=fixed&&k==="hp";return `<div class="sr" style="--c:var(${c})"><span class="k">${l}<small>${own?"set for each monster":h}</small></span><span class="b"${own?' style="background:none"':""}><i style="width:${own?0:Math.min(100,v/20*100)}%"></i></span><span class="v">${k==="hp"&&hp!=null?hp:v}</span></div>`}).join("")}</div>`}
function abilityCard(a){return `<div class="ab ${a.sp?"sp":""}"><div class="row"><b>${a.n}</b><span class="chips">${a.el?chip(a.el):chip("none","basic")}<span class="wait">wait ${a.c}</span></span></div><span class="d">${statChip(a.st)}${a.d}${a.off?" Not in the game yet.":""}</span></div>`}
function charsPage(){
  const n=S.prof||"Kailo the Cook", P=PROFILE[n]||{title:"",text:""}, st=statsFor(ROSTER[n]);
  const who={name:n,elements:ROSTER[n]}, abil=ACTIONS.filter(a=>a.sp?a.sp===n:!a.item&&a.n!=="Defend"&&a.ok(who)).sort((x,y)=>!!y.sp-!!x.sp);
  return `<section class="panel"><div class="plist">${Object.keys(ROSTER).map(k=>`<button data-prof="${k}" class="${k===n?"on":""}">${face(k,1)}${k}</button>`).join("")}</div></section>
  <section class="panel prof">
   <div class="ph">${PORTRAIT[n]?`<img class="face xl" src="${PORTRAIT[n]}" alt="">`:""}<div class="col" style="gap:6px"><h2>${P.fam?`<span class="nm">${[["fam",P.fam,"family name"],["giv",P.given,"given name"]].map(([c,w,l])=>`<span class="${c}">${w}<small>${l}</small></span>`).join("")}</span>`:(P.name||n)} <span class="t">${P.title}</span></h2><span class="chips">${ROSTER[n].map(e=>chip(e,EL[e]+" "+e)).join("")}${FISH.has(n)?`<span class="chip veg-chip">🐟 Pescatarian</span>`:VEG.has(n)?`<span class="chip veg-chip">🌿 Vegetarian</span>`:""}</span></div></div>
   <p>${P.text}</p>
   <h3>Stats</h3>${statRows(st,st.hp*C.hp/10)}
   <h3>✨ Techniques</h3><div class="abl">${[...abil.filter(a=>a.n==="Attack"||menuOf(who,a)==="skill"),...abil.filter(a=>a.n!=="Attack"&&menuOf(who,a)==="magic")].map(abilityCard).join("")}</div>
   <p class="note">Combos show up under Techniques when a partner is ready: the ally with the very next turn, or one who Defended. Everyone also has Defend, can swap with the bench on their turn, and can use whatever is in their pockets. Lau characters refuse Meat, except Leilagi.</p>
  </section>`;
}
function bestiary(){
  const B={};
  Object.entries(ENC).forEach(([enc,list])=>list.forEach(m=>{const base=m[0].replace(/ [A-Z]$/,"");
    const b=B[base]||(B[base]={name:base,icon:FOE[base.split(" ")[0]]||"",spr:ART.sprites[m[8]]?m[8]:null,variants:[],encs:new Set(),m});
    b.encs.add(enc); if(!b.variants.some(v=>v.el===m[2]))b.variants.push({el:m[2],hp:Math.round(m[1]*C.mHP),st:statsFor(m[7]?[m[2],m[2]]:[m[2]])})}));
  return B;
}
function moveCard(x,tot){
  const bits=[x.kind==="phys"?chip("none","👊 physical"):chip("none","✨ magic"),x.el?chip(x.el,EL[x.el]+" "+x.el):"",x.all?chip("none","hits everyone"):"",...x.status.map(s=>chip(s==="poison"?"poison":"none",ST[s]||s))].join("");
  return `<div class="ab"><div class="row"><b>${x.name}</b><span class="wait">wait ${x.cost}</span></div><span class="chips">${bits}</span><span class="d">${x.power?`Power ${x.power}. `:"No damage. "}Used about ${Math.round(x.w/tot*100)}% of the time.</span></div>`}
function beastsPage(){
  const B=bestiary(), names=Object.keys(B), n=S.beast&&B[S.beast]?S.beast:names[0], b=B[n], m=b.m, tot=m[3].reduce((s,x)=>s+x.w,0);
  const stats=b.variants.length>1?`<div style="overflow-x:auto"><table class="stbl"><tr><th></th>${b.variants.map(v=>`<th>${chip(v.el,EL[v.el]+" "+v.el)}</th>`).join("")}</tr>${STATK.map(([k,l,c])=>`<tr><td style="color:var(${c});font-weight:700">${l}</td>${b.variants.map(v=>`<td class="n">${k==="hp"?v.hp:v.st[k]}</td>`).join("")}</tr>`).join("")}</table></div>`
    :statRows(b.variants[0].st,b.variants[0].hp,true);
  const facts=[m[7]?chip("none","👑 boss"):"",m[4]?chip("none","🐾 beast"):"",...(m[5]||[]).map(s=>chip("none","immune to "+s)),m[6]?chip("poison",`poison only takes ${Math.round(m[6]*100)}% a turn`):""].join("");
  const weak=b.variants.map(v=>`<span class="chips">${chip(v.el,EL[v.el]+" "+v.el)} is weak to ${chip(weakTo(v.el),EL[weakTo(v.el)]+" "+weakTo(v.el))} and resists ${chip(BEATS[v.el],EL[BEATS[v.el]]+" "+BEATS[v.el])}</span>`).join("");
  return `<section class="panel"><div class="plist">${names.map(k=>`<button data-beast="${k}" class="${k===n?"on":""}">${B[k].spr?sprite(B[k].spr,1):B[k].icon+" "}${k}</button>`).join("")}</div></section>
  <section class="panel prof">
   <div class="ph"><span class="big" aria-hidden="true">${b.spr?sprite(b.spr):b.icon}</span><div class="col" style="gap:6px"><h2>${n}</h2><span class="chips">${facts}</span><span class="muted">Found in: ${[...b.encs].join(", ")}</span></div></div>
   <p>${BEAST[n]||""}</p>
   <p class="note">A stand-in. The name is from Philippine folklore, the picture is from Merchant Shade's free creature pack, and the moves are test moves. Not Nuitai lore.</p>
   <h3>Elements</h3><div class="col" style="gap:4px">${weak}</div>
   <h3>Stats</h3>${stats}
   <h3>Moves</h3><div class="abl">${m[3].map(x=>moveCard(x,tot)).join("")}</div>
  </section>`;
}
/* The Bag tab: the shared bag on top, then every character's pockets, bench included, since anyone can swap in. */
const itemChip=(k,n)=>`<span class="it" style="--k:${kc(k)}">${ITEM[k].icon} ${ITEM[k].name}${n!=null?" x"+n:""}</span>`;
function pocketCard(n){
  const p=INV.pockets[n], full=p.length>=SLOTS, inBag=Object.keys(INV.bag).filter(k=>INV.bag[k]>0);
  const slots=Array.from({length:SLOTS},(_,i)=>p[i]?`<button class="pi" style="--k:${kc(p[i])}" data-unpack="${n}|${i}" title="Put it back in the bag">${ITEM[p[i]].icon} ${ITEM[p[i]].name}</button>`:`<span class="pe">empty</span>`).join("");
  const adds=inBag.map(k=>`<button class="small" data-pack="${n}|${k}" ${full?"disabled":""}>+ ${ITEM[k].icon} ${ITEM[k].name}</button>`).join("");
  return `<div class="pk"><div class="pkh">${face(n,1)}<b>${n}</b><span class="chips">${ROSTER[n].map(e=>chip(e)).join("")}</span><span class="muted">${p.length} of ${SLOTS}</span></div><div class="pslots">${slots}</div>${adds?`<div class="chips">${adds}</div>`:""}</div>`}
function bagPage(){
  const inBag=Object.keys(INV.bag).filter(k=>INV.bag[k]>0);
  return `<section class="panel"><div class="rowx"><h2>🎒 The bag</h2><button class="small" data-do="refill">Back to the starting bag</button></div>
   <p class="muted">The whole party shares it, and it holds as much as you like, but it cannot be opened in a fight. In a fight each character can use only what is in their own pockets, ${SLOTS} things each, the way Dragon Quest does it.</p>
   <div class="chips">${inBag.length?inBag.map(k=>itemChip(k,INV.bag[k])).join(""):`<span class="muted">Empty.</span>`}</div>
   <div class="itl">${ITEMS.map(it=>`<div style="--k:${kc(it.id)}"><b>${it.icon} ${it.name}</b>: ${statChip(statOf(it))}${it.description}</div>`).join("")}</div></section>
  <section class="panel"><h2>Pockets</h2><p class="muted">Click a carried thing to put it back in the bag. A character on the bench keeps their pockets and brings them when they swap in. Meat from a Hunt goes in Leilagi's pockets, or the bag when hers are full.</p>
   <div class="pockets">${Object.keys(ROSTER).map(pocketCard).join("")}</div></section>`}
/* The picker's stat line. A stat at 15 or more is that character's strength, so it is bolded. */
function statLine(els){const s=statsFor(els);
  return `<span class="sl">${[["HP",s.hp*C.hp/10,s.hp],["Str",s.str],["Mag",s.mag],["Vit",s.vit],["Spr",s.spr],["Spd",s.spd]].map(([k,v,raw])=>(raw??v)>=15?`${k} <b>${v}</b>`:`${k} ${v}`).join(" · ")}</span>`}
function setup(){
  const v=S.view||"fight", tabs=`<div class="tabs" role="tablist">${[["fight","⚔️ Fight"],["bag","🎒 Bag"],["chars","📖 Characters"],["beasts","🐾 Bestiary"]].map(([k,l])=>`<button class="tab ${v===k?"on":""}" role="tab" aria-selected="${v===k}" data-view="${k}">${l}</button>`).join("")}</div>`;
  if(v==="chars"){app.innerHTML=tabs+charsPage();return}
  if(v==="beasts"){app.innerHTML=tabs+beastsPage();return}
  if(v==="bag"){app.innerHTML=tabs+bagPage();return}
  const rb=(k,on,label)=>`<button class="small ${on?"on":""}" data-do="${k}">🎲 ${label}</button>`;
  app.innerHTML=tabs+`<section class="panel"><div class="rowx"><h2>Choose your characters</h2>${rb("rp",S.rndP,"Random")}</div><p class="muted">Pick three to start. Everyone else waits on the bench. On any party member's turn you can swap them for someone on the bench, for free, as often as you like. The turn ends when someone acts.</p>
  ${S.rndP?`<p class="muted">Three characters will be drawn when the fight starts.</p>`:`<div class="grid pgrid">${Object.keys(ROSTER).map(n=>`<button data-p="${n}" class="pc${S.picks.includes(n)?" on":""}">${face(n)||`<span class="face noface">?</span>`}<span class="pcw"><span class="chips">${ROSTER[n].map(e=>chip(e)).join("")}${dietMark(n)}</span><b>${n}</b></span></button>`).join("")}</div>
  <div class="chips"><span class="muted">🎒 Carrying:</span>${S.picks.map(n=>`<span class="muted"><b>${n}</b> ${INV.pockets[n].length?counted(INV.pockets[n]).map(([k,c])=>ITEM[k].icon+(c>1?"x"+c:"")).join(" "):"nothing"}</span>`).join("")}<button class="small" data-view="bag">Open the bag</button></div>`}</section>
  <button class="go" data-do="start" ${S.rndP||S.picks.length===3?"":"disabled"}>${S.rndP||S.picks.length===3?"FIGHT!":"Pick "+(3-S.picks.length)+" more"}</button>` }
function preview(a){ if(S.busy||S.over)return; S.preview=a; paintOrder(rows(a),a?`If ${byId(S.active).name} uses ${a.n}`:"Turn order") }

app.addEventListener("click",e=>{
  const c=e.target.closest(".unit.pick"); if(c&&S.pending&&!S.busy)return act(S.pending,byId(+c.dataset.u));
  const b=e.target.closest("button"); if(!b||b.disabled)return; const d=b.dataset;
  if(d.speed){S.speed=d.speed;try{localStorage.setItem("ctb-speed",d.speed)}catch(x){}
    $("speeds").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.speed===d.speed));return}
  if(d.swap)return swap(+d.swap);
  if(d.combo){if(S.busy||S.over)return; const [cid,pid]=d.combo.split("|"),a=comboAction(COMBO[cid],byId(+pid));
    if(a.tg==="none")return act(a,byId(S.active)); S.lock=true;S.pending=a;preview(a);return paintCtx()}
  if(d.pack){const [n,k]=d.pack.split("|");packItem(n,k);return setup()}
  if(d.unpack){const [n,i]=d.unpack.split("|");unpackItem(n,+i);return setup()}
  if(d.do==="refill"){resetInv();saveInv();return setup()}

  if(d.p){const i=S.picks.indexOf(d.p);if(i>=0)S.picks.splice(i,1);else if(S.picks.length<3)S.picks.push(d.p);return setup()}

<style>
/* A text game with visual novel pictures, drawn over the battle page. Class names start with st- to stay out of the battle's way. */
:root{ --st-sky1:#ffd9a8; --st-sky2:#9fd6e6; --st-sea:#2f8fb0; --st-sand:#f1dfb4 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --st-sky1:#5a3a52; --st-sky2:#1d3f57; --st-sea:#123c52; --st-sand:#4a4030 } }
:root[data-theme="dark"]{ --st-sky1:#5a3a52; --st-sky2:#1d3f57; --st-sea:#123c52; --st-sand:#4a4030 }
#st{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;justify-content:center}
#st[hidden]{display:none}
.st-stage{position:relative;height:100dvh;width:100%;max-width:1100px;display:flex;flex-direction:column}
/* The scene: sky, sea and sand drawn in CSS, so there is no picture to load. */
.st-scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--st-sky1),var(--st-sky2) 55%,var(--st-sea) 55%,var(--st-sea) 72%,var(--st-sand) 72%) center/cover}
.st-place{position:absolute;top:12px;left:16px;font-family:var(--display);font-size:.95rem;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;z-index:1}
/* The text box, with the speaker's portrait inside it on the left. The frame and the name tag take the speaker's element colour. */
.st-box{position:relative;margin:0 12px 12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px 18px 16px;min-height:150px;cursor:pointer;font-size:1.05rem;display:flex;gap:16px;align-items:flex-start}
.st-face{flex:none;width:112px;height:112px;object-fit:cover;border-radius:10px;border:3px solid var(--c);background:var(--none)}
.st-face[hidden]{display:none}
.st-body{flex:1;min-width:0}
.st-skip{position:absolute;top:-16px;right:16px;font-size:.85rem;padding:2px 12px;border-radius:999px}
.st-tag{position:absolute;top:-16px;left:16px;font-family:var(--display);font-size:1.05rem;padding:2px 14px;border-radius:999px;background:var(--c);color:var(--ci)}
.st-tag:empty{display:none}
.st-text{min-height:3em;white-space:pre-wrap}
.st-text.narr{color:var(--muted);font-style:italic}
.st-more{position:absolute;right:14px;bottom:8px;color:var(--muted);font-size:.85rem;animation:st-blink 1s steps(2) infinite}
@keyframes st-blink{50%{opacity:0}}
.st-choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
/* The title card and the end card. */
.st-card{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2}
.st-card[hidden]{display:none}
.st-card .in{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:16px;max-width:520px}
.st-card h1{font-size:2rem}
.st-card p{color:var(--muted)}
@media (max-width:600px){ .st-face{width:72px;height:72px} .st-box{min-height:170px;gap:10px} }
@media (prefers-reduced-motion: reduce){.st-more{animation:none}}
</style>

(()=>{
/* The engine: a list of steps still to play and the choices made so far. In Python terms, a while loop
   that pops steps off a list, stopping whenever the player has to read, choose or fight. */
const g=id=>document.getElementById(id), steps=STORY.steps, cast=STORY.cast;
const labels=Object.fromEntries(steps.map((s,i)=>[s.label,i]).filter(([k])=>k));
let flags={}, queue=[], typing=null, waiting=false, finish=()=>{};
const colors=n=>{const e=(cast[n]||{}).color;return e?[`var(--${e})`,`var(--${e}-ink)`]:["var(--accent)","var(--accent-ink)"]};

function title(){
  g("st").hidden=false; g("st-card").hidden=false;
  g("st-card").innerHTML=`<div class="in"><h1>Nuitai</h1><p>A small test: one morning, one choice, one fight.</p><button class="go" id="st-start">Start</button></div>`;
  g("st-start").onclick=()=>{flags={};queue=steps.slice();g("st-card").hidden=true;next()};
  g("st-start").focus();
}
if(STORY.background)g("st-scene").style.backgroundImage=`url(${STORY.background})`;
function face(n){ const f=g("st-face"),src=n&&STORY.portraits[n]; f.hidden=!src; if(src){f.src=src;f.alt=n;f.style.setProperty("--c",colors(n)[0])} }
function write(name,text){
  const tag=g("st-tag"),t=g("st-text"); tag.textContent=name||"";
  if(name){const [c,ci]=colors(name);tag.style.setProperty("--c",c);tag.style.setProperty("--ci",ci)}
  t.className="st-text"+(name?"":" narr"); face(name); g("st-choices").innerHTML=""; g("st-more").hidden=true;
  let i=0; clearInterval(typing); t.textContent="";
  finish=()=>{clearInterval(typing);typing=null;t.textContent=text;g("st-more").hidden=false;waiting=true};
  typing=setInterval(()=>{i+=2;t.textContent=text.slice(0,i);if(i>=text.length)finish()},25);
}
/* skip: run past every line of talk and stop at the next choice, fight or ending. */
function next(skip){
  waiting=false;
  while(queue.length){
    const s=queue.shift();
    if(s.place!==undefined){g("st-place").textContent=s.place;continue}
    if(s.label)continue;
    if(s.if){if(flags[s.if])queue=s.then.concat(queue);continue}
    if(s.text!==undefined){if(skip)continue;write(s.say||"",s.text);return}
    if(s.choice){choose(s);return}
    if(s.battle){fight(s);return}
    if(s.end){end(s.end);return}
  }
  end("The end.");
}
function choose(s){
  write("",s.prompt||"What now?"); finish(); waiting=false; g("st-more").hidden=true;
  g("st-choices").innerHTML=s.choice.map((c,i)=>`<button data-i="${i}">${c.text}</button>`).join("");
  g("st-choices").querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();const c=s.choice[+b.dataset.i];if(c.set)flags[c.set]=true;next()});
  g("st-choices").querySelector("button").focus();
}
/* A fight: hide the story, hand the battle page the party and the enemies, and pick the story back up at "win" or "lose". */
function fight(s){
  g("st").hidden=true; scrollTo(0,0);
  storyFight(s.battle,r=>{g("st").hidden=false;queue=steps.slice(labels[r==="win"?s.win:s.lose]);next()});
}
function end(msg){
  g("st-card").hidden=false;
  g("st-card").innerHTML=`<div class="in"><h1>Nuitai</h1><p>${msg}</p><button class="go" id="st-again">Play again</button></div>`;
  g("st-again").onclick=title; g("st-again").focus();
}
function advance(){ if(typing){finish();return} if(waiting)next() }
g("st-box").addEventListener("click",advance);
g("st-skip").addEventListener("click",e=>{e.stopPropagation();if(g("st-choices").children.length)return;clearInterval(typing);typing=null;next(true)});
addEventListener("keydown",e=>{if(g("st").hidden||!g("st-card").hidden)return;if((e.key===" "||e.key==="Enter")&&e.target.tagName!=="BUTTON"){e.preventDefault();advance()}});
document.title="Nuitai Story Test";
title();
})();
</script>

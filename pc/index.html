import sys
import asyncio
import platform

from pathlib import Path

# do not rename
async def custom_site():
    import embed

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "nuitai"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/nuitai
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("nuitai.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("nuitai.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "START GAME"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    (() => {
        // A tap shorter than a frame still reaches the game: each button
        // pressed counts as held until the game has read it once.
        window.nuitai_pad = 0
        let tapped = 0
        window.nuitai_pad_read = () => {
            const mask = window.nuitai_pad | tapped
            tapped = 0
            return mask
        }
        if (!NUITAI_TOUCH) return
        document.body.classList.add("touch")

        const $ = (id) => document.getElementById(id)
        const dpad = $("pad-dpad"), face = $("pad-face")
        const L = $("pad-l"), R = $("pad-r"), select = $("pad-select"), start = $("pad-start")
        const GAP = 10
        let placed = ""

        function place(el, x, y, w, h) {
            el.style.left = Math.round(x) + "px"
            el.style.top = Math.round(y) + "px"
            el.style.width = Math.round(w) + "px"
            el.style.height = Math.round(h) + "px"
        }

        // The game's picture, whole: 256 by 224 pixels, eight wide to seven high.
        function aspect() {
            return canvas.width > 1 && canvas.height > 1 ? canvas.width / canvas.height : 8 / 7
        }

        function placeScreen(x, y, w, h) {
            const s = canvas.style
            s.position = "fixed"
            s.margin = "0"
            s.right = "auto"
            s.bottom = "auto"
            place(canvas, x, y, w, h)
            placed = s.cssText
        }

        function layout() {
            const vw = window.innerWidth, vh = window.innerHeight, ar = aspect()
            const shoulderH = Math.max(30, Math.min(40, vh * 0.07))
            const pillH = 28
            if (vh >= vw) {
                // Portrait: the picture across the top, the pad under it.
                let sw = vw, sh = sw / ar
                const need = shoulderH + pillH + 110 + GAP * 5
                if (vh - sh < need) { sh = vh - need; sw = sh * ar }
                placeScreen((vw - sw) / 2, 0, sw, sh)
                const top = sh + GAP, room = vh - top - GAP
                let D = Math.min(vw * 0.42, 180, room - shoulderH - pillH - GAP * 3)
                const used = shoulderH + D + pillH + GAP * 3
                const y0 = top + Math.max(0, (room - used) / 2)
                const sideW = Math.min(vw * 0.3, 130)
                place(L, GAP, y0, sideW, shoulderH)
                place(R, vw - GAP - sideW, y0, sideW, shoulderH)
                const yPad = y0 + shoulderH + GAP * 1.5
                place(dpad, GAP * 1.5, yPad, D, D)
                place(face, vw - GAP * 1.5 - D, yPad, D, D)
                const pillW = Math.min(vw * 0.24, 100), yPill = yPad + D + GAP * 1.5
                place(select, vw / 2 - GAP / 2 - pillW, yPill, pillW, pillH)
                place(start, vw / 2 + GAP / 2, yPill, pillW, pillH)
            } else {
                // Landscape: the picture in the middle, the D-pad left, the face buttons right.
                const minSide = 150
                let sh = vh, sw = sh * ar
                if (vw - sw < minSide * 2) { sw = vw - minSide * 2; sh = sw / ar }
                placeScreen((vw - sw) / 2, (vh - sh) / 2, sw, sh)
                const side = (vw - sw) / 2
                const D = Math.min(side - GAP * 2, 180, vh - shoulderH - pillH - GAP * 4)
                const used = shoulderH + D + pillH + GAP * 3
                const y0 = Math.max(GAP, (vh - used) / 2)
                const sideW = Math.min(side - GAP * 2, 130)
                place(L, GAP, y0, sideW, shoulderH)
                place(R, vw - GAP - sideW, y0, sideW, shoulderH)
                const yPad = y0 + shoulderH + GAP * 1.5
                place(dpad, (side - D) / 2, yPad, D, D)
                place(face, vw - side + (side - D) / 2, yPad, D, D)
                const pillW = Math.min(side - GAP * 2, 100), yPill = yPad + D + GAP * 1.5
                place(select, (side - pillW) / 2, yPill, pillW, pillH)
                place(start, vw - side + (side - pillW) / 2, yPill, pillW, pillH)
            }
            const D = dpad.offsetWidth
            for (const b of face.children) {
                b.style.width = b.style.height = Math.round(D * 0.36) + "px"
                b.style.fontSize = Math.round(D * 0.15) + "px"
            }
            L.style.fontSize = R.style.fontSize = Math.round(shoulderH * 0.5) + "px"
            select.style.fontSize = start.style.fontSize = "12px"
        }

        // What each finger holds. Fingers can slide from button to button,
        // and around the D-pad, as thumbs do on a real pad.
        const fingers = new Map()

        function dpadBits(x, y) {
            const r = dpad.getBoundingClientRect()
            const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2)
            const dist = Math.hypot(dx, dy)
            if (dist > r.width * 0.7) return 0
            if (dist < r.width * 0.1) return 0
            // Each direction covers 120 degrees around its arm, so the four
            // diagonals are narrow and a thumb on an arm stays straight.
            const a = Math.atan2(dy, dx) * 180 / Math.PI
            const near = (c) => Math.abs(((a - c + 540) % 360) - 180) < 60
            return (near(-90) ? 1 << 8 : 0) | (near(90) ? 1 << 9 : 0)
                 | (near(180) ? 1 << 10 : 0) | (near(0) ? 1 << 11 : 0)
        }

        function update() {
            let mask = 0
            for (const [x, y] of fingers.values()) {
                // A button under the finger first; the D-pad reaches a
                // little past its edges, but never over another button.
                const hit = document.elementFromPoint(x, y)
                const b = hit && hit.closest && hit.closest("[data-b]")
                if (b) { mask |= 1 << Number(b.dataset.b); continue }
                const d = dpadBits(x, y)
                if (d > 0) mask |= d
            }
            tapped |= mask & ~window.nuitai_pad
            window.nuitai_pad = mask
            for (const b of document.querySelectorAll("#pad [data-b]"))
                b.classList.toggle("on", !!(mask & (1 << Number(b.dataset.b))))
            for (const d of document.querySelectorAll("#pad [data-d]"))
                d.classList.toggle("on", !!(mask & (1 << Number(d.dataset.d))))
        }

        document.addEventListener("pointerdown", (e) => {
            fingers.set(e.pointerId, [e.clientX, e.clientY]); update()
        })
        document.addEventListener("pointermove", (e) => {
            if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, [e.clientX, e.clientY]); update() }
        })
        const lift = (e) => { if (fingers.delete(e.pointerId)) update() }
        document.addEventListener("pointerup", lift)
        document.addEventListener("pointercancel", lift)
        const letGo = () => { fingers.clear(); update() }
        window.addEventListener("blur", letGo)
        document.addEventListener("visibilitychange", letGo)

        // No scrolling, zooming, text picking or long-press menus while playing.
        const stop = (e) => e.preventDefault()
        for (const kind of ["touchstart", "touchmove", "touchend", "gesturestart", "dblclick", "contextmenu"])
            document.addEventListener(kind, stop, { passive: false })

        layout()
        window.addEventListener("resize", layout)
        window.addEventListener("orientationchange", () => setTimeout(layout, 200))
        // The game sizes its canvas when it opens its window; place it again then.
        new MutationObserver(() => {
            if (canvas.style.cssText !== placed) layout()

            for (const [b, name] of BUTTONS) {
                const tr = document.createElement("tr")
                const td = document.createElement("td"); td.textContent = name
                const btn = document.createElement("button")
                btn.textContent = waiting === b ? "Press a key" : keyName(keys[b])
                btn.classList.toggle("wait", waiting === b)
                btn.addEventListener("click", () => { waiting = b; drawKeys() })
                const td2 = document.createElement("td"); td2.appendChild(btn)
                tr.append(td, td2); $("keys").appendChild(tr)
            }
        }
        function onKey(e) {
            if (e.key === "F11") return   // the page's full screen, below
            const down = e.type === "keydown"
            if (waiting !== null) {
                if (down) {
                    if (e.code !== "Escape") {
                        for (const b in keys) if (keys[b] === e.code) keys[b] = keys[waiting]
                        keys[waiting] = e.code
                        store("nuitai-pc-keys", keys)
                    }
                    waiting = null; drawKeys()
                }
                e.preventDefault(); e.stopImmediatePropagation(); return
            }
            if (document.querySelector(".pop.open")) {
                if (down && e.code === "Escape") closePops()
                e.stopImmediatePropagation(); return
            }
            const b = bitOf(e.code)
            if (b < 0) return
            e.preventDefault(); e.stopImmediatePropagation()
            if (down) { if (!(held >> b & 1)) tapped |= 1 << b; held |= 1 << b }
            else held &= ~(1 << b)
        }
        window.addEventListener("keydown", onKey, { capture: true })
        window.addEventListener("keyup", onKey, { capture: true })
        window.addEventListener("blur", () => { held = 0 })

        // ---- Sound: one volume over all of the game's sound, as the emulator's slider.
        let volume = load("nuitai-pc-volume", 0.6), muted = load("nuitai-pc-muted", false)
        const level = () => muted ? 0 : volume
        const gains = new Map()
        const connect = AudioNode.prototype.connect
        function gainFor(ctx) {
            let g = gains.get(ctx)
            if (!g) { g = ctx.createGain(); g.gain.value = level(); connect.call(g, ctx.destination); gains.set(ctx, g) }
            return g
        }
        AudioNode.prototype.connect = function (dest, ...rest) {
            if (typeof AudioDestinationNode !== "undefined" && dest instanceof AudioDestinationNode)
                return connect.call(this, gainFor(dest.context), ...rest)
            return connect.call(this, dest, ...rest)
        }
        const media = new Set()
        const vol = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "volume")
        Object.defineProperty(HTMLMediaElement.prototype, "volume", {
            configurable: true,
            get() { return this.nuitaiVolume ?? 1 },
            set(v) { this.nuitaiVolume = v; media.add(this); vol.set.call(this, v * level()) },
        })
        const play = HTMLMediaElement.prototype.play
        HTMLMediaElement.prototype.play = function () {
            media.add(this); vol.set.call(this, (this.nuitaiVolume ?? 1) * level())
            return play.apply(this, arguments)
        }
        function sound() {
            for (const g of gains.values()) g.gain.value = level()
            for (const m of media) vol.set.call(m, (m.nuitaiVolume ?? 1) * level())
            $("b-volume").value = muted ? 0 : volume
            $("b-mute").innerHTML = level() > 0 ? ICONS.mute : ICONS.unmute
            $("b-mute").title = level() > 0 ? "Mute" : "Unmute"
            store("nuitai-pc-volume", volume); store("nuitai-pc-muted", muted)
        }
        $("b-volume").addEventListener("input", (e) => { volume = Number(e.target.value); muted = volume === 0; sound() })
        $("b-mute").addEventListener("click", () => { if (level() > 0) muted = true; else { muted = false; if (!volume) volume = 0.6 } sound() })
        sound()

        // ---- The bar: shows while the mouse moves over the game, as the emulator's.
        let sleep = 0
        game.addEventListener("mousemove", () => {
            game.classList.add("awake"); clearTimeout(sleep)
            sleep = setTimeout(() => game.classList.remove("awake"), 3000)
        })
        game.addEventListener("mouseleave", () => game.classList.remove("awake"))
        $("b-restart").addEventListener("click", () => location.reload())
        const closePops = () => { waiting = null; for (const p of document.querySelectorAll(".pop")) p.classList.remove("open") }
        $("b-controls").addEventListener("click", () => { drawKeys(); $("p-controls").classList.add("open") })
        $("k-close").addEventListener("click", closePops)
        $("k-reset").addEventListener("click", () => { keys = defaults(); store("nuitai-pc-keys", keys); drawKeys() })
        $("b-settings").addEventListener("click", () => $("p-settings").classList.add("open"))
        $("s-close").addEventListener("click", closePops)
        for (const p of document.querySelectorAll(".pop")) p.addEventListener("click", (e) => { if (e.target === p) closePops() })
        function full() {
            if (document.fullscreenElement) document.exitFullscreen()
            else document.documentElement.requestFullscreen()
        }
        $("b-full").addEventListener("click", full)
        document.addEventListener("fullscreenchange", () => {
            const on = !!document.fullscreenElement
            $("b-full").innerHTML = on ? ICONS.exitFullscreen : ICONS.enterFullscreen
            $("b-full").title = on ? "Exit Fullscreen" : "Enter Fullscreen"
            for (const b of document.querySelectorAll(".box")) b.classList.toggle("full", on)
        })
        // F11 fills the screen, as in the desktop game (Frankie, 10/25). The game
        // takes every key the page gets, so the browser never sees F11; the page
        // catches it first and asks for fullscreen itself, inside the key press.
        window.addEventListener("keydown", (e) => {
            if (e.key !== "F11") return
            e.preventDefault(); e.stopImmediatePropagation(); full()
        }, { capture: true })

        // ---- The picture: the game's canvas in the 4:3 box, under the CRT screen.
        let crt = load("nuitai-pc-crt", true)
        function crtLabel() { $("s-crt").textContent = crt ? "On" : "Off" }
        $("s-crt").addEventListener("click", () => { crt = !crt; store("nuitai-pc-crt", crt); crtLabel() })
        crtLabel()
        function placeCanvas() {
            if (document.body.classList.contains("touch")) return   // the pad's layout places it
            const r = game.getBoundingClientRect(), s = canvas.style
            s.position = "fixed"; s.margin = "0"; s.right = "auto"; s.bottom = "auto"
            s.left = r.left + "px"; s.top = r.top + "px"; s.width = r.width + "px"; s.height = r.height + "px"
            s.imageRendering = "pixelated"; s.zIndex = "3"
        }
        placeCanvas()
        window.addEventListener("resize", placeCanvas)
        document.addEventListener("fullscreenchange", () => setTimeout(placeCanvas, 50))
        new MutationObserver(() => { if (!document.body.classList.contains("touch") && canvas.style.left !== game.getBoundingClientRect().left + "px") placeCanvas() })
            .observe(canvas, { attributes: true, attributeFilter: ["style", "width", "height"] })

        // The CRT: crt-geom's look (a curved glass, rounded corners, a scan line per game
        // row, a faint shadow mask), drawn each frame from the game's canvas.
        const view = $("crtv")
        const gl = view.getContext("webgl", { alpha: false, antialias: false })
        if (!gl) return   // no WebGL: the plain picture stays
        const VS = "attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }"
        const FS = [
            "precision mediump float;",
            "uniform sampler2D t; uniform vec2 out_size; uniform float on; varying vec2 uv;",
            "const float ROWS = 224.0;",
            "vec2 warp(vec2 q){ q = q * 2.0 - 1.0; q *= vec2(1.0 + q.y * q.y * 0.031, 1.0 + q.x * q.x * 0.041); return q * 0.5 + 0.5; }",
            "float corner(vec2 q){ vec2 d = min(q, 1.0 - q) * vec2(out_size.x / out_size.y, 1.0);",
            "  vec2 c = max(vec2(0.03) - d, 0.0); return clamp((0.03 - length(c)) * 400.0, 0.0, 1.0); }",
            "void main(){",
            "  if (on < 0.5) { gl_FragColor = vec4(texture2D(t, uv).rgb, 1.0); return; }",
            "  vec2 q = warp(uv);",
            "  if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }",
            "  vec3 c = texture2D(t, q).rgb;",
            "  float f = fract(q.y * ROWS) - 0.5;",
            "  float scan = mix(1.0, 0.45, pow(abs(f) * 2.0, 2.5));",
            "  float m = mod(gl_FragCoord.x, 3.0);",
            "  vec3 mask = m < 1.0 ? vec3(1.0, 0.88, 0.88) : (m < 2.0 ? vec3(0.88, 1.0, 0.88) : vec3(0.88, 0.88, 1.0));",
            "  vec2 v = q * (1.0 - q); float vig = pow(v.x * v.y * 16.0, 0.12);",
            "  gl_FragColor = vec4(c * scan * mask * vig * 1.3 * corner(q), 1.0);",
            "}",
        ].join("\n")
        function shader(kind, src) { const s = gl.createShader(kind); gl.shaderSource(s, src); gl.compileShader(s); return s }
        const prog = gl.createProgram()
        gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS))
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return
        gl.useProgram(prog)
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const at = gl.getAttribLocation(prog, "p")
        gl.enableVertexAttribArray(at); gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0)
        const tex = gl.createTexture()
        gl.bindTexture(gl.TEXTURE_2D, tex)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
        const uSize = gl.getUniformLocation(prog, "out_size"), uOn = gl.getUniformLocation(prog, "on")
        let working = null   // null until the game's canvas is up and readable
        function frame() {
            requestAnimationFrame(frame)
            // The game's window is 256 by 224 times a whole number (ScreenSettings.WEB_SCALE).
            if (canvas.width < 512 || canvas.width % 256) return
            if (working === null) {
                // The game draws its canvas in 2D; anything else, and the plain picture stays.
                working = !!canvas.getContext("2d")
                if (working) { view.style.display = "block"; canvas.style.opacity = "0" }
            }
            if (!working) return
            const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1
            const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr)
            if (view.width !== w || view.height !== h) { view.width = w; view.height = h }
            const s = view.style
            s.left = r.left + "px"; s.top = r.top + "px"; s.width = r.width + "px"; s.height = r.height + "px"
            const filter = crt ? gl.LINEAR : gl.NEAREST
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas)
            gl.viewport(0, 0, w, h)
            gl.uniform2f(uSize, w, h); gl.uniform1f(uOn, crt ? 1 : 0)
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
        }
        requestAnimationFrame(frame)
    })()
    </script>

</body>

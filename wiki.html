<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nuitai Wiki</title>
<style>
:root {
  --bg: #faf6ee;
  --panel: #f2ecdf;
  --card: #fffdf8;
  --ink: #20242a;
  --muted: #5c6470;
  --line: #ddd4c2;
  --mark: #ffe58a;
  --s: 62%;  --l: 36%;
  --sb: 70%; --lb: 92%;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13171c; --panel: #1a1f26; --card: #1d232b; --ink: #e8e4da;
    --muted: #9aa3ae; --line: #2d353f; --mark: #6b5a12;
    --s: 62%; --l: 72%; --sb: 38%; --lb: 19%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13171c; --panel: #1a1f26; --card: #1d232b; --ink: #e8e4da;
  --muted: #9aa3ae; --line: #2d353f; --mark: #6b5a12;
  --s: 62%; --l: 72%; --sb: 38%; --lb: 19%; color-scheme: dark;
}
/* Anything with class "hue" and a --h value gets its category colour. */
.hue {
  --c: hsl(var(--h) var(--s) var(--l));
  --cb: hsl(var(--h) var(--sb) var(--lb));
}
.hue.plain { --s: 10%; --sb: 12%; }
/* The public copy: the way back to the rest of the website. */
.side .site { display: block; margin: .25rem 0 1rem; font-weight: 700; text-decoration: none; color: var(--muted); }
.side .site:hover { color: var(--ink); }

* { box-sizing: border-box; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
}
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem 1rem; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--serif); font-size: 1.25rem; font-weight: 700;
  text-decoration: none; white-space: nowrap;
}
.brand small { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .4rem; }
.search { flex: 1; max-width: 34rem; margin-left: auto; }
.search input {
  width: 100%; padding: .5rem .8rem; font: inherit; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
}
.search input:focus { outline: 2px solid hsl(210 80% 55%); outline-offset: 1px; }
.icon-btn {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: .5rem .7rem; line-height: 1; font-size: .85rem; font-weight: 600;
}
#menu-btn { display: none; }

/* Layout */
.wrap { display: flex; align-items: flex-start; }
.side {
  width: 17.5rem; flex: none; position: sticky; top: 3.4rem;
  height: calc(100vh - 3.4rem); overflow-y: auto;
  padding: .75rem .5rem 3rem .75rem; border-right: 1px solid var(--line);
  background: var(--panel);
}
main { flex: 1; min-width: 0; padding: 1.5rem 1.5rem 5rem; }
.page { max-width: 46rem; margin: 0 auto; }
.page.wide { max-width: 62rem; }

/* Sidebar */
.side h2 {
  font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 1rem .5rem .35rem;
}
.side details { margin-bottom: 2px; }
.side summary {
  list-style: none; display: flex; align-items: center; gap: .5rem;
  padding: .35rem .5rem; border-radius: 8px; cursor: pointer;
  border-left: 5px solid var(--c); font-weight: 600; font-size: .92rem;
}
.side summary::-webkit-details-marker { display: none; }
.side summary:hover, .side details[open] > summary { background: var(--cb); }
.side summary .n {
  margin-left: auto; font-weight: 500; font-size: .78rem; color: var(--muted);
}
.side ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 .6rem; }
.side li a {
  display: flex; align-items: baseline; gap: .4rem;
  padding: .22rem .5rem; border-radius: 6px; text-decoration: none;
  font-size: .9rem; border-left: 2px solid var(--line);
}
.side li a:hover { background: var(--cb); }
.side li a.here { background: var(--cb); border-left-color: var(--c); font-weight: 600; }
.tag {
  font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: .05rem .35rem; border-radius: 4px; white-space: nowrap;
  border: 1px dashed var(--muted); color: var(--muted);
}
.tag.art { border-color: hsl(30 80% 50%); color: hsl(30 80% 42%); border-style: solid; }
.note.art { border-color: hsl(30 80% 50%); color: hsl(30 70% 40%); }

/* Article */
.chip {
  display: inline-block; padding: .15rem .6rem; border-radius: 999px;
  background: var(--cb); color: var(--c); border: 1px solid var(--c);
  font-size: .8rem; font-weight: 700; text-decoration: none;
}
.head { border-bottom: 4px solid var(--c); padding-bottom: .6rem; margin-bottom: 1.2rem; }
.head h1 { font-family: var(--serif); font-size: 2.2rem; line-height: 1.15; margin: .5rem 0 .3rem; }
.head .file { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.note {
  border: 1px dashed var(--muted); border-radius: 8px; padding: .6rem .8rem;
  color: var(--muted); margin: 0 0 1.2rem; font-size: .92rem;
}
.body { font-family: var(--serif); font-size: 1.08rem; line-height: 1.65; }
.body h1, .body h2, .body h3, .body h4 { font-family: var(--serif); line-height: 1.25; margin: 1.8em 0 .5em; }
.body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
.body h3 { font-size: 1.2rem; }
.body p { margin: 0 0 1em; }
.body ul, .body ol { padding-left: 1.4rem; }
.body li { margin-bottom: .35em; }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
.body blockquote {
  margin: 1em 0; padding: .6rem 1rem; background: var(--panel);
  border-left: 4px solid var(--line); border-radius: 0 8px 8px 0;
}
.body blockquote > :last-child { margin-bottom: 0; }
.body code {
  font-family: var(--mono); font-size: .85em; background: var(--panel);
  padding: .1em .3em; border-radius: 4px;
}
.body .tbl { overflow-x: auto; margin: 1em 0; }
.body table { border-collapse: collapse; font-family: var(--sans); font-size: .9rem; min-width: 100%; }
.body th, .body td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; vertical-align: top; }
.body th { background: var(--panel); }
.body a.wl {
  color: var(--c); text-decoration: underline; text-decoration-thickness: 2px;
  text-decoration-color: var(--cb); text-underline-offset: 2px; font-weight: 600;
}
.body a.wl:hover { background: var(--cb); border-radius: 3px; }
.body a.ext { color: hsl(210 var(--s) var(--l)); }
.body .off { border-bottom: 1px dotted var(--muted); cursor: help; }
.portrait {
  float: right; width: 11rem; max-width: 42%; height: auto; margin: 0 0 1rem 1.25rem;
  border: 4px solid var(--c); border-radius: 10px; background: var(--panel);
}
.banner { margin: 0 0 1.4rem; }
.banner img, .more img {
  display: block; width: 100%; height: auto; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line);
}
.banner figcaption, .more figcaption {
  font-family: var(--sans); font-size: .8rem; color: var(--muted); margin-top: .35rem;
}
.more { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
.more figure { margin: 0; }
.more figure.big { grid-column: 1 / -1; }
.more img { cursor: zoom-in; }
.more figure.big img { cursor: zoom-out; }
.face {
  width: 20px; height: 20px; flex: none; align-self: center; border-radius: 4px;
  image-rendering: pixelated; border: 1px solid var(--c);
}
.rows .face { display: inline-block; vertical-align: middle; margin-right: .45rem; width: 24px; height: 24px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

.toc {
  font-family: var(--sans); font-size: .9rem; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: .5rem .9rem; margin-bottom: 1.4rem;
}
.toc summary { cursor: pointer; font-weight: 600; }
.toc ul { list-style: none; padding: 0; margin: .5rem 0 .2rem; columns: 2; column-gap: 1.5rem; }
.toc li { margin: 0 0 .2rem; break-inside: avoid; }
.toc li.sub { padding-left: 1rem; }
.toc a { text-decoration: none; }
.toc a:hover { text-decoration: underline; }

.back { margin-top: 3rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.back h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
.pills { display: flex; flex-wrap: wrap; gap: .4rem; }
.pill {
  text-decoration: none; font-size: .88rem; padding: .2rem .6rem; border-radius: 6px;
  background: var(--cb); border-left: 4px solid var(--c);
}
.pill:hover { outline: 1px solid var(--c); }

/* Home, category and search pages */
.hero h1 { font-family: var(--serif); font-size: 2.8rem; margin: 0; line-height: 1.1; }
.hero p { color: var(--muted); margin: .4rem 0 1.4rem; font-size: 1.05rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: .7rem; }
.card {
  display: block; text-decoration: none; background: var(--card);
  border: 1px solid var(--line); border-top: 6px solid var(--c);
  border-radius: 10px; padding: .7rem .85rem;
}
.card:hover { background: var(--cb); }
.card b { display: block; font-size: 1rem; color: var(--c); }
.card span { font-size: .85rem; color: var(--muted); }
h2.sec {
  font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 2.2rem 0 .7rem;
}
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { border-bottom: 1px solid var(--line); }
.rows a {
  display: block; text-decoration: none; padding: .55rem .7rem;
  border-left: 5px solid var(--c);
}
.rows a:hover { background: var(--cb); }
.rows b { font-family: var(--serif); font-size: 1.08rem; }
.rows .tag { margin-left: .4rem; vertical-align: middle; }
.rows p { margin: .1rem 0 0; font-size: .88rem; color: var(--muted); }
.rows .where { font-size: .75rem; font-weight: 700; color: var(--c); margin-left: .5rem; }
.btn {
  display: inline-block; text-decoration: none; background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: .45rem .9rem; font-weight: 600;
}
.btn:hover { background: var(--panel); }
footer { color: var(--muted); font-size: .8rem; margin-top: 3rem; }

/* Phone */
#shade { display: none; }
@media (max-width: 860px) {
  #menu-btn { display: inline-block; }
  .brand small { display: none; }
  .side {
    position: fixed; left: 0; top: 3.4rem; z-index: 15; width: min(19rem, 86vw);
    transform: translateX(-105%); transition: transform .18s;
  }
  body.menu .side { transform: none; }
  body.menu #shade {
    display: block; position: fixed; inset: 3.4rem 0 0 0; background: rgb(0 0 0 / .4); z-index: 10;
  }
  main { padding: 1rem 16px 4rem; }
  .head h1 { font-size: 1.8rem; }
  .hero h1 { font-size: 2.2rem; }
  .toc ul { columns: 1; }
}
</style>
</head>

<script type="application/json" id="wiki-data">{"built":"2026-10-12","public":true,"groups":[{"key":"person","label":"Characters","hue":350,"kind":"canon","plain":false},{"key":"god","label":"Gods","hue":260,"kind":"canon","plain":false},{"key":"beast","label":"Sacred beasts","hue":145,"kind":"canon","plain":false},{"key":"location","label":"Places","hue":195,"kind":"canon","plain":false},{"key":"settlement","label":"Settlements","hue":165,"kind":"canon","plain":false},{"key":"ethnicity","label":"Peoples","hue":22,"kind":"canon","plain":false},{"key":"species","label":"Species","hue":125,"kind":"canon","plain":false},{"key":"organization","label":"Faiths and factions","hue":275,"kind":"canon","plain":false},{"key":"law","label":"Cosmology","hue":245,"kind":"canon","plain":false},{"key":"language","label":"Languages","hue":325,"kind":"canon","plain":false},{"key":"technology","label":"Arts and technology","hue":45,"kind":"canon","plain":false},{"key":"ritual","label":"Games and codes","hue":75,"kind":"canon","plain":false},{"key":"profession","label":"Jobs","hue":220,"kind":"canon","plain":false},{"key":"document","label":"Books and documents","hue":300,"kind":"canon","plain":false},{"key":"article","label":"The game","hue":210,"kind":"canon","plain":true}],"pages":[{"img":"art/portraits/genemon-portrait-a.png","face":"art/portraits/pixel/genemon.png","id":"person/genemon-the-spring-guardian","group":"person","title":"Genemon the Spring Guardian","file":"lore/person/genemon-the-spring-guardian.md","state":"ok","md":"# Genemon the Spring Guardian\n\nA member of the [Kame](../species/kame.md) race, hailing from the [Kame Kingdom](../organization/kame-kingdom.md) and the first Kame [Kailo](../person/kailo-the-wandering-chef.md) or [Hina](../person/hina-the-māla-priestess.md) have ever met. They meet him in [Lanuloa](../location/the-lanuloa-archipelago.md), which suits a region where diversity arrives with the travellers rather than living in the villages. Gen'emon is an old man of a turtle, even for Kame years, he is a master of [Wai’Kenpō](../technology/waikenpō.md) and healing medicine. He and the [caller](../person/tawiri-the-elderly-caller.md) get along due to their shared years of wisdom, even if they disagree sometimes. Not quite as cynical, with a positive outlook, but also realistic and with a laid back sense of humor.\n\nGen'emon's elements are **Wai **and **Lau**, making him a master of physical defense and a skilled medicinal healer.\n","pics":[{"file":"art/wiki/person/genemon-the-spring-guardian-1.webp","caption":"Genemon the Spring Guardian"},{"file":"art/wiki/person/genemon-the-spring-guardian-2.webp","caption":"Tawiri and Genemon"},{"file":"art/wiki/person/genemon-the-spring-guardian-3.webp","caption":"Genemon the Spring Guardian (pixel art)"},{"file":"art/wiki/person/genemon-the-spring-guardian-4.webp","caption":"genemon (ChatGPT)"}]},{"img":"art/portraits/hina-portrait-a.png","face":"art/portraits/pixel/hina.png","id":"person/hina-the-māla-priestess","group":"person","title":"Hina the Māla Priestess","file":"lore/person/hina-the-māla-priestess.md","state":"ok","md":"# Hina the Māla Priestess\n\nDevout, proud, pious, ambitious, and a bit of a perfectionist. Hina is a young\n[Māla](../location/māla-iki-islands.md) priestess with strong religious\nconvictions, to the annoyance of her peers. She is a devout follower of the\nteachings of Shaka. She puts on an air of serenity but is in fact easily\nprovoked. Hina is a vegetarian, as is common among devotees of\n[Lanu](../god/lanu.md), and an only child.\n\nShe has to make a pilgrimage to [Kota Emas](../settlement/kota-emas.md) at least\nonce in her life and pray at the golden temple in order to become the high\npriestess of her village. She was born there and lived in the city until she was\nvery small, before she was raised on Māla Iki. She remembers it the way a small\nchild remembers anything: colours, sounds and feelings, not streets or faces. So\nthe pilgrimage is a return to somewhere she half knows, and a crowd of strangers\ndoes not stop her the way it stops\n[Kailo](../person/kailo-the-wandering-chef.md).\n\nOne of her parents is a southern [Nuitagata](../ethnicity/nuitagata.md), from the\nfar end of the Anuic arc, and the other is a Manusia\n[Bandari](../ethnicity/bandari.md). She takes after the southern side\nalmost entirely. She has straight black hair, warm sun-tanned light brown skin a\nshade lighter than the deep bronze of the easterners she grew up among, and muted\ngolden brown eyes, both the same colour. She is small, noticeably so beside the\ntall and heavy-built people of Māla Iki.\n\nWhat she did not inherit is Bandari hair, and nobody has felt the need to explain\nwhy. She is a long way from both of her lineages in a village where everyone can\nplace everyone at a glance, which is its own kind of pressure on a girl who\nintends to run the place.\n\nHer elements are **La** and **Lau**.\n","pics":[{"file":"art/wiki/person/hina-the-mala-priestess-1.webp","caption":"Hina the Nature Priestess"},{"file":"art/wiki/person/hina-the-mala-priestess-2.webp","caption":"Hina's Pilgrimage"},{"file":"art/wiki/person/hina-the-mala-priestess-4.webp","caption":"Baby Hina"},{"file":"art/wiki/person/hina-the-mala-priestess-3.webp","caption":"Hina the Māla Priestess (pixel art)"},{"file":"art/wiki/person/hina-the-mala-priestess-5.webp","caption":"Island Shrine and the Scolding Frog (ChatGPT)"}]},{"img":"art/portraits/kailo-portrait-a.png","face":"art/portraits/pixel/kailo.png","id":"person/kailo-the-wandering-chef","group":"person","title":"Kailo the Wandering Chef","file":"lore/person/kailo-the-wandering-chef.md","state":"ok","md":"# Kailo the Wandering Chef\n\nKailo hails from [Kulāiwi](../settlement/kulāiwi.md), the only village on a small island of the same name in the [Māla Iki](../location/māla-iki-islands.md) islands. He is a young cook of about nineteen with shoulder-length, thick, wavy red hair, tied back under a kerchief when he cooks, bronze skin, heterochromatic pupils of ruby red and sapphire blue, and a strong physique. He radiates a warm, optimistic energy that draws people to him. Beneath this sunny exterior, however, he quietly wrestles with anxiety and self-doubt.\n\nHis father left when Kailo was young to explore the vast ocean of Nuitai, and Kailo idolizes him, speaking of him as if he were an epic legend. Inspired, Kailo dreams of exploring the world himself. However he cannot leave [Māla Iki](../location/māla-iki-islands.md) as he has many younger siblings that he looks after. Kailo is a native [Nuitagata](../ethnicity/nuitagata.md). He has never seen anyone with boar features. His island chain is too isolated for that, so he knows such people only from stories until he leaves home.\n\nEmpathetic and attentive, Kailo has a knack for connecting with others; strangers often confide in him while he cooks them a meal. Wasting food deeply upsets him, sometimes to the point of anger or melancholy. He travels between islands on his small boat, selling food and honing his skills in both cuisine and martial arts in his free time.\n\nIn combat, Kailo begins by creatively improvising, using kitchen utensils such as knives, rolling pins, and pot lids as weapons and shields. On his adventures he learns [Lelua](../technology/lelua.md) from [Olola](../person/olola-the-fire-dancer.md) and [Wai’Kenpō](../technology/waikenpō.md) from [Gen'emon](../person/genemon-the-spring-guardian.md), eventually merging them into his own unique martial art.\n\nKailo’s journey begins when he meets [Hina](../person/hina-the-māla-priestess.md), a young nature priestess of [Māla Iki](../location/māla-iki-islands.md), and [Tawiri](../person/tawiri-the-elderly-caller.md) the elderly caller of the dead from [The Matua Archipelago](../location/the-matua-archipelago.md). Together with friends, he embarks on an adventure across Nuitai, as part of a growing party, clockwise around [The Great Maelstrom](../location/the-great-maelstrom.md).\n\nKailo's elements are **Ahi **and **Wai**, making him a master martial artist with the perfect balance of both offense and defense.\n","pics":[{"file":"art/wiki/person/kailo-the-wandering-chef-2.webp","caption":"Kailo the Wandering Chef"},{"file":"art/wiki/person/kailo-the-wandering-chef-1.webp","caption":"Kailo Meets Hina and Tawiri"},{"file":"art/wiki/person/kailo-the-wandering-chef-3.webp","caption":"Kailo the Wandering Chef (pixel art)"},{"file":"art/wiki/person/kailo-the-wandering-chef-4.webp","caption":"Island Feast by the Lagoon (ChatGPT)"}]},{"id":"person/karvara-citra-the-apostate","group":"person","title":"Karvara Citra, the Apostate","file":"lore/person/karvara-citra-the-apostate.md","state":"ok","md":"# Karvara Citra, the Apostate\n\nA Manusia [Bandari](../ethnicity/bandari.md) of the\n[Matahari Archipelago](../location/matahari-archipelago.md), excommunicated for\ncarrying the [Cindaku](../article/cindaku.md) curse, and hiding in the frozen\nnorth. In the western Shakan order **Karvara** is the family name and\n**Citra** the given one, so anyone close to him calls him Citra, and almost\nnobody is.\n\nHe is still a Shakan. That is the point of him. He was not cast out for\ndisbelieving anything and he has not stopped believing since; the temple registers\nlist him as a heretic because the registers have one column for the cast out and\nthat is what the column says. His family name is still in those registers, which\nis the other half of what excommunication costs a man from a people who keep their\ndead in a book. He keeps the observances he was raised in, alone,\nfor a faith whose clergy have ruled that the sun's own verdict went against him.\n\nThe frozen north is [Tokelau](../location/tokelau---the-north-sea.md), where\nnobody lives, which is the practical reason an afflicted man goes there. Under\nconstant storm and cloud the trigger almost never comes. He has exiled himself to\nthe one sea in Nuitai where the sky is reliably against the curse, and the cost is\nthat it is also the sea that kills people.\n\nHis elements are **La** and **Ata**, light and decay, which is either a cruel joke\nor a diagnosis depending on who is asked.\n","pics":[{"file":"art/wiki/person/the-apostate-1.webp","caption":"The Apostate"}]},{"img":"art/portraits/kiki-portrait-a.png","face":"art/portraits/pixel/kiki.png","id":"person/kiki-the-witch-doctor","group":"person","title":"Kiki the Witch Doctor","file":"lore/person/kiki-the-witch-doctor.md","state":"ok","md":"# Kiki the Witch Doctor\n\nMet in [The Matua Archipelago](../location/the-matua-archipelago.md), Kiki is about fifteen, a spunky tomboy, but also morbid and inappropriate. She has extensive knowledge of ingredients and their effects in potion making, resulting in stained fingers and a strange lingering spell. She unintentionally has caused a fair number of explosions and dangerous effects from her alchemical experimentations. Kiki gets along with [Kailo](../person/kailo-the-wandering-chef.md) due to their shared youthful enthusiasm and sense of humor, although her darker sense of humor scares him sometimes. She looks up to [Tawiri](../person/tawiri-the-elderly-caller.md).\n\nDespite having grown up in [The Matua Archipelago](../location/the-matua-archipelago.md) among native Nuitai, Kiki is of Vanara [Bandari](../ethnicity/bandari.md) ancestry. Being the only one among her peers with furry eyebrows, sideburns and a tail always made her feel like an outsider. She does not believe in the teachings of [Shaka](../god/shaka.md) or the Doctrine of Recurrence.\n\nShe did not take up the Matua faith in its place either. Kiki is a skeptic and scientifically minded, which is less a rejection of anything than the natural end point of learning a trade by mixing things, blowing them up, and writing down what happened. She will grant that the [Callers](../organization/the-callers.md) talk to the dead, because she has watched them do it; she will not grant any particular account of why it works, and she asks questions about it that the Callers find rude. Ancestrally Bandari, raised Matua, and holding with neither: see [the Penyamun Agent](../person/the-penyamun-agent.md), who runs the same contradiction the other way. She gives her name in the eastern order, given name first, the way Matua raised her and not the way her ancestors would have.\n\nKiki's elements are **Lau **and **Ata**, making her a master of healing potions and debilitating poisons.\n","pics":[{"file":"art/wiki/person/kiki-the-witch-doctor-1.webp","caption":"Kiki the Witch Doctor"},{"file":"art/wiki/person/kiki-the-witch-doctor-2.webp","caption":"Kiki the Witch Doctor (pixel art)"},{"file":"art/wiki/person/kiki-the-witch-doctor-3.webp","caption":"Mischievous Alchemist in the Rafters (ChatGPT)"}]},{"img":"art/portraits/leilagi-portrait-a.png","id":"person/leilagi-the-huntress","group":"person","title":"Leilagi the Huntress","file":"lore/person/leilagi-the-huntress.md","state":"ok","md":"# Leilagi the Huntress\n\nMet in the fire islands, Leilagi is a serious but practical survivalist. She is a southern [Nuitagata](../ethnicity/nuitagata.md) with boar features: slightly larger lower canines, boar ears and a thin tail. She is devoted to both [Mauga](../god/mauga.md) and [Lanu](../god/lanu.md), and does not believe in [Shaka](../god/shaka.md). She is more restrained in her personality than the passionate fire dancer. Unlike many devotees of Lanu, she eats meat.\n\nHere elements are **Ahi **and **Lau**, making her skilled in both combat and healing.\n","pics":[{"file":"art/wiki/person/leilagi-the-huntress-1.webp","caption":"Leilagi the Huntress"}]},{"img":"art/portraits/maika-portrait-a.png","face":"art/portraits/pixel/maika.png","id":"person/maika-the-maki-sage","group":"person","title":"Maika the Maki Sage","file":"lore/person/maika-the-maki-sage.md","state":"ok","md":"# Maika the Maki Sage\n\nMaika is a young [Maki Sage](../organization/maki-sages.md) the party first meets in [Māla Iki](../location/māla-iki-islands.md) but does not join until later. He has bronze skin, with heterochromatic pupils of earthy green and deep purple, and uniquely white hair. Maika is well spoken with a wise, outwardly calm demeanor and seems to be unusually worldly for his age. Maika can be acerbic at times, lacking tact in how he speaks to others, and is a bit arrogant and opinionated. But he can admit when he is wrong, often apologizing or chastising himself for unsagely behavior. It can be difficult to tell when he is sincere, or if he deliberately gets on [Hina](../person/hina-the-māla-priestess.md)'s nerves. Despite his outward show of being above worldly pleasures, he enjoys flirting, drinking, and other indulgences, often brushing them off with clever, self-assured words that make even his mischief sound like philosophy. Maika is a vegetarian, as is common among devotees of [Lanu](../god/lanu.md). He has a sister that he does not get along with.\n\nHis elements are **Lau **and **Mana**, making him an excellent healer and offensive spellcaster of nature elemental magic.\n","pics":[{"file":"art/wiki/person/maika-the-maki-sage-1.webp","caption":"Maika the Maki Sage"},{"file":"art/wiki/person/maika-the-maki-sage-2.webp","caption":"Maika the Maki Sage (pixel art)"},{"file":"art/wiki/person/maika-the-maki-sage-3.webp","caption":"maika (ChatGPT)"}]},{"img":"art/portraits/olola-portrait-a.png","face":"art/portraits/pixel/olola.png","id":"person/olola-the-fire-dancer","group":"person","title":"Olola the Fire Dancer","file":"lore/person/olola-the-fire-dancer.md","state":"ok","md":"# Olola the Fire Dancer\n\nMet in the fire islands. Olola is a southern [Nuitagata](../ethnicity/nuitagata.md). Very intense disposition, unapproachable personality, devout follower of Mauga, with no belief in [Shaka](../god/shaka.md). No sense of humor or tact. Speaks loudly and dramatically. She has heterochromatic eyes of fiery red and mystic purple. She uses [Lelua](../technology/lelua.md) in combat, a fire based acrobatic martial art.\n\nHer elements are **Ahi **and **Mana**, making her the ultimate dealer of physical and magical offense.\n","pics":[{"file":"art/wiki/person/olola-the-fire-dancer-1.webp","caption":"Olola the Fire Dancer"},{"file":"art/wiki/person/olola-the-fire-dancer-2.webp","caption":"Olola the Fire Dancer (pixel art)"}]},{"img":"art/portraits/paku-portrait-a.png","face":"art/portraits/pixel/paku.png","id":"person/paku-the-navigator","group":"person","title":"Paku the Navigator","file":"lore/person/paku-the-navigator.md","state":"ok","md":"# Paku the Navigator\n\nPaku is an experienced sailor and master chef, with greying red hair and a lifetime spent exploring the seas of Nuitai. He once braved the Arctic northern waters of [Tokelau](../location/tokelau---the-north-sea.md), surfed near the eye of [The Great Maelstrom](../location/the-great-maelstrom.md), and lived to tell about it. He has unmatched knowledge of navigation, sailing, and survival at sea. Years ago, he left his wife and young son to pursue the call of adventure, driven by a desire to explore the world and seek new challenges.\n\nHe is old now, huge and loud, with a big belly and his greying red hair tied in a ponytail. He has been around long enough to dress like it: loose Bandari clothes, an open shirt with a floral pattern, shorts and a sash, mostly in blue and purple with a bit of red and gold. He goes barefoot, because he hates being weighed down or held in by anything.\n\nBold and larger-than-life, Paku laughs in the face of danger and seems undaunted by any challenge. His boisterous nature and hearty appetite for food and drink can make him appear reckless or callous at times, but those who know him understand his courage and good humor run deep.\n\nSkilled in [Wai’Kenpō](../technology/waikenpō.md), which he learned during his travels to the [Kame Kingdom](../organization/kame-kingdom.md). Paku has also mastered channeling [Mana](../law/mana.md) to cast powerful water elemental spells. When the party meets him, he provides a larger ship, serving as both guide and mentor on their oceanic journey.\n\nHis elements are **Wai **and **Mana**, making him proficient in physical defense and magical offense.\n","pics":[{"file":"art/wiki/person/paku-the-navigator-1.webp","caption":"Paku the Navigator"}]},{"img":"art/portraits/ren-portrait-a.png","face":"art/portraits/pixel/ren.png","id":"person/ren-the-pirate-captain","group":"person","title":"Ren the Pirate Captain","file":"lore/person/ren-the-pirate-captain.md","state":"ok","md":"# Ren the Pirate Captain\n\nKirasame Ren is the captain of the Blood Lotus pirate crew. **Kirasame** is the family name, in the order used west and under the water alike, which is one of the few things her Ikagata father and her Manusia Bandari mother had in common. Known as the Killer Shark, she has a ruthless reputation and her name is feared throughout the [Bayang Seas](../location/bayang-seas.md). She has mastered the art of [Sila](../technology/sila.md), Bandari swordplay, and has both an indomitable defense and deadly offense at close range. The greatest swordsmen have fallen to her blade, but not always the result of a fair fight. She is not above using dirty tricks, a concealed pistol here, a poison tipped dagger there. Ren doesn't care about sportsmanship, she goes in for the kill with no mercy. She is a master of weapons, her most prized is a trident from the depths, although she rarely uses it in combat.\n\nThe Blood Lotus pirates are a diverse crew, anyone is welcome as long as they respect [the code](../ritual/undang-laut.md), the captain and the crew. They just need to pull their weight and keep up. Because they will allow anyone into their band the Blood Lotus are almost a microcosm of Nuitai itself. [Ikagata](../species/ikagata.md) mostly fill their ranks, but there are crew members with ancestry and backgrounds from all over Nuitai, mostly outcasts from their respective tribes for one reason or another. Kirasame Ren inspires fierce loyalty. She is a no-nonsense captain with little patience, but she is brave, decisive, a brilliant strategist, and most of all she is fair.\n\nRen herself is of mixed ancestry; her mother was a Manusia [Bandari](../ethnicity/bandari.md), though she has no love for [Shaka](../god/shaka.md), and her father was an Ikagata. She has selachian features; pale skin, gills and rows of razor sharp teeth that can chew through steel. Her smile is more terrifying than her scowl. It is rumored that her father was one among the dreaded and inscrutable [Manogata](../species/manogata.md) that terrorize the seas of Nuitai and inspire the nightmares of children, although no one would dare suggest that to her face if they want to keep their skin on. She has soul-piercing red eyes and wild black hair.\n\nThe party meets Ren in the Bayang Seas and gets a ship upgrade when they meet her. Her elements are **Wai **and **Ata**, making her a defensive saboteur. She can use all kinds of weapons in battle including swords, guns and poison. Her ikagata ancestry makes her an excellent swimmer.\n","pics":[{"file":"art/wiki/person/ren-the-pirate-captain-1.webp","caption":"Ren the Pirate Captain"},{"file":"art/wiki/person/ren-the-pirate-captain-2.webp","caption":"Ren the Pirate Captain (pixel art)"}]},{"img":"art/portraits/sarjana-portrait-a.png","face":"art/portraits/pixel/sarjana.png","id":"person/sarjana-the-archeologist","group":"person","title":"Sarjana the Archeologist","file":"lore/person/sarjana-the-archeologist.md","state":"ok","md":"# Sarjana the Archeologist\n\nA bespectacled and curious young member of the archeological society, of [Bandari](../ethnicity/bandari.md) ancestry and accent, hailing from the Matahari Atoll but found exploring the ruins of [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md) , or rather running for his life. Proof that bravery does not mean being afraid. Scans enemies to reveal weaknesses. Obsessed with the ruins of the [Sky People](../ethnicity/lanigata.md), his curiosity gets the group in trouble with an awakened stone golem. Analytical view of the world, more skeptical than superstitious.\n\nHis elements are **Wai **and **La**\n","pics":[{"file":"art/wiki/person/sarjana-the-archeologist-1.webp","caption":"Sarjana the Archaeologist"},{"file":"art/wiki/person/sarjana-the-archeologist-2.webp","caption":"Sarjana the Archaeologist, another try (pixel art)"},{"file":"art/wiki/person/sarjana-the-archeologist-3.webp","caption":"Sarjana the Archaeologist (pixel art)"},{"file":"art/wiki/person/sarjana-the-archeologist-4.webp","caption":"Golem Chase Through Ancient Ruins (ChatGPT)"}]},{"id":"person/tamba-uli","group":"person","title":"Tamba Uli","file":"lore/person/tamba-uli.md","state":"stub","md":"# Tamba Uli\n\nA [Bandari](../ethnicity/bandari.md) monk who is said to have compiled [Shaka's Animal Lives](../document/shakas-animal-lives.md) centuries ago, to teach the youngest initiates about the [Spiral](../law/the-spiral.md) through allegory.\n"},{"img":"art/portraits/tawiri-portrait-a.png","face":"art/portraits/pixel/tawiri.png","id":"person/tawiri-the-elderly-caller","group":"person","title":"Tawiri the Elderly Caller","file":"lore/person/tawiri-the-elderly-caller.md","state":"ok","md":"# Tawiri the Elderly Caller\n\nThe third character to join the party. Hailing from the gloomy Matua Archipelago, Tawiri is an old woman and caller of the undead with a cynical but morbidly humorous disposition, to Hina’s chagrin.\n\nShe is world wary and has lived too long in the company of the dead. She is wrinkled and hunched over from age, with dark brown eyes, one of them clouded white and blind with age, and wields a magic staff that doubles as a walking stick, adorned with ceremonial feathers and skulls.\n\nTawiri's elements are **Mana **and **Ata**.\n","pics":[{"file":"art/wiki/person/tawiri-the-elderly-caller-1.webp","caption":"Tawiri the Elderly Caller"},{"file":"art/wiki/person/tawiri-the-elderly-caller-2.webp","caption":"Tawiri the Elderly Caller (pixel art)"},{"file":"art/wiki/person/tawiri-the-elderly-caller-3.webp","caption":"tawiri (ChatGPT)"}]},{"id":"person/the-luminary-of-kota-emas","group":"person","title":"Luminary of Kota Emas","file":"lore/person/the-luminary-of-kota-emas.md","state":"ok","md":"# Luminary of Kota Emas\n\nThe spiritual leader of [Kota Emas](../settlement/kota-emas.md). By tradition the\nLuminary's face is never seen. He appears in public veiled: people hear his voice\nand see his height, but never his face.\n\nThe present Luminary goes further. No one has seen him in public. He is kept hidden and sheltered, and the arrangement is maintained\ndeliberately by the people around him rather than being a habit of his own. The\ntemple says he is ill. Audiences are held through a drawn curtain, with one\nelderly priest at the gap repeating his words to the room.\n\nOn paper he is the highest office in Kota Emas; in practice a council or\nassembly governs and he rarely decrees anything, and temple and council are in\ntension. He is not elected. He is chosen by a test, as the reincarnation of a\nfigure close to Shaka who chose to stay in this world.\n\nHis name is **Tahji**.\n\n\nHis elements are **La** and **Mana**.\n\n## Not settled\n\n- Nearly everything. His personality, how he came to the office beyond the\n  test, who keeps him hidden and whether he wants to be.\n- The form of the council, and what it and the temple fight about.\n- His colour, per the inbox notes, and whether he reads as a pure Aang or a\n  cowardly Gohan.\n- A full internal reference image. Wanted, never to be published. Tracked in\n  `docs/TODO.md`.\n\n","pics":[{"file":"art/wiki/person/the-luminary-of-kota-emas-1.webp","caption":"The Luminary of Kota Emas"}]},{"id":"person/the-penyamun-agent","group":"person","title":"Penyamun Agent","file":"lore/person/the-penyamun-agent.md","state":"ok","md":"# Penyamun Agent\n\nMet either in the [Bayang Seas](../location/bayang-seas.md) or the Matahari\nAtoll. Male.\n\nHe is a [Ranagata](../species/anura.md), raised in\n[Kota Emas](../settlement/kota-emas.md). That is two displacements at once. The\nRanagata are an eastern forest people of canopy villages and\n[Anúic](../organization/anúa.md) tradition, mostly followers of\n[Lanu](../god/lanu.md), and Kota Emas is a Bandari canal city at the far\nwestern end of the world from them. The Anura who live there are generally\nKaerujin, his heavier and slower cousins, not Ranagata at all.\n\nHis name is **Asap Setia**, said AH-sahp seh-TEE-ah. He gives it in the\nwestern order, family name first, which is the Shakan convention and not the one\na Ranagata is born to: **Asap** is the family name, smoke, and **Setia**\nthe given name, loyal. Both are Bandari words. It is the first thing about him\nthat is out of place, and it arrives before he has said anything else. His people\nare from [Lanuloa](../location/the-lanuloa-archipelago.md); someone in Kota Emas\nnamed him.\n\nHe is a faithful follower of [Shaka](../organization/the-teachings-of-shaka.md)\nand fiercely loyal to the Matahari government. Nothing about this is an act, and\nnobody raised him into it by force. He is the clearest case in the cast of belief\nfollowing where a person was brought up rather than what they are. Compare\n[Kiki](../person/kiki-the-witch-doctor.md), who runs the identical contradiction\nin the opposite direction.\n\n## How he is dangerous\n\nHe is cold and calculated, and casual about it. Not menacing, not theatrical, and\nnot cold in the way of a man holding something back. He is friendly, and the\nfriendliness is real and costs him nothing, and it reaches nothing underneath. He\ndoes not perform feeling he does not have, and is not troubled by lacking it.\n\nWhat he is missing is not feeling but instinct. Asked whether a thing should be\ndone, he has nothing of his own to answer with, so he asks what the doctrine says\nand what the Matahari government wants, and then he does that. This is why he is\ndevout. His faith is not in tension with his morals; **his faith is his morals**,\nheld from outside, and he applies it more literally than a man with instincts of\nhis own would ever need to.\n\nWhich also makes him the most straightforwardly dangerous person in the cast.\nChange what the doctrine says, or who is giving the orders, and he will do\nsomething else entirely, with exactly the same warmth.\n\n## How he looks\n\nHe dresses as a ninja, all in black: a red headband, a cloth over his mouth, and\nfishnet on his arms, with a hood or a straw hat on his head. Undercover he can pass for a\nferryman in a straw hat, with his weapons hidden, still in black and red.\n\nHe uses fire-breathing tricks, which suits a Ranagata about as badly as anything\ncould. His elements are **Ahi** and **Ata**.\n\n## Not settled\n\n- Whether he knows the name he was born with.\n- Whether he is an ordinary green Ranagata or an orange tree frog variant, and\n  his eye colour.\n- Whether his ninja outfit is [Penyamun](../organization/the-penyamun.md)\n  uniform or his own choice.\n\n*Out-of-world touchstone, for writing and art direction only: Amos Burton from\nThe Expanse. Cold and calculated but casual, borrowed morality, genuine warmth\nwith nothing behind it. Not a reference anything in the setting makes.*\n","pics":[{"file":"art/wiki/person/the-penyamun-agent-1.webp","caption":"The Shadow Guild Agent"}]},{"id":"person/the-zealot","group":"person","title":"Damar Jago the Zealot","file":"lore/person/the-zealot.md","state":"ok","md":"# Damar Jago the Zealot\n\nFrom the Matahari Atoll but met much sooner. Stubborn disposition, starts out as an antagonist due to a misunderstanding. Of [Bandari](../ethnicity/bandari.md) ancestry.\n\nHis elements are **Ahi **and **La**\n\nFamily name Damar, given name Jago, said family name first: DAH-mar JAH-go, with a light stress on the first syllable of each. He goes by Damar, as Bandari do; only close friends call him Jago. *Damar* is the Bandhasa word for tree resin and the torch made from it. *Jago* is a champion, literally a fighting rooster.\n","pics":[{"file":"art/wiki/person/the-zealot-1.webp","caption":"The Zealot"}]},{"id":"god/ata","group":"god","title":"Ata","file":"lore/god/ata.md","state":"ok","md":"# Ata\n\nAn aspect of [Moanatu](../god/moanatu.md), the King of Shadows, Ata is the personification of darkness and fear. He exists in those spaces that light does not reach, in the shadows of trees, the pitch black in caves, and in the dead of a moonless night Ata's body grows. As he is shadow personified, he cannot exist directly in the path of [La Lanu](../god/la-lanu.md)'s light, but is defined in absence of it. [N'garo](../god/ngaro.md), the princess of secrets, hides in his shadow.\n\nAta represents not just darkness but also the fear of it. The hair standing on the back of your neck when you hear a rustling in the bushes in the dead of night, that is Ata at play. It should be noted that Ata is not evil, fear of the dark and the unknown is a natural instinct that can keep you alive. Ata fear aspect is a natural warning.\n\nHe is depicted the least like a mortal among the Akua Iki. His face is a carved mask of black wood, the way Matua carvers make the faces on house posts and canoe prows. The eyes are huge and round, inlaid with shell that catches torchlight. The mouth is wide and grimacing, with the tongue thrust out in defiance and a row of shark teeth set into the lips. Deep spiral grooves cover the brow and cheeks, cut in the same patterns as Matua tattoos, and a crest of black feathers rises from the top of the head. Below the mask there is no body, only shadow.\n\nAta masks are popular among the children of the [Matua Archipelago](../location/the-matua-archipelago.md) during festivals. They are carved from wood, given shell eyes and a tongue, and worn in front of torches and lanterns so the shadows they cast are as large as possible.\n","pics":[{"file":"art/wiki/god/ata-2.webp","caption":"Ata, Spirit of Darkness and Fear","stale":true},{"file":"art/wiki/god/ata-3.webp","caption":"Children's Shadow Mask Festival","stale":true},{"file":"art/wiki/god/ata-1.webp","caption":"Ata and Ngaro","stale":true}]},{"id":"god/hau","group":"god","title":"Hau","file":"lore/god/hau.md","state":"ok","md":"# Hau\n\nAmong the many Akua Iki of Nuitai, Hau embodies the element of air and wind. As a being born from the powers of the three great Akua Nui, Hau exists in multiple temperaments or reflections, each tied to one of their domains.\n\n- **Hau **[Lanu](../god/lanu.md): the gentle breeze that rustles the treetop leaves.\n\n- **Hau **[Mauga](../god/mauga.md): the swirling hot air and rising smoke of fire and volcanoes.\n\n- **Hau **[Moanatu](../god/moanatu.md): the gales and currents of the ocean that guide or destroy ships.\n\nThese forms are sometimes regarded as distinct sibling entities, other times as shifting moods of a single divine spirit, all named Hau.\n","pics":[{"file":"art/wiki/god/hau-1.webp","caption":"Hau, Spirit of the Wind"},{"file":"art/wiki/god/hau-2.webp","caption":"Hau (ChatGPT)"}]},{"id":"god/jangya","group":"god","title":"Jangya","file":"lore/god/jangya.md","state":"ok","md":"# Jangya\n\nJangya is one of the many ancient Devas in the Sarpic pantheon. He is generally thought of as the god of war, a stereotype reinforced by his fearsome visage and battle hardened iconography, but followers of [Sarpa](../organization/sarpa.md) and devotees of Jangya in particular better understand that his domain encompasses those qualities that make great heroes and leaders such as courage, honor, discipline, inspiration, patience and clarity of judgement.\n\nAffectionately known as the \"Blue General\", Jangya is depicted as an anthropomorphic elephant with azure skin and a powerful statue and build. He wears golden armor with a red and gold sash around his waste, a golden crown decorated with sapphires, rubies and emeralds, upon his head, and jewelry adorning his large ears, tusks and each of his six arms. Jangya is one of the most recognizable and memorable gods of the Sarpic pantheon due to his appearance, and is usually the first Deva outsiders to Sarpa think of despite not being the most important or central to the pantheon, he remains popular in the imagination of the larger Bandari population.\n\nLike other Devas each pair of arms signifies a different aspect. Prajang is his aspect representing the courageous hero or the brave warrior, diving head first into battle with a curved sword and round, golden buckler in his lower hands. Where [Kong](../god/kong.md) is invoked when pure rage or strength are needed, warriors invoke Prajang for noble courage when immediate action is needed. The middle pair of arms belongs to Samanjang, the inspiring leader aspect of Jangya, occupying the space between mind and action. One hand gestures outward, urging and commanding soldiers forward to the battlefield, while the other is pulled back, gripped into a fist representing resolve. The top pair of arms symbolize Rananjang, the strategist and tactician. One hand holds a scroll while the other a [Charu](../ritual/charu.md) piece. Depictions of Jangya, especially of Rananjang, are often of the god of war hunched over a game of Charu thoughtfully considering his next move, comically dwarfing his opponent in size if he is playing against a mortal, but still taking the game quite seriously, or patiently awaiting his opponent's turn.\n\nJangya is not prayed to just by warriors and generals, but anyone seeking courage or decisiveness. His name is invoked casually in friendly games of strategy or competition in general, and Bandari in leadership positions will sometimes have an image of him decorating their offices. This is true mostly among Shakans, who make these gestures more as a token of symbolism or affection then religious devotion. As Sarpa is a dying religion, eclipsed by the Teachings of Shaka that is followed by the vast majority of Bandari, and only the ancestors of the Bandari living in the [Matahari Archipelago](../location/matahari-archipelago.md) have seen full scale war, there are no temples to Jangya and his devotees are few and far between. The proud descendants of warrior families or Sarpic sailors and adventurers braving the sea monster infested waters circling the great maelstrom may have shrines to him, as do politicians representing the Sarpic minority.\n\nWhile Jangya is depicted as having the head and feet of an elephant, no one alive on the Matahari Archipelago would ever have seen one. Some flora and fauna made it on that voyage centuries ago, but most of the natural wonders of Bandar have been lost to legend. There are many depictions in art and mentions in historical or legendary accounts of beings that look like Jangya, blue skinned, multi-armed elephant men, but scholars believe are not Jangya. For one, these artistic depictions show multiple of these beings in one scene, and they are missing their divine symbology, and the texts that describe them are more descriptive than devotional, almost like a record of accounts. For this reason some believe there is a race of people who lived in Bandar, and possibly still exist in that forgotten realm, that inspired Jangya, perhaps he is an imported deity. These beings are sometimes referred to as simply \"Jangs\" or \"Jangas.\"\n\nThe Matahari Archipelago, especially [Kota Emas](../settlement/kota-emas.md), is home to a wide variety of races. Among these are proboscideans, or \"gajas\" in Bhandhasa. Gajas have long prehensile noses, big floppy ears, and tusks, but do not have blue skin, they typically come in shades of grey or brown, they only have two arms, and they do not have divine or mystic powers. They are simply mortals living and working in the world like anyone else. The gaja minority has a complicated relationship with their resemblance to the ancient Sarpic god of war. For some, especially gajas that are devout followers of Shaka, they want nothing to do with any mention of Jangya or Jangs and can even find the comparison offensive. For some, including gajas that practice Sarpa, they may take the comparison in good humor and lean into the similarity, or for those few gajas that worship Jangya, consider it an honor or even claim divine lineage.\n\nThe pronunciation of Jangya's names in [Bandhasa](../language/bandhasa.md) vary by region. In the northern islands of the Matahari Archipelago, as well as Kota Emas, people tend to go by the shorter Jangya or simply Jang, and his aspects are known as Prajang, Samanjang and Rananjang. In the southern islands and the Bayang Seas polysyllabic pronunciations with open vowels are more common; Jangaya, Prajangaya, Samanjangaya, and Rananijangaya. Naturally, southern Bandhasa is spoken faster.\n","pics":[{"file":"art/wiki/god/jangya-4.webp","caption":"Jangya, the Blue General"},{"file":"art/wiki/god/jangya-2.webp","caption":"Jangya Playing a Board Game"},{"file":"art/wiki/god/jangya-5.webp","caption":"Jangya's Three Aspects"},{"file":"art/wiki/god/jangya-3.webp","caption":"Jangya and Kong"},{"file":"art/wiki/god/jangya-1.webp","caption":"A Gaja and the Statue of Jangya"},{"file":"art/wiki/god/jangya-6.webp","caption":"Jangya (ChatGPT)"}]},{"id":"god/kong","group":"god","title":"Kong","file":"lore/god/kong.md","state":"ok","md":"# Kong\n\nKong is the ancient [Sarpic](../organization/sarpa.md) deity of primal rage. He is an unusual Deva, unlike the other serene and luxuriously adorned multi-armed members of the pantheon that represent noble ideals such as love, bravery or music, Kong is simply a colossal ape like beast that represents pure, unadulterated rage. Besides the golden crown or helmet he wears on his head, which stands out among the rest of his image, If he dons any clothing at all it is a simple loincloth at best. He is normally depicted with his mouth open and fangs visible, roaring, whilst wielding a large tree trunk or some other large object too big for a mortal to carry one handed, emphasizing his size. Kong also has the most consistent artistic depiction among the Devas, there is very little difference in how he is depicted across cultures and centuries old art.\n\nHis image and nature are not the only oddities. Kong is not known to have any worshipers. There are no shrines or temples to him. If there were any in the past they have been lost with the route to [Bandar](../organization/bandar.md). He is normally invoked as a metaphor for anger, and the closest mortals come to devoting themselves to Kong is invoking his name when they need pure physical strength, whether lifting a heavy object or fighting a tough battle, one might imagine themselves as Kong in that very moment.\n\nWhile Kong has no devotees, even among the Sarpic minority, he is still a popular figure in [Bandari](../ethnicity/bandari.md) culture in his own way. He is afforded a morbid fascination and he commonly appears in stories, plays, art and as a festival mask for children. He is especially popular among children's stories and games.\n\nConsidering how alien Kong is compared to the rest of the Sarpic pantheon, and how simple and unvaried his image is, some historians have theorized that he is an outside deity that was introduced from a foreign culture, or perhaps Kong was a real animal that existed in Bandar, and much like the sacred guardian beasts of Nuitai was ancient and massive enough to be venerated as a god. It's possible Kong still roams the jungles of Bandar, but no one will ever know.\n","pics":[{"file":"art/wiki/god/kong-1.webp","caption":"Kong, God of Rage"}]},{"id":"god/la-lanu","group":"god","title":"La Lanu","file":"lore/god/la-lanu.md","state":"ok","md":"# La Lanu\n\nLa Lanu, or Ra Lanu as he is called in Matua, is the Akua Iki of the sun and it's light. He is traditionally considered an aspect of [Lanu](../god/lanu.md), and associated with the nourishing light that allows her vegetation to grow.\n\nIn the last century, the influence of [Bandari](../ethnicity/bandari.md) missionaries and their preaching of [The Teachings of Shaka](../organization/the-teachings-of-shaka.md) in Nuitai has lead many Nuitagata in the east to equate [Shaka](../god/shaka.md) and his sun symbolism with La. This also re-contextualized the association of sunlight with wisdom and moral purity.\n\nThis identification of the foreign sun god Shaka with the native sun god La has been clarified and formalized in the doctrine of [The Nature Priests of Māla Iki](../organization/the-nature-priests-of-māla-iki.md), and wholly rejected by the [Maki Sages](../organization/maki-sages.md), as well as the Nuitagata of the south who never accepted the Bandari faith.\n\nOutside of Māla, many eastern Nuitagata still regard Shaka and La as distinct beings, and simply follow Shaka’s teachings alongside their native faith without merging the two.\n\nLa [Mauga](../god/mauga.md), as she is known in the [Velafi](../location/velafi.md) to the southeast, is the personification of firelight.\n\n*Kameterasu *is the native sun god of the [Kame](../species/kame.md) people, he is the Kame analog of La Lanu and was later identified with [Shaka](../god/shaka.md) in syncretic [Wai'Ki](../organization/waiki.md) practices.\n","pics":[{"file":"art/wiki/god/la-lanu-1.webp","caption":"La Lanu, God of Sunlight"},{"file":"art/wiki/god/la-lanu-2.webp","caption":"The Sun Gods"}]},{"id":"god/lanu","group":"god","title":"Lanu","file":"lore/god/lanu.md","state":"ok","md":"# Lanu\n\n[Akua](../law/akua.md) of the sun, the sky and the forests. Her domain is the energies of all living things, embodying life, light, growth, harmony, and the gentle rain. With the spread of [Shaka](../god/shaka.md)’s teachings among the people of [Māla Iki](../location/māla-iki-islands.md) and [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md), the aspects of the sun and light traditionally associated with Lanu came to be attributed to him, to the chagrin of the [Maki Sages](../organization/maki-sages.md).\n","pics":[{"file":"art/wiki/god/lanu-2.webp","caption":"Lanu, Goddess of Life and Nature"},{"file":"art/wiki/god/lanu-1.webp","caption":"Lanu and Her Aspects"},{"file":"art/wiki/god/lanu-3.webp","caption":"Pua'a, Spirit of Animals and Mortals"}]},{"id":"god/laya","group":"god","title":"Laya","file":"lore/god/laya.md","state":"ok","md":"# Laya\n\nLaya is the ancient Sarpic Deva of artistic expression in all its forms, revered as the source of inspiration and creativity in Bandari culture. Among the Devas, Laya is the one most closely tied to expression, performance, and the shaping of beauty.\n\nLaya has no definitive gender, and is usually depicted as androgynous leaning either masculine or feminine in features depending on the origin or date of the depiction. Their form is fluid and expressive, reflecting the changeable nature of the arts themselves. In their whole form they are always shown with eight arms and four long, furry prehensile tails twirling in a spiral, imagery that marks Laya as one of the ancient Devas whose symbolism predates the structured theological movements of later eras.\n\nLaya’s identity is understood through four divine aspects, each representing a different avenue of creative expression. Raglaya governs music and song, Ruplaya presides over the visual arts, including painting, sculpture, color, and the shaping of beauty. Kathlaya rules storytelling, recitation, drama, and theater. Raglaya and Kathlaya are sometimes combined to represent poetry. Karlaya embodies craftsmanship and the transformative skill of shaping raw material into purposeful form.\n\nIn their unified iconography, Laya rests cross-legged on a cushion, their eight arms each bear a tool of creation, arranged from the most ethereal arts to the most grounded. Their uppermost pair of hands plays a long-necked lute, the two arms working together as if caught in mid-performance, embodying Raglaya’s music. The next pair holds the instruments of Kathlaya: in one hand a scroll, representing the written word, and in the other a stylized theater mask, its expression shifting slightly from depiction to depiction. The third pair is given to Ruplaya, the visual arts, with one hand lifting a slim painter’s brush and the other supporting a shallow palette marked with swirling colors. The lowest pair belongs to Karlaya, where Laya’s hands hold a broad varnish brush in one and a small bowl of lacquer in the other, tools of finishing and transformation that root the deity’s radiance in the everyday work of artisans.\n\nIn northern Matahari and in cosmopolitan Kota Emas, these names are often shortened with either the second vowel dropped off, the -ya ending silent, or both, resulting in the truncated Ragla, Rupla, Kathla, and Karla or Karyala. In the southern islands and extending to the Bayang Seas the longer forms Ragalaya, Rupalaya, Kathalaya, and Karyalaya are more commonly used.\n\nAcross Sarpic and Bandari communities, Laya is experienced almost as a muse. To play good music is to let Raglaya play through your hands, to tell a riveting story or recite beautiful poetry is to let Kathlaya speak through you. Laya's inspiration is not limited to just the performing arts, any spark or stroke of inspiration or creativity in any form can be thought of as Laya's blessing.\n\nAlthough devotion to Laya is found everywhere in western Nuitai, it flourishes most in Kota Emas where performers, poets, and craftsmen treat the Deva of the arts as patron and guiding spirit. Shrines devoted specifically to their musical or storytelling aspects are common in theaters, academies, and artisan districts. In smaller villages, Karlaya is the aspect most often honored, especially among woodworkers, potters, and metalworkers. It is also common for rural shrines to merge Karlaya with Kartava, honoring the two together under the name Karya.\n\nLaya’s domain meets Tavaya’s wherever beauty and function intersect. Their relationship is not antagonistic but complementary: Laya inspires and elevates, Tavaya shapes and refines. Traditions in Kota Emas often interpret this as a partnership between impulse and discipline, while others like to think of Tavaya as a more modern successor to Karlaya’s ancient role in guiding artisans.\n","pics":[{"file":"art/wiki/god/laya-1.webp","caption":"Laya, God of the Arts"}]},{"id":"god/marama","group":"god","title":"Marama","file":"lore/god/marama.md","state":"ok","md":"# Marama\n\nMarama is the Akua Iki of the moon and the tides. An aspect of both [Lanu](../god/lanu.md) and [Moanatu](../god/moanatu.md), he dwells in Lanu’s sky but moves through Moanatu’s time, the night. He is known as Marama Lanu when seen as the moon above, and Marama Moanatu when riding the tide below.\n\nHis light is reflected from [La Lanu](../god/la-lanu.md), cast upon the waters of Nuitai, and his phases marks the passing of time for sailors, farmers, and fishers alike. In his myth the shape of his eyes represent the phases of the moon, and his pupils can appear as either shining silver, deep blue or black as night.\n\nMarama is commonly depicted as a calm young man wearing a crown of pale coral set with small pearls and a lei of seaweed. The coral symbolizes the sea’s foundation, and the pearls its quiet treasures and the shining face of the moon. He is sometimes depicted as lounging on a crescent moon.\n\nHe carries a conch shell that calls the turning of the tides. In coastal villages, people make small offerings during the new and full moons, seeking his favor for safe voyages and plentiful catches. Sailors read his face in the sky to judge the tides, the weather, and their time at sea.\n\nMarama is patient and distant, neither warm nor cold, his attention steady but impersonal. He embodies both the beauty of stillness and slow, gentle motion. He is both the rhythm of the ocean below and the quiet watcher of the night sky above.\n","pics":[{"file":"art/wiki/god/marama-1.webp","caption":"Marama, God of the Moon and Tides"}]},{"id":"god/matahari","group":"god","title":"Matahari","file":"lore/god/matahari.md","state":"ok","md":"# Matahari\n\nMatahari is a [Sarpic](../organization/sarpa.md) deity, the ancient [Bandari](../ethnicity/bandari.md) god of the sun and it's light. In early Sarpic tradition he was regarded as a literal solar deity, but in later centuries his domain came to be understood more philosophically as law, order, and truth, illuminating and burning away deceit and illusion.\n\nWhen [The Teachings of Shaka](../organization/the-teachings-of-shaka.md) became the dominant religion of [Bandar](../organization/bandar.md), [Shaka](../god/shaka.md) himself was said to have either mantled Matahari or was in fact Matahari in mortal form, depending on the interpretation. When this happened \"Shaka as Matahari\" gained the additional themes of wisdom, compassion and wil. Matahari is an old epithet for Shaka and is not commonly used in this day and age, but the [Matahari Archipelago](../location/matahari-archipelago.md) was mostly likely named after \"Shaka as Matahari\" since the islands were discovered when the Shakan faith was already twelve hundred years old.\n\nA small number of Sarpic practitioners continue to venerate Matahari in his older, pre-Shakan form.\n","pics":[{"file":"art/wiki/god/matahari-1.webp","caption":"Matahari, the Ancient Sun Deva"}]},{"id":"god/matei","group":"god","title":"Matei","file":"lore/god/matei.md","state":"ok","md":"# Matei\n\nMatei Moanatu, or Makei Moanaku as it is pronounced in the east, is a psychopomp that guides the souls of the dead to the [The Underworld](../location/the-underworld.md). As an Akua Iki she is an aspect, and sometimes depicted as the daughter, of [Moanatu](../god/moanatu.md).\n\nShe is typically depicted as a young woman with a serene or content expression, with black lipstick and eyeshadow, wearing a garland of skulls and a lei of white, pink and violet plumeria flowers. Sometimes she is depicted as a ferryman holding an oar, covered in seaweed or kelp, navigating her passengers to the heart of [The Great Maelstrom](../location/the-great-maelstrom.md), while in other tales she drags the dead down below the earth.\n\nLike her father, Matei is not malevolent, nor does she have a reputation to be particularly comforting to the dying, she simply appears before mortal's when they are knocking on death's door, without saying a word, walking on water, and helps them find their way to the afterlife. She is inevitable and eternally patient.\n\n[The Callers](../organization/the-callers.md) of [The Matua Archipelago](../location/the-matua-archipelago.md) have a special relationship with Matei: she is their patron for the work with the dead, as [N'garo](../god/ngaro.md) is for the hidden. It is not uncommon in the south, especially in the Matua islands, to find shrines dedicated to her with offerings of flowers, fruit, seashells or carved dead coral. These offerings are usually meant for the souls of lost loved ones, so they are guided to the underworld and not lost or stuck wandering Nuitai to roam, but sometimes offerings of bones are buried in secret as means to beseech Matei for more time.\n\nIn the east, [Matei Lanu](../god/lanu.md) is believed to be responsible for the natural decomposition of plants and animals, as well as the growth of fungus, an example of death being necessary for the continuation of life.\n","pics":[{"file":"art/wiki/god/matei-2.webp","caption":"Matei, Guide of the Dead"},{"file":"art/wiki/god/matei-1.webp","caption":"Matei as the Ferryman"}]},{"id":"god/mauga","group":"god","title":"Mauga","file":"lore/god/mauga.md","state":"ok","md":"# Mauga\n\n[Akua](../law/akua.md) of fire, volcanoes, the earth and the creation of the islands. Her domains are passion, destruction, creation, will, change, transformation, and renewal. Tribute is paid to Mauga on islands that have volcanoes, her wrath is placated. But on [Velafi](../location/velafi.md) in particular her followers express love and devotion to her.\n\nWhen Mauga stirs beneath the earth, the islands tremble. Her restlessness or anger causes the ground to quake, the mountains to breathe fire, and the sea itself to rise. The great waves that follow, tsunamis, are the result of her power shaking [Moanatu](../god/moanatu.md)’s realm until his waters surge in answer.\n","pics":[{"file":"art/wiki/god/mauga-3.webp","caption":"Mauga, Goddess of Fire and Volcanoes"},{"file":"art/wiki/god/mauga-2.webp","caption":"Mauga and Her Aspects"},{"file":"art/wiki/god/mauga-1.webp","caption":"Mauga Shakes the Sea"}]},{"id":"god/moanatu","group":"god","title":"Moanatu","file":"lore/god/moanatu.md","state":"ok","md":"# Moanatu\n\n[Akua](../law/akua.md) of the stormy seas, the underworld, and the mysteries of the depths. His domain is entropy, memory, magic, hidden things, death and decay. It may seem unusual that the god of the ocean and the god of death are one and the same, but consider how treacherous it is to sail the waters of Nuitai. The bottom of the sea is a graveyard. Some believe that the core of the maelstrom, the heart of Moanatu, is a portal to his underworld. Moanatu is not worshiped and revered in the traditional sense, his name carries a solemn weight. He is respected and feared, homage is paid to him, especially by sailors and the callers. We all return to the ocean.\n\nWhere he is depicted at all he rises waist-deep from dark water, shirtless, in a simple dark wrap. His hair and beard are not hair. They are seaweed, in ocean blues and greens, drifting as though he were still below. No Nuitagata grows facial hair, so the beard was never his to grow: it is what the sea floor has put on him.\n","pics":[{"file":"art/wiki/god/moanatu-2.webp","caption":"Moanatu, God of the Sea and Death"},{"file":"art/wiki/god/moanatu-1.webp","caption":"Moanatu and His Aspects"}]},{"id":"god/ngaro","group":"god","title":"Ngaro","file":"lore/god/ngaro.md","state":"ok","md":"# Ngaro\n\nAn aspect of [Moanatu](../god/moanatu.md), the princess of secrets, N’garo is the goddess of the hidden, the unseen and the forbidden. Where Ata embodies the instinctive fear of darkness, N’garo governs what is actually concealed inside it. She moves and hides within [Ata](../god/ata.md)’s shadow, using the cover he creates to obscure objects, knowledge and intentions. She is the patron saint of those who seek arcane and forbidden knowledge.\n\nShe is also tied to the loss or distortion of information. Forgetfulness, misplaced memories, and even deliberate lies are considered part of her influence. Anything that slips from the grasp of understanding, whether by intention or accident, falls under N’garo’s domain.\n\nN’garo is depicted as a woman in rags whose age shifts between youth and old age. Her posture is slightly hunched, as if she’s always leaning toward something unseen. She often wrings her hands, her creepy smile sits unevenly on her face, suggesting she knows more than she shares. Her eyes look tired, with dark circles beneath them, and her hair is usually shown loose and unkempt. The overall impression is of someone who spends her time in places where light and attention rarely reach.\n","pics":[{"file":"art/wiki/god/ngaro-1.webp","caption":"Ngaro, Goddess of Secrets"}]},{"id":"god/priya","group":"god","title":"Priya","file":"lore/god/priya.md","state":"ok","md":"# Priya\n\nPronounced with a rolled \"r\", Priya is an ancient Deva associated with love in its different forms. She is widely revered among [Sarpic](../organization/sarpa.md) communities, with a dedicated cult that places her at the center of their devotional life. Although devotion to Priya is not limited by gender, she has long been especially popular among women, who often keep small charms or household shrines in her honor.\n\nPriya is depicted as a three tailed, six armed goddess whose three pairs of hands each symbolize the three expressions of love she embodies: desire, companionship, and compassion. These expressions are also treated as three distinct Devas who can act independently when invoked:\n\n- Kamapri represents romantic excitement, passion, longing and attraction.\n\n- Kayapri governs partnership, marriage and the steady bonds of shared life.\n\n- Karunapri expresses kindness, generosity, compassion and care for friends, family and the larger world.\n\nAll three are considered true manifestations of Priya, each reflecting a different way that relationships shape life within the Spiral.\n\nIn artistic depictions and statues, Priya’s upper right hand holds a flaming heart while her upper left hand forms the beckoning gesture representing the passion and allure of Kamapri. Her middle pair of hands is shown clasped together or linked by a thin red thread, representing the companionship of loyalty of Kayapri. Her lower right hand holds a bowl of rice, and her lower left hand rests open on her thigh, palm upward, reflecting the generosity and openness of Karunapri. Priya is usually depicted seated and composed, eyes serenely half open, surrounded by the serpentine motifs common to Sarpic imagery.\n\nWhen each of her aspects are depicted individually they have a the normal set of two arms and one tail, but donning different colored clothing and different expressions and body language representing their unique temperaments.\n\nKamapri is invoked by those experiencing longing or uncertainty in matters of attraction. Kayapri remains important in marriage ceremonies, even among followers of Shaka. Karunapri is called upon during acts of charity, caregiving, and reconciliation.\n\nTogether, these three aspects cover the spectrum of how people relate to one another across their lives, and Priya remains one of the most familiar and approachable Devas in daily Sarpic practice, remaining popular even among [Bandari](../ethnicity/bandari.md) majority devoted to [Shaka](../god/shaka.md).\n\nIn addition to her six arms, Priya is also often depicted with three furry prehensile tails. This feature appears most frequently in older Vanaran influenced art, and is common in early Sarpic depictions of the Devas. The presence of these tails is sometimes cited by scholars as further evidence that Vanara Bandari were more prevalent in the ancient past.\n","pics":[{"file":"art/wiki/god/priya-1.webp","caption":"Priya, Goddess of Love"},{"file":"art/wiki/god/priya-2.webp","caption":"Priya's Three Aspects"}]},{"id":"god/shaka","group":"god","title":"Shaka","file":"lore/god/shaka.md","state":"ok","md":"# Shaka\n\nShaka is the founder and central figure of the foreign Bandari faith known as the [Teachings of Shaka](../organization/the-teachings-of-shaka.md). He is the first Luminary, and possibly the most important figure in all of Bandari culture, at least among the diaspora in western Nuitai.\n\nMortal in origin and not god in the traditional sense, Shaka was born into a culture shaped by the ancient [Sarpic](../organization/sarpa.md) faith of [Bandar](../organization/bandar.md). The Sapric deities, the Devas, embodied moral and philosophical ideals rather than the elemental forces of nature represented by the [Akua](../law/akua.md) of Nuitai. Among theves Devas, Matahari was revered as the light of truth and cosmic order. Shaka’s own teachings would later reinterpret and ultimately inherit those same domains.\n\nHe died two thousand years ago. For many he is ascended and is represented by the light of the sun. He is said to have mantled the ancient Sarpic Deva of the sun, [Matahari](../god/matahari.md). In popular tradition this mantle blurred into full identification, leading some to regard Shaka as Matahari reborn in mortal form. He is still sometimes referred to by Matahari’s name, though it is an old epithet in this century. In taking on this mantle he inherited the Deva’s ancient domains of law, order, and clarity, while adding themes of compassion, progress, enlightenment, wisdom, and social justice.\n\nShaka's face is never shown. Shakan art shows him through his symbols and the objects of his story: the sun, and his sword standing upright in the sand where he left it. An empty beach, a sword in the sand and a rising sun mean Shaka to anyone raised in the faith.\n\nSome [Bandari](../ethnicity/bandari.md), particularly of Vanara ancestry, claim Shaka was a Vanara himself and depict him in art and sculpture as having a furry prehensile tail. They go further than anyone else and show his body, so that the tail can be seen, but even they veil his face. The Vanaran depiction emphasizes compassion, justice, and will rather than serenity, law, and order.\n\nIn Nuitai, Shaka is sometimes referred to as \"the La'gata,\" or Ra'gata in Matua, which means \"Sun Man\" in [Nuitai’lo](../language/nuitailo.md). Many Nuitagata equate him with their native sun god [La Lanu](../god/la-lanu.md), an interpretation formalized by the syncretic [Māla](../organization/māla.md) faith, which reconcile [Anúic](../organization/anúa.md) devotion to [Lanu](../god/lanu.md) with the teachings of Shaka.\n\n### Shaka the Explorer\n\nBefore he found wisdom and ascended to become the teacher of the world, Shaka was a man of boundless appetite for adventure and knowledge. Bandari culture is filled with tales of his voyages on the ocean, sailing every known sea, chasing storms for sport and diving into the maws of sea serpents just to see what waited inside. He wrestled monsters, stole from tyrants, and laughed in the face of danger. His strength was beyond any mortal's, his cunning unmatched, his bravery and mirth were unrivaled. His shipmates admired him as if he were a demigod, following him to the end of the world and would have gladly followed him into the jaws of underworld itself if he asked it of them.\n\n### Shaka the Champion\n\nAs the years passed by, somewhere between the triumphs and adventures, Shaka began to laugh less. In the markets and ports he passed through on his journeys, he began to see the weight others carried; the sadness, the hunger, the cruelty, the hollow obedience to masters and gods alike. The injustice and acceptance of suffering angered him. When a famine struck one island, he gave his spoils to feed strangers. When he saw soldiers beating a beggar in the streets for sport, it infuriated him and he bloodily intervened. He changed from a daring laughing explorer without a care in the world to a selfless hero with the weight of the world on his shoulders and seething rage in his heart. Stories say he fought for justice as fiercely as he once fought for gold and adventure. In those times he came to be loved by the common people and the downtrodden, and hated by those in power. He became a hero of the common man, but despite his selfless achievements the bitter anger against the unfairness of it all continued to grow in his heart.\n\n### Shaka the Wanderer\n\nVictory after victory Shaka could not find peace. For every suffering he eased there was always more. It never-ending. He came to the melancholy realization that there will always be injustice, always people impoverished and struggling, laboring in the fields only to succumb to disease, old age and then death. Happiness is a fleeting dream. One morning, Shaka is said to have set his sword in the sand, shed his armor, and walked inland alone. He traded his silks for ragged robes, sold his ship, and gave everything away. Then he just walked for days, with no direction in mind. He settled on a beach, stared off into the sunset and began meditating, focusing on his breath, trying to connect to his surroundings and the present moment. This was a common Bandari practice at the time, one he learned as a warrior to hone his senses, but this time he had an epiphany.\n\n### Shaka the Luminary\n\nListening to the gentle tide roll in and out, and watching the rippling reflection of sunlight on the water, he began to appreciate rather than bemoan the impermanence of life. He realized that all things rise and fall like waves, and that to hate the storm is to drown in it. His deeds had meaning, his compassion still mattered, yet he understood his work would never be finished, and that was alright. What mattered was to act without clinging to the result.\n\nThe key, he found, was compassion joined with clarity: to see the world’s suffering without turning away, but also without letting anger or despair rule the heart. Acceptance was not surrender, it was the ground from which true courage could grow.\n\nIn that reflective stillness something changed within him. The world seemed to slow down. He saw beyond the horizon, and in that vision, every life he had lived. His wisdom swelled with the passing of the ages, and he came to understood that the prison of the Spiral***** is built by resistance, the harder one fights the current, the longer one is trapped. Only by yielding to its flow could one pass beyond the Spiral of suffering. He smiled at the setting sun, and in that moment he awakened. Years later, when he died, the Bandari say he ascended with the golden sunlight of the breaking dawn.\n\nIt is important for the reader to understand that long before Shaka’s time the people of Bandar already believed that one is reborn into a new body upon death, and that actions in this life influence one’s rebirth. This idea is an ancient Sarpic concept, not something introduced by Shaka. What Shaka did was moralize and reinterpret this older belief into what he called the Doctrine of Recurrence. While these ideas were new to the people of Nuitai when Shaka’s teachings first spread around the maelstrom, they had been part of Bandari cosmology for centuries.\n\nWhat was truly novel in Shaka’s message was the claim that one could escape and ascend beyond the Spiral entirely. This possibility was subversive and deeply attractive to the poor and lower castes, since it offered a

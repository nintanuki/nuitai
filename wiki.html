La** | ⬛ **Ata** | 🟪 **Mana** |\n|---|---|---|---|---|---|---|\n| 🟥 **Ahi** | | Fighter / Healer | Fighter / Defender | Fighter / Enhancer | Fighter / Saboteur | Fighter / Blaster |\n| 🟩 **Lau** | | | Healer / Defender | Healer / Enhancer | Healer / Saboteur | Healer / Blaster |\n| 🟦 **Wai** | | | | Defender / Enhancer | Defender / Saboteur | Defender / Blaster |\n| 🟨 **La** | | | | | Enhancer / Saboteur | Enhancer / Blaster |\n| ⬛ **Ata** | | | | | | Saboteur / Blaster |\n\n**Five pairs have Ahi and five have Mana,** and one pair has both. Those nine can\nattack with an element unaided. The other six cannot.\n\n**Six pairs have neither.** They are pure support. A\nparty of three with no Ahi and no Mana between them can still heal, protect,\nstrengthen and weaken, but it cannot exploit a single weakness all game.\n\n**Every support element has exactly two solo attackers, one of each kind.** Lau\ncan be attacked with by Ahi + Lau as a physical hit, or by Lau + Mana as a spell.\nThe same holds for Wai, La and Ata. So there is always both a physical and a magical route to every element.\n\nWho each pair is, and what it is like to play, is in\n[The Fifteen Jobs](the-fifteen-jobs.md).\n\n---\n\n## In battle\n\nThree characters fight at once. Anyone recruited and not in the fight is on the\nbench and can be brought in.\n\n### The five commands\n\nEveryone, in every job, can do these five.\n\n| Command | What it does | Cost |\n|---|---|---|\n| **Attack** | Hit with whatever weapon you are holding. No element, so weaknesses never apply. | Free |\n| **Defend** | Halve the physical damage you take until your next turn. Does nothing against magic. | Your turn |\n| **Swap** | Trade places with someone on the bench. | Your turn |\n| **Item** | Use something from the bag. | Your turn |\n| **Flee** | Run. Can fail. Forbidden in boss and story fights. | Your turn |\n\n**Any weakness is one swap away.** The bench holds everyone you have recruited,\nso swapping is how you answer a fight you were not built for. It costs the turn.\n\n### Techniques\n\n**Every element lends two things: what it is, and what it does.**\n\n| Element | What it is | What it does |\n|---|---|---|\n| 🟥 **Ahi** | Fire | Physical damage |\n| 🟩 **Lau** | Nature | Heals and cures |\n| 🟦 **Wai** | Water | Protects allies |\n| 🟨 **La** | Light | Strengthens allies |\n| ⬛ **Ata** | Shadow | Weakens enemies |\n| 🟪 **Mana** | Spirit | Magic damage |\n\nA technique takes what it is from one element and what it does from another.\n\n- **One element alone does its own job.** Fire alone is a fire strike. Nature\n  alone is a heal.\n- **Two different elements make two techniques,** one in each direction. Fire and\n  Water make a *water strike*, which is Water doing Fire's job, and a *fire\n  guard*, which is Fire doing Water's job.\n- **Two of the same element make a bigger version** of that element's own\n  technique. Two Fire characters make a Fire + Fire eruption.\n\n### The grid\n\nRead across for the job, down for the element. **Bold** boxes are an element doing\nits own job.\n\n| Job ↓ / Element → | 🟥 Ahi | 🟩 Lau | 🟦 Wai | 🟨 La | ⬛ Ata | 🟪 Mana |\n|---|---|---|---|---|---|---|\n| **Fighter** (Ahi) | **Fire strike** | Nature strike | Water strike | Light strike | Shadow strike | Spirit strike |\n| **Healer** (Lau) | Fire heal | **Nature heal** | Water heal | Light heal | Shadow heal | Spirit heal |\n| **Defender** (Wai) | Fire guard | Nature guard | **Water guard** | Light guard | Shadow guard | Spirit guard |\n| **Enhancer** (La) | Fire boost | Nature boost | Water boost | **Light boost** | Shadow boost | Spirit boost |\n| **Saboteur** (Ata) | Fire curse | Nature curse | Water curse | Light curse | **Shadow curse** | Spirit curse |\n| **Blaster** (Mana) | Fire blast | Nature blast | Water blast | Light blast | Shadow blast | **Spirit blast** |\n\n- **6 bold boxes** for the single elements, each with a bigger two-person version.\n- **30 plain boxes,** two for each of the fifteen pairs.\n- **42 techniques in all,** and that is the minimum. A box can hold more than one.\n\n*The names in the grid are placeholders, and most boxes are not designed yet.*\n\n### Who can use a technique\n\nA technique belongs to its elements, not to the people. Anyone who can bring the\nelements can use it.\n\n| How | Who brings the elements | Cost |\n|---|---|---|\n| **Alone, one element** | You | Your turn |\n| **Alone, both your elements** | You | Two turns: you act, then miss your next turn |\n| **With a partner** | One element each | One turn each |\n\nA partner technique fires on the first character's turn, and the partner's next\nturn is pushed back as though they had already acted.\n\nSo a Fire and Water character always has four techniques of their own: fire\nstrike, water guard, water strike and fire guard. Stand them beside a Light and\nNature character and the two of them open eight more boxes together.\n\nTwo characters who share an element are the only way to make its bigger version.\n\n### Only Ahi and Mana deal damage\n\nThe Fighter and Blaster rows are the only rows that hurt anything, and those jobs\ncome from Ahi and Mana.\n\n- **Physical or magic is a choice of row.** A strike lands on the enemy's physical\n  defence. A blast lands on its magic defence. Fire and Spirit together make one\n  of each, a spirit strike and a fire blast.\n- **The element decides the weakness.** A water strike is a water attack. It hits\n  whatever is weak to water, however it was made.\n- **No Ahi and no Mana means no attack.** A Light and Nature character alone gets\n  a light heal and a nature boost. She needs a partner to hurt anything.\n\n### Gear\n\nWeapons and items do not simply get stronger as the game goes on. They bend the\nrules, with a benefit and a risk, and the risk usually depends on the element of\nwhoever is holding them. A blade that doubles a Nature user's damage and hurts\nthem every time it does. A charm that heals anyone except a Water user, whom it\nharms.\n\n*No gear is designed yet.*\n\n---\n\n## Monsters\n\n**Every monster has exactly one element, and it means one thing: what the monster\nis weak to.**\n\nThis is the opposite of how characters work. A Nature monster is not a healer. A\nWater monster is not a defender. What a monster does comes from its own moves, which you learn by being hit with them.\n\n| | |\n|---|---|\n| **A monster's element decides** | What damages it double, and what damages it half |\n| **A monster's element does not decide** | Its role, its behaviour, or what its attacks do |\n| **A monster's plain attack** | Has no element |\n| **A monster's special moves** | May have one |\n| **Your characters' weaknesses** | None. Party members have no elemental weaknesses at all |\n| **Armour** | Can guard against a specific element |\n\n**The enemy cannot use your elements against you.** It cannot hit your Fire\ncharacter extra hard for being made of fire. Matching elements only matters when\nyou attack.\n\n---\n\n## Two ways to play\n\nThe system is the same in both. The only difference is where your two elements\ncome from.\n\n### At the table\n\nEach player picks two elements and that is their character. The pair gives them\ntheir role, their techniques and their half of every partner technique. The party is\nwhoever shows up, and because techniques belong to elements rather than to\nnamed people, any group of players can use the full list without a word of it\nbeing rewritten.\n\nTwo restrictions keep a table game recognisably Nuitai:\n\n- **Magic is motion.** Every technique needs a gesture. A character who cannot\n  move cannot do anything, which makes tying someone up a real tactic.\n- **No heavy armour and no heavy weapons.** Nothing in this world fights from\n  inside a metal shell.\n\n*The full tabletop rules are not written yet.*\n\n### In the game\n\nThe pairs arrive attached to people. Each of the fifteen is a character you\nrecruit with their pair already fixed, and you field three at a time out of\neveryone you have found. Your choice is who to bring.\n\nThe fifteen are in [The Fifteen Jobs](the-fifteen-jobs.md).\n\n---\n\n## Still being decided\n\n- What an element adds to a technique that is not an attack. A fire guard might\n  block fire, or nature, or trade safety for speed.\n- Real names for the 42 techniques, and which boxes get more than one.\n- Which status effects exist.\n- Whether any technique hits everyone at once.\n- Whose stats a partner technique uses.\n- When partner techniques unlock: from the start, or partway through.\n- Whether a weapon can carry an element, which would give a character a third.\n- Whether elements break effects along the same triangles, such as Light curing a\n  curse.\n- Every number. Balance waits until something is playable.\n\n---\n\n## A note on the world\n\n*For readers of the rest of this wiki, rather than players of the game.*\n\nThe six elements are a game layer. Nobody in Nuitai has an element, no character\nis ever described as one, and the words never appear in the story. In the world,\nthe wandering chef does martial arts and draws on Mana the way anyone does.\n\nFive of the six borrow their names from real things. Ahi, Wai, Lau, La and Ata are\nall lesser gods of the native faith, and [Mana](../law/mana.md) is the force that\nmoves the whole world rather than one of six things inside it.\n\nTwo of the names sound different across the islands. The sun is **La** in the\neast and the Fire Islands and **Ra** in Matua; shadow is **Ata** in Matua and the\nFire Islands and **Aka** in the east. The chart, like the articles, uses the\nspelling two of the three accents share.\n\nThe reason the two fit together as well as they do is that the world was built\noutward from the system. For every pair there is an order, a faith, a profession\nor a culture that suits it, which is where every character in\n[The Fifteen Jobs](the-fifteen-jobs.md) came from. No article should be written as\nthough an element were a fact about a person.\n"},{"id":"article/sailing","group":"article","title":"Sailing","file":"lore/article/sailing.md","state":"ok","md":"# Sailing\n\nThe player begins in the [Māla Iki Islands](../location/māla-iki-islands.md), and can sail in either a clockwise or counterclockwise direction. Counterclockwise takes longer than clockwise travel (penalty for backtracking), and every trip requires provisions and faces danger. As players advance through the story they will get various ship upgrades. Two upgrades that make ocean travel safer and faster, and a final airship upgrade that can avoid the maelstrom entirely, and provide access to floating islands.\n\n[The Great Maelstrom](../location/the-great-maelstrom.md) at the center of the map spins faster at the core where it is more dangerous but ships can pick up more speed. The further out from the core of the maelstrom you go, the less intense the current and weather get, and the benefits and penalties of sailing in ether direction are less exaggerated.\n\nNuitai is about 10,000 miles wide (further out there is no wind and giant predatory sea monsters that make seas too far out from the maelstrom impossible to explore) so any point in Nuitai is about 5000 miles from the core of the maelstrom.\n\nThe effects of the maelstrom are gradient however it is normally divided into six zones.\n\n### Zones of the Great Maelstrom\n\n- Outer Sea (“The Calm Ring”): 3,500 – 5,000 miles from the core. Gentle tides and predictable winds. Navigation easy. Only faint hints of the Maelstrom’s pull. Ideal for trade and island hopping. Clockwise travel is roughly 1.10x the speed, counterclockwise travel is .090x the speed. Effects are barely noticeable for short distances, but cumulative for long voyages.\n\n- The Driftbelt (“Mariner’s Drift”): 2,500 – 3,500 miles from the core. Constant, steady clockwise drift. Occasional rough weather but safe for most ships (not counting the freak unpredictable storms that are common in Nuitai, independent of the maelstrom). Clockwise travel is roughly 1.25x the speed, counterclockwise travel is 0.75x the speed.\n\n- The Surge Zone (“Sailor’s Run”): 1,500 – 2,500 miles from the core. Strong currents give daring captains incredible speed. The waves grow taller, and navigation requires experience. A favorite test for competitive sailors. Clockwise travel is roughly 1.5x the speed, counterclockwise travel is 0.5x the speed.\n\n- The Tempest Ring (“Storm’s Edge”): 1,000 – 1,500 miles from the core. Furious winds, towering waves, and constant lightning. Only legendary ships or those blessed by Moanatu survive long here. Speed doubles, but one wrong turn means disaster. Clockwise travel is roughly twice the speed, counterclockwise travel is ×0.25 the speed.\n\n- The Eye’s Reach (“The Abyssal Spiral”): 500 – 1,000 miles from the core. Gravity and magic twist the sea itself. Time and space distort. Ships caught here are either lost forever or reappear months later in strange places. The only sailors that venture here are those with a death wish.\n\n- The Core (“The Heart of Moanatu”): 0 – 500 miles from the center. No ship has ever returned. This is certain death.\n\n### Geographic Locations & Their Respective Zones\n\n- [Māla Iki Islands](../location/māla-iki-islands.md) - Zone 1: Calm, safe, navigable seas.\n\n- [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md) - Zone 1: Calm, safe, navigable seas.\n\n- [Velafi](../location/velafi.md) - Bordering Zones 1 & 2: Mostly calm seas with localized hazards.\n\n- [The Matua Archipelago](../location/the-matua-archipelago.md) - Zone 2: Dark, stormy seas.\n\n- [Bayang Seas](../location/bayang-seas.md) - Bordering Zones 1 & 2: Mostly calm seas with localized hazards.\n\n- [Kota Emas - Bandari City](../settlement/kota-emas.md) - Zone 1: Calm, safe, navigable seas.\n\n- [Kame Kingdom](../organization/kame-kingdom.md) - Zone 1: Calm, safe, navigable seas.\n\n- [Tokelau - The North Sea](../location/tokelau---the-north-sea.md) - Technically in Zones 1 and 2, but deadly no matter the zone: even if it’s far from the Maelstrom, the seas are icy, stormy, and full of giant monsters. Any travel along the north of the Maelstrom is a huge risk.\n"},{"id":"article/stone-speech","group":"article","title":"Stone Speech","file":"lore/article/stone-speech.md","state":"ok","md":"# Stone Speech\n\nThroughout the islands of Nuitai, both on the ocean and in the sky, are various ruins and temples left behind by the [Lanigata](../ethnicity/lanigata.md), the ancient sky people, who disappeared ten thousand years ago. The player will discover how to perform Po'lelo, or \"stone speech\", to carve glyphs into the stone and harness the spiritual power of [Mana](../law/mana.md) to imbue life and animation into stone. This can be used to create elevators and moving platforms, open doors, solve puzzles, and create or summon [Pohaku](../species/pohaku.md), stone golems.\n","pics":[{"file":"art/wiki/profession/stone-scribe-1.webp","caption":"Stone Scribe (Stone Speech)"}]},{"id":"article/the-fifteen-jobs","group":"article","title":"Fifteen Jobs","file":"lore/article/the-fifteen-jobs.md","state":"ok","md":"# Fifteen Jobs\n\nSix elements make fifteen pairs, and every pair is a job. This page is what each\none is like to play.\n\nThe rules are in [The Element Job System](element-job-system.md). Read that first\nif you have not. In short: your two elements decide what you can do, only **Ahi**\nand **Mana** can deal damage, and any two elements can be mixed into\ntechniques, by one character alone or by two working together.\n\nEach job below is written twice over. The top of the entry is the job itself,\nwhich is what a player at a table builds. The line marked **In the game** names\nthe character who holds that pair in the Nuitai JRPG, where the pairs come\nattached to people you recruit rather than chosen.\n\n---\n\n## All fifteen at a glance\n\n| Pair | Roles | Mixes into | Attacks alone? | In the game |\n|---|---|---|---|---|\n| 🟥🟩 **Ahi + Lau** | Fighter, Healer | Nature strike, fire heal | Yes, physical | [Leilagi the Huntress](../person/leilagi-the-huntress.md) |\n| 🟥🟦 **Ahi + Wai** | Fighter, Defender | Water strike, fire guard | Yes, physical | [Kailo the Wandering Chef](../person/kailo-the-wandering-chef.md) |\n| 🟥🟨 **Ahi + La** | Fighter, Enhancer | Light strike, fire boost | Yes, physical | [Damar Jago, the Zealot](../person/the-zealot.md) |\n| 🟥⬛ **Ahi + Ata** | Fighter, Saboteur | Shadow strike, fire curse | Yes, physical | [The Penyamun Agent](../person/the-penyamun-agent.md) |\n| 🟥🟪 **Ahi + Mana** | Fighter, Blaster | Spirit strike, fire blast | Yes, both | [Olola the Fire Dancer](../person/olola-the-fire-dancer.md) |\n| 🟩🟦 **Lau + Wai** | Healer, Defender | Water heal, nature guard | No | [Genemon the Spring Guardian](../person/genemon-the-spring-guardian.md) |\n| 🟩🟨 **Lau + La** | Healer, Enhancer | Light heal, nature boost | No | [Hina the Māla Priestess](../person/hina-the-māla-priestess.md) |\n| 🟩⬛ **Lau + Ata** | Healer, Saboteur | Shadow heal, nature curse | No | [Kiki the Witch Doctor](../person/kiki-the-witch-doctor.md) |\n| 🟩🟪 **Lau + Mana** | Healer, Blaster | Spirit heal, nature blast | Yes, magic | [Maika the Maki Sage](../person/maika-the-maki-sage.md) |\n| 🟦🟨 **Wai + La** | Defender, Enhancer | Light guard, water boost | No | [Sarjana the Archeologist](../person/sarjana-the-archeologist.md) |\n| 🟦⬛ **Wai + Ata** | Defender, Saboteur | Shadow guard, water curse | No | [Ren the Pirate Captain](../person/ren-the-pirate-captain.md) |\n| 🟦🟪 **Wai + Mana** | Defender, Blaster | Spirit guard, water blast | Yes, magic | [Paku the Navigator](../person/paku-the-navigator.md) |\n| 🟨⬛ **La + Ata** | Enhancer, Saboteur | Shadow boost, light curse | No | [Karvara Citra, the Apostate](../person/karvara-citra-the-apostate.md) |\n| 🟨🟪 **La + Mana** | Enhancer, Blaster | Spirit boost, light blast | Yes, magic | [The Luminary of Kota Emas](../person/the-luminary-of-kota-emas.md) |\n| ⬛🟪 **Ata + Mana** | Saboteur, Blaster | Spirit curse, shadow blast | Yes, magic | [Tawiri the Elderly Caller](../person/tawiri-the-elderly-caller.md) |\n\n**\"Attacks alone\" means can deal elemental damage without help.** The six jobs\nmarked No need a teammate to attack, and they tend to be the ones holding the party together while the teammate swings.\n\n**\"Mixes into\" is the two techniques a job makes from its own pair.** One element\nsays what the technique is and the other says what it does, so every pair gets\ntwo. A character can use them alone, but each costs two turns. The names are\nplaceholders.\n\n## If you are not sure what to pick\n\n| If you want to | Take |\n|---|---|\n| Hit things hard and not think about it | 🟥🟩 **Ahi + Lau** or 🟥🟦 **Ahi + Wai** |\n| Hit things hard and think about it a great deal | 🟥🟪 **Ahi + Mana** |\n| Keep everyone alive | 🟩🟦 **Lau + Wai** or 🟩🟨 **Lau + La** |\n| Be the reason the boss loses | 🟨⬛ **La + Ata** or ⬛🟪 **Ata + Mana** |\n| Cast spells | 🟩🟪 **Lau + Mana**, 🟦🟪 **Wai + Mana** or 🟨🟪 **La + Mana** |\n| Be impossible to kill | 🟦🟨 **Wai + La** |\n| Fight dirty | 🟦⬛ **Wai + Ata** or 🟥⬛ **Ahi + Ata** |\n| Make potions and problems | 🟩⬛ **Lau + Ata** |\n\n---\n\n# 🟥 Pairs with Ahi\n\nFive jobs. All of them can attack without help, all of them do it physically, and\nany of them can partner with a teammate to turn that teammate's element into a\nphysical strike.\n\n## 🟥🟩 Ahi + Lau · Fighter and Healer\n\n**The one that does not need anybody.**\n\nA fighter who heals is the most self-sufficient job in the game. It hits hard, it\npatches itself up, and it never has to hope someone else survives the turn.\n\n**How it plays.** Damage first, healing when you need it. Every turn spent\nhealing is a turn not spent hitting, so in a hard fight this job does not replace\na dedicated healer. It can also attack with Nature\nphysically, which is the slow kind of damage that keeps working after your turn\nends, so a long fight suits it.\n\n**In the game.** [Leilagi the Huntress](../person/leilagi-the-huntress.md), met in\nthe Fire Islands. Serious and practical, a survivalist, and noticeably more\nrestrained than the fire dancer you meet alongside her. She is also the only\ncharacter with Nature who still eats meat.\n\n**Themed after.** The hunters of [Velafi](../location/velafi.md).\n\n## 🟥🟦 Ahi + Wai · Fighter and Defender\n\n**The complete front line, on one person.**\n\nEvery element in the material triangle except the one that beats you. This job\nattacks, takes hits for other people, and stands in exactly the place a party\nneeds somebody to stand.\n\n**How it plays.** It does neither job as well as a\nspecialist. A pure fighter hits harder, a pure defender protects better, and this\nis both at a discount. What you get for the discount is that a party with one of\nthese in it never has a hole in it. Attacking with Water physically is this job's\nown trick, which also makes it the physical answer to Fire enemies.\n\n**In the game.** [Kailo the Wandering Chef](../person/kailo-the-wandering-chef.md),\na young cook from [Māla Iki](../location/māla-iki-islands.md) with red hair and one\nred eye and one blue. Warm and open, the sort of person strangers tell things to\nwhile he is cooking them a meal, and underneath it anxious and unsure of himself.\nHis father left to explore the ocean and never came back, and Kailo wants to\nfollow, except that he is raising his younger siblings and cannot go.\n\n**Themed after.** [Lelua](../technology/lelua.md), the fire dancers' acrobatic\nmartial art, and [Wai'Kenpō](../technology/waikenpō.md), the way of the water fist.\nOne is pure forward pressure and the other is pure defence.\n\n## 🟥🟨 Ahi + La · Fighter and Enhancer\n\n**Hits hard, and makes everyone else hit harder.**\n\nThe straightforward damage job with a multiplier bolted on. Alone it is a slightly\nworse fighter. In a party of three it is often the highest total damage on the\nfield, because the buffs land on two other people as well as yourself.\n\n**How it plays.** Spend the early turns of a long fight making everyone better,\nthen spend the rest hitting. The mistake is treating it as a fighter who\noccasionally buffs: the buffs are the job, and they want to go up before the fight\nturns. It can attack with Light physically, which makes it the physical answer to\nShadow enemies.\n\n**In the game.** [Damar Jago, the Zealot](../person/the-zealot.md), of\n[Bandari](../ethnicity/bandari.md) ancestry, from the Matahari Atoll but met well\nbefore you get there. Stubborn, and he starts out as an enemy over a\nmisunderstanding.\n\n*His article is a stub. Most of who he is has not been written.*\n\n**Themed after.** The Bandari Zealots of [Kota Emas](../settlement/kota-emas.md).\n\n## 🟥⬛ Ahi + Ata · Fighter and Saboteur\n\n**Breaks the enemy, then hits what is left.**\n\nThe other half of the fighter-plus-support idea, approached from the opposite side.\nWhere Fire and Light builds your party up, Fire and Shadow tears the other side\ndown, and against one big enemy they end up in nearly the same place.\n\n**How it plays.** Weaken first, hit second. It is at its best in long fights\nagainst single large enemies and at its worst against crowds of fragile ones,\nwhere everything dies before a debuff has paid for itself. It can attack with\nShadow physically, which makes it the physical answer to Spirit enemies.\n\n**In the game.** [The Penyamun Agent](../person/the-penyamun-agent.md), met either\nin [the Bayang Seas](../location/bayang-seas.md) or the Matahari Atoll. An operative\nof [the Penyamun](../organization/the-penyamun.md).\n\n*His article is a stub, and his ancestry is currently being revised.*\n\n**Themed after.** [The Penyamun](../organization/the-penyamun.md), the shadow guild.\n\n## 🟥🟪 Ahi + Mana · Fighter and Blaster\n\n**Both ways to hurt something, at once.**\n\nThis is the only job holding both damage elements, so it is the only one that can\nmake a physical attack and a magic attack by itself. Its spirit strike lands on\nthe enemy's physical defence and its fire blast on the magic one, and the player\npicks whichever defence is worse.\n\n**How it plays.** Look at the enemy's defences, then point it at things. Mixing\nits own two elements costs two turns, so the skill is knowing when the right\nattack is worth the wait. As a partner it offers both kinds of attack, so a\nsupport character beside it can choose a strike or a blast in their own element,\nwhich no other single teammate can offer.\n\nThe cost: no healing, no protection, no buffs, no debuffs. A party built around\nthis job depends on the other two slots.\n\n**In the game.** [Olola the Fire Dancer](../person/olola-the-fire-dancer.md), met\nin the Fire Islands, with one fiery red eye and one mystic purple. Intense to the\npoint of being hard to be around, utterly devout to [Mauga](../god/mauga.md),\nloud, dramatic, and in possession of no sense of humour or tact whatsoever. She\nfights with [Lelua](../technology/lelua.md).\n\n**Themed after.** The fire dancers of the Fire Islands, who refine their bodies\nuntil movement itself produces flame, and who can burn themselves alive doing it.\n\n---\n\n# 🟩 Pairs with Lau\n\nFour jobs. Three of them cannot attack on their own, and all four are the reason a\nparty is still breathing at the end of a long fight.\n\n## 🟩🟦 Lau + Wai · Healer and Defender\n\n**The job that decides who gets hurt and then undoes it.**\n\nProtection and healing are the two halves of the same problem, and this is the only\njob holding both. It stands in front of the people who cannot take a hit, then\nrepairs the damage it chose to take.\n\n**How it plays.** Pure support. It deals no elemental damage without a\nteammate. In practice this job\nmakes a party roughly twice as hard to kill, which buys the other two slots the\nfreedom to be reckless. With a Fire or Spirit\npartner its Water becomes the answer to Fire enemies, as a strike or as a blast.\n\n**In the game.** [Genemon the Spring Guardian](../person/genemon-the-spring-guardian.md),\na [Kame](../species/kame.md) and the first Kame most of the party has ever\nmet. An old man of a turtle even by Kame reckoning, master of\n[Wai'Kenpō](../technology/waikenpō.md) and of healing medicine. Laid back, dryly\nfunny, realistic without being sour. He and the old Caller get on, two long lives\ncomparing notes, though they do not always agree.\n\n**Themed after.** The [Wai'Ki](../organization/waiki.md) Wardens, guardians of the\nsacred springs and grottos, who are described in their own order's texts as masters\nof defence and the healing arts.\n\n## 🟩🟨 Lau + La · Healer and Enhancer\n\n**Keeps the party alive and makes it better while doing it.**\n\nThe purest support job in the game. It heals, it cures, it strengthens, and it has\nno way at all to hurt anybody without help. Everything it does affects two other people.\n\n**How it plays.** You will spend the whole fight looking at your allies rather than\nthe enemy. The skill is in order of operations, because the buff that goes up on\nturn one is worth far more than the same buff on turn five, and the heal that comes\none turn too late is worth nothing. Light also cleans, so this job is the answer to\ncurses and corruption that ordinary healing does not touch.\n\nIt needs a partner with Fire or Spirit to contribute any damage, and the\npartnership costs each of them a turn.\n\n**In the game.** [Hina the Māla Priestess](../person/hina-the-māla-priestess.md),\nyoung, devout, proud and ambitious, a perfectionist who performs serenity and is in\nfact very easily provoked. She must make a pilgrimage to\n[Kota Emas](../settlement/kota-emas.md) and pray at the golden temple to become the\nhigh priestess of her village. Wavy black hair and golden brown eyes, from mixed\nBandari and Nuitagata ancestry.\n\n**Themed after.** [The Nature Priests of Māla Iki](../organization/the-nature-priests-of-māla-iki.md),\nwhose temple is the forest, and whose faith is the native one and the foreign one\nheld together at once. Her two elements are the same two things.\n\n## 🟩⬛ Lau + Ata · Healer and Saboteur\n\n**Cures your side, poisons theirs.**\n\nA healer who also happens to be the reason the enemy is staggering. The two halves\nuse the same knowledge from opposite ends.\n\n**How it plays.** More demanding than it looks, because healing wants to be\nreactive and sabotage wants to be proactive, and you only get one turn at a time.\nAgainst one long fight it is excellent. Against a swarm it is a healer with a\nhobby. Shadow attacks need a Fire or Spirit partner.\n\n**In the game.** [Kiki the Witch Doctor](../person/kiki-the-witch-doctor.md), met in\n[the Matua Archipelago](../location/the-matua-archipelago.md). Young, spiky,\ncheerfully morbid and frequently inappropriate. She knows more about what\ningredients do to a body than anyone her age should, has the stained fingers and\nthe lingering smell to prove it, and has caused a genuinely alarming number of\nexplosions. Of Vanara Bandari ancestry in a place where nobody else has a tail,\nwhich has made her an outsider her whole life.\n\n**Themed after.** [The Witch Doctors](../organization/the-witch-doctors.md) of\nMatua.\n\n## 🟩🟪 Lau + Mana · Healer and Blaster\n\n**The healer who does not need anyone's permission.**\n\nOf the four jobs with Nature, this is the one that can act on the enemy by itself.\nSpirit turns its healing element outward as magic, which means it heals on the\nturns that need healing and throws real damage on the turns that do not.\n\n**How it plays.** The most flexible support job, and the one that asks the least of\nthe rest of the party. It is a worse healer than Nature and Water and a worse\ncaster than Spirit and Light, and it never has a turn where it can do nothing. It\ncan also partner with anyone, which lets the party's support characters cast in\ntheir own element.\n\n**In the game.** [Maika the Maki Sage](../person/maika-the-maki-sage.md), met early\nin [Māla Iki](../location/māla-iki-islands.md) but not recruited until much later.\nWhite hair, one earthy green eye and one deep purple, outwardly calm and wise\nbeyond his years, and underneath that acerbic, opinionated and a bit arrogant. He\nwill tell you he is above worldly pleasures and then flirt and drink his way\nthrough the evening, brushing it off with a line clever enough to sound like\nphilosophy. He does apologise, usually to himself, for unsagely behaviour.\n\n**Themed after.** [The Maki Sages](../organization/maki-sages.md), hermits who broke\nfrom the nature priests over letting a foreign teacher be called the sun, and who\nlearned to fight because the deep forest does not care what you believe. Their\nforms start soft and develop into force.\n\n---\n\n# 🟦 Pairs with Wai\n\nThree jobs. All of them protect, which is a thing only Water can do, and two of\nthem cannot attack without help.\n\n## 🟦🟨 Wai + La · Defender and Enhancer\n\n**The hardest job in the game to kill.**\n\nProtection and reinforcement at once. It stands in front of people and makes them\ntougher while it does it, which stacks in a way nothing else does.\n\n**How it plays.** The fortress build. It deals nothing by itself. A fight it is in lasts long\nenough for everyone else\nto do their jobs. Light also cleanses, so it answers curses as well as damage.\n\n**In the game.** [Sarjana the Archeologist](../person/sarjana-the-archeologist.md),\nbespectacled, curious, of Bandari ancestry and accent, found in the ruins of\n[the Lanuloa Archipelago](../location/the-lanuloa-archipelago.md), specifically\nfound running for his life. He scans enemies to reveal their weaknesses, which in\na game built on weaknesses makes him worth his place on reconnaissance alone.\nAnalytical, more sceptical than superstitious, obsessed with the ruins of the\n[Sky People](../ethnicity/lanigata.md) to the point where his curiosity wakes a\nstone golem up and the party has to deal with it.\n\n**Themed after.** [The Archaeological Society of Kota Emas](../organization/archaeological-society-of-kota-emas.md).\n\n## 🟦⬛ Wai + Ata · Defender and Saboteur\n\n**Cannot be killed, and does not fight fair.**\n\nProtection and sabotage. It takes the hits and makes sure the thing hitting it\ngets steadily worse at the job. Against a single powerful enemy this is the most\ngrinding, inevitable job on the list.\n\n**How it plays.** Note what it cannot do: no elemental damage without a teammate.\nNote what it can: the plain **Attack** command, which has no element and which this\njob is perfectly happy to swing all day while everything on the other side slowly\nfalls apart. It is a weapon fighter whose element work all points at the enemy's\nability to function.\n\n**In the game.** [Ren the Pirate Captain](../person/ren-the-pirate-captain.md),\nKirasame Ren, known as the Killer Shark, captain of the Blood Lotus and feared\nthroughout [the Bayang Seas](../location/bayang-seas.md). A master of\n[Sila](../technology/sila.md), Bandari swordplay, with a defence nobody has broken\nand a kill at close range nobody survives. Great swordsmen have fallen to her\nblade, not always fairly: a concealed pistol here, a poisoned dagger there. She is\nnot interested in sportsmanship. Her crew takes anyone who respects\n[the code](../ritual/undang-laut.md), the captain and the crew, which has made the\nBlood Lotus a small copy of Nuitai itself.\n\n**Themed after.** The Lanun pirates of the Bayang Seas.\n\n## 🟦🟪 Wai + Mana · Defender and Blaster\n\n**The tank who is also the artillery.**\n\nWater protects and Spirit destroys, and this job does not have to choose. It is the\nonly Water job that can attack on its own, and it attacks as magic, which also\nmakes it the one that can throw Water itself at a Fire enemy without anyone's help.\n\n**How it plays.** Durable and dangerous, with the usual catch that a turn spent\nprotecting is a turn not spent casting. Partnered with it, the support characters\nbeside it can cast in their own element. If you are building a party around one\nanchor, this is the anchor.\n\n**In the game.** [Paku the Navigator](../person/paku-the-navigator.md), an\nexperienced sailor and master cook with greying red hair and a lifetime on the\nwater. He has sailed the arctic north of\n[Tokelau](../location/tokelau---the-north-sea.md), surfed near the eye of\n[the Great Maelstrom](../location/the-great-maelstrom.md) and lived to describe\nboth. Bold, loud, enormous appetite for food and drink, laughs at things that\nshould not be laughed at. It reads as reckless until you know him. He left a wife\nand a young son years ago to go and see the world.\n\nHe learned [Wai'Kenpō](../technology/waikenpō.md) in the Kame Kingdom and water\nmagic somewhere along the way.\n\n**Themed after.** The navigators of the Great Maelstrom.\n\n---\n\n# The remaining three\n\nThe three pairs made entirely from the spiritual triangle.\n\n## 🟨⬛ La + Ata · Enhancer and Saboteur\n\n**Both sides of the same lever.**\n\nMake your party stronger, make the enemy weaker. No healing, no protection, no\ndamage of its own. This job does nothing except change the numbers, and it changes\nall of them.\n\n**How it plays.** The most purely strategic job in the game and the least forgiving\nof a short fight. Every turn it spends is an investment that only pays off over the\nturns that follow, so in a fight that ends in three rounds it contributed nothing,\nand in a fight that lasts twenty it was the reason you won. It needs a Fire or\nSpirit partner to deal any damage at all.\n\nIt is also the only job holding both ends of the spiritual triangle's quarrel,\nLight and Shadow at once.\n\n**In the game.** [Karvara Citra, the Apostate](../person/karvara-citra-the-apostate.md), an excommunicated\n[Cindaku](../article/cindaku.md) hiding in the frozen north.\n\n*His article is a stub. That one sentence is everything currently written about\nhim.*\n\n**Themed after.** Heretics of\n[the Teachings of Shaka](../organization/the-teachings-of-shaka.md).\n\n## 🟨🟪 La + Mana · Enhancer and Blaster\n\n**The caster who was already winning before the fight started.**\n\nSpirit for damage, Light to make everyone better at what they do. It attacks on its\nown, as magic, and it is the magical answer to Shadow enemies.\n\n**How it plays.** A strong, uncomplicated caster with a support half that rewards\nthinking ahead. Buff early, then spend the rest of the fight casting. Partnered\nwith it, anyone else can cast in their own element.\n\n**In the game.** [The Luminary of Kota Emas](../person/the-luminary-of-kota-emas.md),\nthe spiritual leader of [Kota Emas](../settlement/kota-emas.md). Nobody has seen him\nin public.\n\n*His article is a stub, and there is more to him than this.*\n\n**Themed after.** [The Teachings of Shaka](../organization/the-teachings-of-shaka.md).\n\n## ⬛🟪 Ata + Mana · Saboteur and Blaster\n\n**Takes the enemy apart and then finishes them.**\n\nShadow weakens, Spirit destroys, and the two work on the same schedule. Debuff\nwhile the fight is young and cast for the rest of it.\n\n**How it plays.** The offensive support job, and the one most likely to decide a\nboss fight. It attacks on its own as magic and it is the magical answer to Spirit\nenemies, the element that beats Spirit,\nthrown by Spirit.\n\nNo healing and no protection. This job assumes someone else is handling that.\n\n**In the game.** [Tawiri the Elderly Caller](../person/tawiri-the-elderly-caller.md),\nthird to join the party. An old woman from the gloomy\n[Matua Archipelago](../location/the-matua-archipelago.md) who speaks with the dead,\ncynical and morbidly funny in a way the young priestess finds trying. Hunched,\nwrinkled, one dark grey eye and one violet, carrying a magic staff that doubles as\na walking stick and is hung with ceremonial feathers and skulls.\n\n**Themed after.** [The Callers](../organization/the-callers.md) of Matua, who do not\ncommand the dead but ask them, and whose spirits come willingly, and for whom the\ndanger is that something else answers.\n\n---\n\n## Building a party of three\n\nIn the JRPG you field three at a time. At the table you get whoever turned up.\nEither way the same three questions decide whether a party works.\n\n**Does anyone have Ahi or Mana?** If not, nobody can exploit a single weakness all\ngame. Twenty of the 455 possible parties of three have this problem. It is the one\ngenuinely broken thing you can build by accident.\n\n**Can anyone heal?** Items run out.\n\n**What can you not reach?** No party of three covers everything, and it does not\nhave to, because any element in the game is one **Swap** away. Fifteen of the 455\nparties cover all six weaknesses without swapping at all.\n\nThe opening party of the JRPG, Kailo, Hina and Tawiri, happens to be one of those\nfifteen.\n\n---\n\n## A note on the world\n\nNobody in Nuitai has an element. These fifteen are jobs, the way a stat sheet is a\njob, and no character in the story is ever described in these terms. The orders,\nfaiths and professions under **Themed after** are real parts of the world. The pair\nattached to each one is not. See [The Element Job System](element-job-system.md).\n"}]}</script>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("wiki-data").textContent);
const GROUP = {};
DATA.groups.forEach(g => { GROUP[g.key] = g; g.pages = []; });
const PAGE = {};
DATA.pages.forEach(p => {
  PAGE[p.id] = p;
  GROUP[p.group].pages.push(p);
  p.links = [];   // pages this one links to
  p.back = [];    // pages that link to this one
});
DATA.groups.forEach(g => g.pages.sort((a, b) => a.title.localeCompare(b.title)));

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hueAttr = g => `class="hue${g.plain ? " plain" : ""}" style="--h:${g.hue}"`;
const withHue = (g, extra) => `class="hue ${extra}${g.plain ? " plain" : ""}" style="--h:${g.hue}"`;
const href = id => "#/" + encodeURI(id);
const TAGS = { stub: "Stub", empty: "Empty" };
const needsArt = p => !DATA.public && GROUP[p.group] && GROUP[p.group].kind === "canon" && !p.img && !(p.pics && p.pics.some(x => !x.stale));
const tagFor = p => (TAGS[p.state] ? ` <span class="tag">${TAGS[p.state]}</span>` : "") + (needsArt(p) ? ` <span class="tag art">${p.pics && p.pics.length ? "Old art" : "No art"}</span>` : "");
// The small pixel face, for characters that have one.
const faceFor = p => (p.face ? `<img class="face" src="${esc(encodeURI(p.face))}" alt="">` : "");

/* ---- Links between pages -------------------------------------------- */

// Turn a link written inside one article into the id of another page.
// Returns null when the link points outside the wiki.
function resolve(fromId, target) {
  let path = target.split("#")[0];
  if (!path || /^[a-z][a-z0-9+.-]*:/i.test(path)) return null;
  try { path = decodeURIComponent(path); } catch (e) { /* keep as written */ }
  path = path.normalize("NFC");
  const parts = fromId.split("/").slice(0, -1);
  for (const piece of path.split("/")) {
    if (piece === "" || piece === ".") continue;
    if (piece === "..") { if (!parts.length) return null; parts.pop(); }
    else parts.push(piece);
  }
  const id = parts.join("/").replace(/\.md$/i, "");
  return PAGE[id] ? id : null;
}

DATA.pages.forEach(p => {
  const seen = new Set();
  for (const m of p.md.matchAll(/\]\(([^)\s]+)\)/g)) {
    const id = resolve(p.id, m[1]);
    if (id && id !== p.id && !seen.has(id)) { seen.add(id); p.links.push(id); PAGE[id].back.push(p.id); }
  }
});

/* ---- Cleaning up the World Anvil export ----------------------------- */

// World Anvil exported bold and italic with the spaces on the wrong side
// ("**Manusia **and") and with doubled-up marks ("****"). Standard markdown
// refuses to read those. This repairs one line. The article file itself is
// never changed.
function fixStars(line) {
  if (!line.includes("*")) return line;
  // A row of stars used as a footnote mark.
  line = line.replace(/^\*{4,}(.+?)\*\s*$/, "\\* *$1*");
  line = line.replace(/([A-Za-z])\*{4,}(?=[\s,.;]|$)/g, "$1\\*");
  // Long runs are bold marks stuck together: four stars is "end bold, start bold".
  line = line.replace(/\*{3,}/g, run => "\u0001".repeat(Math.floor(run.length / 2)));
  line = line.replace(/\*\*/g, "\u0001");
  line = repair(line, "\u0001", "\u0003");
  line = line.replace(/\\\*/g, "\u0002");
  line = repair(line, "*", "*");
  return line.replace(/\u0002/g, "\\*").replace(/[\u0001\u0003]/g, "**");
}
// Pair up marks in order and move any inside spaces to the outside.
function repair(line, mark, out) {
  const parts = line.split(mark);
  if (parts.length < 3 || parts.length % 2 === 0) return line;   // none, or an odd one out
  let s = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { s += parts[i]; continue; }
    const inner = parts[i].trim();
    if (!inner) { if (s && !/\s$/.test(s)) s += " "; continue; }
    if (/^\s/.test(parts[i]) && s && !/\s$/.test(s)) s += " ";
    else if (s.endsWith(out)) s += " ";            // two marked words stuck together
    s += out + inner + out;
    if (/\s$/.test(parts[i]) && !/^\s/.test(parts[i + 1] || "")) s += " ";
  }
  return s;
}
function cleanMd(p) {
  let md = p.md;
  // The title is shown in the page header, so drop the first "# " line.
  md = md.replace(/^\s*# .*\n?/, "");
  const g = GROUP[p.group];
  if (g.kind === "canon") md = md.split("\n").map(fixStars).join("\n");
  return md;
}

/* ---- Search text ----------------------------------------------------- */

function plain(md) {
  return md.replace(/^#+\s*/gm, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
           .replace(/[*_`>|\\]/g, "").replace(/\s+/g, " ").trim();
}
DATA.pages.forEach(p => {
  p.text = plain(p.md.replace(/^\s*# .*\n?/, ""));
  p.low = p.text.toLowerCase();
  p.lowTitle = p.title.toLowerCase();
});
const blurb = (p, n = 150) => (p.text.length > n ? p.text.slice(0, n).replace(/\s+\S*$/, "") + "…" : p.text);

/* ---- Sidebar ---------------------------------------------------------- */

function drawSide(currentId) {
  const current = PAGE[currentId];
  const section = kind => DATA.groups.filter(g => g.kind === kind && g.pages.length).map(g => {
    const open = current && current.group === g.key;
    const items = g.pages.map(p =>
      `<li><a ${withHue(g, p.id === currentId ? "here" : "")} href="${href(p.id)}">${faceFor(p)}${esc(p.title)}${tagFor(p)}</a></li>`).join("");
    return `<details ${hueAttr(g)} ${open ? "open" : ""}><summary>${esc(g.label)}<span class="n">${g.pages.length}</span></summary><ul>${items}</ul></details>`;
  }).join("");
  const part = (title, html) => (html ? `<h2>${title}</h2>${html}` : "");
  $("side").innerHTML =
    (DATA.public ? `<a class="site" href="index.html">&larr; The Nuitai site</a>` : "") +
    part("The world", section("canon")) +
    part("Not canon yet", section("draft")) +
    part("Behind the articles", section("desk"));
  const here = $("side").querySelector("a.here");
  if (here) here.scrollIntoView({ block: "nearest" });
}

/* ---- Pages ------------------------------------------------------------ */

function rowsFor(pages, showGroup) {
  return `<ul class="rows">` + pages.map(p => {
    const g = GROUP[p.group];
    return `<li><a ${hueAttr(g)} href="${href(p.id)}">${faceFor(p)}<b>${esc(p.title)}</b>${tagFor(p)}` +
      (showGroup ? `<span class="where">${esc(g.label)}</span>` : "") +
      (p.text ? `<p>${esc(blurb(p))}</p>` : "") + `</a></li>`;
  }).join("") + `</ul>`;
}

function drawHome() {
  const canon = DATA.pages.filter(p => GROUP[p.group].kind === "canon");
  const thin = canon.filter(p => p.state !== "ok");
  const cards = kind => DATA.groups.filter(g => g.kind === kind && g.pages.length).map(g => {
    const t = g.pages.filter(p => p.state !== "ok").length;
    return `<a ${withHue(g, "card")} href="#/group/${g.key}"><b>${esc(g.label)}</b>` +
      `<span>${g.pages.length} ${g.pages.length === 1 ? "page" : "pages"}${t ? `, ${t} to write` : ""}</span></a>`;
  }).join("");
  const behind = cards("draft") + cards("desk");
  $("main").innerHTML = `<div class="page wide">
    <div class="hero"><h1>Nuitai</h1>
    <p>An ocean planet of scattered islands around a great maelstrom. ${canon.length} articles, ${thin.length} of them still to write.</p>
    <a class="btn" href="#/random">Open a random article</a></div>
    <h2 class="sec">The world</h2><div class="grid">${cards("canon")}</div>
    ${behind ? `<h2 class="sec">Behind the articles</h2><div class="grid">${behind}</div>` : ""}
    <h2 class="sec">Still to write</h2>${rowsFor(thin, true)}
    <footer>${DATA.public
      ? `Illustrations are AI placeholder concept art, to be replaced. Every fact here is the author's; Claude assembles the articles from them. <a href="credits.html">Credits and legal</a>. Built ${esc(DATA.built)}.`
      : `Built ${esc(DATA.built)} from the files in <code>lore/</code>. To refresh it, run <code>python tools/wikigen/build.py</code>.`}</footer>
  </div>`;
}

function drawGroup(key) {
  const g = GROUP[key];
  if (!g) return drawMissing(key);
  const notes = { draft: "These are proposals. Nothing here is canon until it is ruled.",
                  desk: "The data and working files behind the articles. When one of these disagrees with an article, this side wins." };
  $("main").innerHTML = `<div class="page">
    <div ${withHue(g, "head")}><span class="chip">${g.pages.length} ${g.pages.length === 1 ? "page" : "pages"}</span>
    <h1>${esc(g.label)}</h1></div>
    ${notes[g.kind] ? `<p class="note">${notes[g.kind]}</p>` : ""}
    ${rowsFor(g.pages, false)}</div>`;
}

function slug(text, used) {
  let s = text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
              .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "part";
  let out = s, n = 2;
  while (used.has(out)) out = s + "-" + n++;
  used.add(out);
  return out;
}

function drawArticle(id, anchor) {
  const p = PAGE[id];
  if (!p) return drawMissing(id);
  const g = GROUP[p.group];
  const holder = document.createElement("div");
  holder.innerHTML = marked.parse(cleanMd(p), { gfm: true });

  // Links: colour the ones that stay in the wiki, mark the ones that leave it.
  holder.querySelectorAll("a[href]").forEach(a => {
    const raw = a.getAttribute("href");
    if (/^https?:/i.test(raw)) { a.className = "ext"; a.target = "_blank"; a.rel = "noopener"; return; }
    if (raw.startsWith("#")) { a.setAttribute("href", href(id) + "@" + raw.slice(1)); return; }
    const to = resolve(id, raw);
    if (to) {
      const tg = GROUP[PAGE[to].group];
      a.className = "wl hue" + (tg.plain ? " plain" : "");
      a.style.setProperty("--h", tg.hue);
      a.setAttribute("href", href(to));
      a.title = tg.label;
    } else {
      const span = document.createElement("span");
      span.className = "off"; span.title = "Not in the wiki: " + raw;
      span.innerHTML = a.innerHTML; a.replaceWith(span);
    }
  });
  holder.querySelectorAll("table").forEach(t => {
    const box = document.createElement("div"); box.className = "tbl";
    t.replaceWith(box); box.appendChild(t);
  });
  // Headings get names so the list at the top can jump to them.
  const used = new Set(), heads = [];
  holder.querySelectorAll("h2, h3").forEach(h => {
    h.id = slug(h.textContent, used);
    heads.push({ id: h.id, text: h.textContent, sub: h.tagName === "H3" });
  });
  const toc = heads.length >= 4
    ? `<details class="toc" ${heads.length <= 14 ? "open" : ""}><summary>On this page (${heads.length})</summary><ul>` +
      heads.map(h => `<li class="${h.sub ? "sub" : ""}"><a href="${href(id)}@${h.id}">${esc(h.text)}</a></li>`).join("") + `</ul></details>`
    : "";

  let note = "";
  if (p.state === "empty") note = `<p class="note">This article has a title and nothing else yet.</p>`;
  else if (p.state === "stub") note = `<p class="note">This article is a stub. There is more to write.</p>`;
  else if (g.kind === "draft") note = `<p class="note">A draft. Not canon until it is ruled.</p>`;
  if (needsArt(p)) note += (p.pics && p.pics.length) ? `<p class="note art">These pictures are out of date. This article needs new art.</p>` : `<p class="note art">No picture yet. This article needs art.</p>`;

  const back = p.back.map(b => PAGE[b]).sort((a, b) => a.title.localeCompare(b.title));
  const backHtml = back.length
    ? `<div class="back"><h2>Mentioned in ${back.length} ${back.length === 1 ? "page" : "pages"}</h2><div class="pills">` +
      back.map(b => `<a ${withHue(GROUP[b.group], "pill")} href="${href(b.id)}">${esc(b.title)}</a>`).join("") + `</div></div>`
    : "";

  const rest = (p.pics || []).slice(1);
  const moreHtml = rest.length
    ? `<div class="back"><h2>${rest.length === 1 ? "One more picture" : rest.length + " more pictures"}</h2><div class="more">` +
      rest.map(x => `<figure><img loading="lazy" src="${esc(encodeURI(x.file))}" alt="${esc(x.caption)}"><figcaption>${esc(x.caption)}</figcaption></figure>`).join("") +
      `</div></div>`
    : "";
  $("main").innerHTML = `<article class="page${g.kind === "desk" ? " wide" : ""}">
    <div ${withHue(g, "head")}><a class="chip" href="#/group/${g.key}">${esc(g.label)}</a>
    <h1>${esc(p.title)}</h1>${DATA.public ? "" : `<div class="file">${esc(p.file)}</div>`}</div>
    ${note}${toc}<div class="body"></div>${moreHtml}${backHtml}</article>`;
  // Click a small picture to see it large, click again to shrink it.
  $("main").querySelectorAll(".more img").forEach(im =>
    im.addEventListener("click", () => im.parentElement.classList.toggle("big")));
  const body = $("main").querySelector(".body");
  const pics = p.pics || [];
  if (pics.length) {
    // The first picture is the main one and sits above the text.
    const fig = document.createElement("figure");
    fig.className = "banner";
    fig.innerHTML = `<img src="${esc(encodeURI(pics[0].file))}" alt="${esc(pics[0].caption)}"><figcaption>${esc(pics[0].caption)}</figcaption>`;
    $("main").querySelector(".head").after(fig);
  } else if (p.img) {
    const pic = document.createElement("img");
    pic.className = "portrait"; pic.src = encodeURI(p.img); pic.alt = "Portrait of " + p.title;
    body.append(pic);
  }
  body.append(...holder.childNodes);
  document.title = p.title + " · Nuitai Wiki";
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView(); return true; } }
}

function drawMissing(what) {
  $("main").innerHTML = `<div class="page"><div class="hero"><h1>Nothing here</h1>
    <p>There is no page called <code>${esc(what)}</code>. It may have been renamed.</p>
    <a class="btn" href="#/">Back to the front page</a></div></div>`;
}

function drawSearch(query) {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return route();
  const hits = [];
  for (const p of DATA.pages) {
    let score = 0, ok = true;
    for (const w of words) {
      const inTitle = p.lowTitle.includes(w), inBody = p.low.includes(w);
      if (!inTitle && !inBody) { ok = false; break; }
      score += (inTitle ? 50 : 0) + Math.min(p.low.split(w).length - 1, 20);
    }
    if (ok) hits.push({ p, score });
  }
  hits.sort((a, b) => b.score - a.score || a.p.title.localeCompare(b.p.title));
  const pattern = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  const lit = s => esc(s).replace(pattern, "<mark>$1</mark>");
  const rows = hits.slice(0, 60).map(({ p }) => {
    const g = GROUP[p.group];
    const at = Math.max(0, p.low.indexOf(words[0]) - 60);
    const bit = (at ? "…" : "") + p.text.slice(at, at + 180) + (p.text.length > at + 180 ? "…" : "");
    return `<li><a ${hueAttr(g)} href="${href(p.id)}"><b>${lit(p.title)}</b>${tagFor(p)}<span class="where">${esc(g.label)}</span><p>${lit(bit)}</p></a></li>`;
  }).join("");
  $("main").innerHTML = `<div class="page"><h2 class="sec">${hits.length} ${hits.length === 1 ? "page mentions" : "pages mention"} “${esc(query)}”</h2>
    ${hits.length ? `<ul class="rows">${rows}</ul>` : `<p>Nothing found. Try one word, or part of a word.</p>`}</div>`;
}

/* ---- Finding the right page for the address --------------------------- */

function route() {
  document.body.classList.remove("menu");
  let h = location.hash.replace(/^#\/?/, "");
  try { h = decodeURI(h); } catch (e) { /* keep */ }
  h = h.normalize("NFC");
  let [id, anchor] = h.split("@");
  document.title = "Nuitai Wiki";
  if (id === "random") {
    const canon = DATA.pages.filter(p => GROUP[p.group].kind === "canon" && p.state === "ok");
    location.replace(href(canon[Math.floor(Math.random() * canon.length)].id));
    return;
  }
  let jumped = false;
  if (!id) { drawHome(); drawSide(null); }
  else if (id.startsWith("group/")) { drawGroup(id.slice(6)); drawSide(null); }
  else { jumped = drawArticle(id, anchor); drawSide(id); }
  if (!jumped) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { $("q").value = ""; route(); });

let timer;
$("q").addEventListener("input", e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  timer = setTimeout(() => (v ? drawSearch(v) : route()), 120);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; $("q").blur(); route(); }
});
$("menu-btn").addEventListener("click", () => document.body.classList.toggle("menu"));
$("shade").addEventListener("click", () => document.body.classList.remove("menu"));

// Light or dark. Dark unless the button has been pressed (Frankie, 10/11).
(function () {
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem("nuitai-wiki-theme"); } catch (e) { /* no storage, fine */ }
  root.dataset.theme = (saved === "light" || saved === "dark") ? saved : "dark";
  const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  const label = () => { $("theme-btn").textContent = isDark() ? "Light" : "Dark"; };   // the button names where it takes you
  label();
  $("theme-btn").addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("nuitai-wiki-theme", root.dataset.theme); } catch (e) { /* fine */ }
    label();
  });
})();

route();
</script>

loophole around accumulating merit and rising within the caste system. It meant one could leave the cycle altogether rather than participate in it. Because of this, Shaka remained an enemy to those in power and was hunted by assassins until his death, which was anticlimactically caused by choking on a piece of breadfruit in his old age.\n","pics":[{"file":"art/wiki/god/shaka-2.webp","caption":"Shaka the Explorer"},{"file":"art/wiki/god/shaka-4.webp","caption":"Shaka the Luminary"},{"file":"art/wiki/god/shaka-3.webp","caption":"Shaka as a Furry-Tailed Folk Hero"},{"file":"art/wiki/god/shaka-1.webp","caption":"Shaka the Champion"},{"file":"art/wiki/god/shaka-5.webp","caption":"Shaka the Wanderer"}]},{"id":"god/tavaya","group":"god","title":"Tavaya","file":"lore/god/tavaya.md","state":"ok","md":"# Tavaya\n\nTava, known in the southern Matahari islands and the Bayang seas as Tavaya, is the Bandari Deva of engineering, invention, and the beauty found in purposeful creation. Where Laya embodies inspiration and artistic impulse, Tava represents the discipline that refines those impulses into tools, structures, and machines that can endure the world. He is revered as the patron of craftsmen, builders, and innovators, especially those whose work bridges function and elegance.\n\nTava is always depicted as male, broad-shouldered and burly, with arms thick from labor. His hair is wild and unkempt, and his brows are famously heavy, a trait celebrated among Bandari artisans as a sign of focus and determination. Yet his face is rarely shown directly. In most depictions he is hunched over a workbench or leaning over a half-finished hull, too absorbed in the task before him to acknowledge the viewer. This is not secrecy but devotion to the act of creation, a humility that contrasts sharply with the radiance of the older Devas. Unlike the ancient gods, Tava is never shown with the distinct furry tails of the Vanara. Their absence is often interpreted as a sign of his relative youth, a divine figure shaped by a world rapidly advancing in craft and technology.\n\nTava embodies two primary aspects. Kartava governs beauty in craft, the elegance that emerges when form and function are in harmony. Yantava represents function itself, the mechanics and structure that allow an invention to work. In the southern Bandari territories his longer names of Kartavaya and Yantavaya are more common.\n\nIn his iconography Tava bears four muscular hairy arms arranged from refinement to raw labor. The lower pair belongs to Yantava, gripping a carpenter’s mallet and chisel, symbols of force, shaping, and foundational craft. The upper pair reflects Kartava. One hand holds a broad varnish brush and the other a small bowl of lacquer, representing the finishing touches that give an object grace beyond its purpose. Together these tools present a full philosophy of making, from conception to final polish.\n\nAlthough Tava is honored across Bandari society, his devotion is strongest among Sarpic builders, engineers, shipwrights, and metalworkers. In coastal cities he is the constant companion of sailors and navigators who depend on sturdy hulls, balanced rigging, and clever design to survive the seas. Small offerings of tobacco, sweet fruits, or coiled rope are left at his shrines by those embarking on long voyages, even by some devotees of Shaka. Even some pirates keep a quiet respect for him. They claim that any vessel that surfs the maelstrom without Tava’s blessing eventually learns what happens when care is not taken in owns craft as a shipwright.\n\nTava’s relationship with Laya is one of complement rather than contrast. Their shared aspect Karya is where art and engineering intertwine. Where Laya inspires, Tava shapes. Among the workshops of Kota Emas it is not unusual to see shrines to Karya. Yet while Laya is ancient and bound to the arts, Tava feels distinctly modern, a god who rose in prominence alongside the growing ambitions of Bandari invention. He is not a Deva of abstraction but of effort, sweat, tools, and the satisfaction of finished work.\n","pics":[{"file":"art/wiki/god/tavaya-1.webp","caption":"Tava, God of Engineering"}]},{"id":"god/wai","group":"god","title":"Wai","file":"lore/god/wai.md","state":"ok","md":"# Wai\n\nWai is the [Akua](../law/akua.md) Iti of water. He exists in multiple temperaments or reflections, each tied to one of domains of the three great Akua Nui:\n\n- Wai [Lanu](../god/lanu.md) is fresh water and the gentle nourishing rain, the life giving liquid of the islands of Nuitai.\n\n- **Wai **[Moanatu](../god/moanatu.md) is salt water, the substance and spray of the ocean waves.\n\n- **Wai **[Mauga](../god/mauga.md) can be found in the hotsprings and geysers of [Velafi](../location/velafi.md).\n\nThere is some ambiguity and variation between the islands as to how to interpret Wai's domain regarding blood. While blood is the liquid life force of living organic things, traditionally Lanu's domain, blood also represents the red hot passion that Mauga is known for, and so blood is sometimes referred to as Wai Lanu or Wai Mauga, depending on the intended symbolism and meaning, blood as life or blood as passion.\n","pics":[{"file":"art/wiki/god/wai-1.webp","caption":"Wai, Spirit of Water"}]},{"id":"beast/kyoumikame","group":"beast","title":"Kyoumikame","file":"lore/beast/kyoumikame.md","state":"ok","md":"# Kyoumikame\n\nOne of the six sacred beasts of Nuitai, considered to be a living Kamekami. Kyoumikame is the most ancient and colossal of the [Dai-Kame](../species/dai-kame.md). The size of an island, with an ecosystem on it's back, it patrols the seas of the [Kame Kingdom](../organization/kame-kingdom.md) and is believed to be it's protector by the native [Kame](../species/kame.md). Kyoumikame embodies the spirit of **Wai **(water).\n","pics":[{"file":"art/wiki/beast/kyoumikame-1.webp","caption":"Kyoumikame, the Island Turtle"}]},{"id":"beast/moafi","group":"beast","title":"Mo'afi","file":"lore/beast/moafi.md","state":"ok","md":"# Mo'afi\n\nMo'afi is a giant red salamander that makes its home within the largest volcano on the biggest island of [Velafi](../location/velafi.md). It occasionally emerges to crawl slowly along the volcano’s slopes, and only rarely descends into the jungle. When it does, every step reshapes the environment, leaving fire-scorched terrain and molten rivers in its wake. Mo’afi is deliberate and slow-moving, yet an unstoppable force of nature.\n\nOne of the six great sacred beasts of Nuitai, embodying the spirit of **Ahi **(Fire).\n","pics":[{"file":"art/wiki/beast/moafi-1.webp","caption":"Mo'afi, the Volcano Salamander"}]},{"id":"beast/moanaroa","group":"beast","title":"Moanaroa","file":"lore/beast/moanaroa.md","state":"ok","md":"# Moanaroa\n\nA colossal abyssal eel that patrols the dark haunted waters of the Matua Archipelago. It hides in submerged caves and labyrinthine chasms, the tips of its ghostly bioluminescent scales flickering like ethereal lights as it winds silently through the depths.\n\nMoanaroa is one of the six great sacred beasts of Nuitai, the guardian and apex predator of the Matua Archipelago, and the natural embodiment of **Ata **(Shadow).\n","pics":[{"file":"art/wiki/beast/moanaroa-1.webp","caption":"Moanaroa, the Abyssal Eel"}]},{"id":"beast/pualele","group":"beast","title":"PuaLele","file":"lore/beast/pualele.md","state":"ok","md":"# PuaLele\n\nWhen sailing the islands of [Māla Iki](../location/māla-iki-islands.md), it is impossible to miss the most extraordinary and enigmatic of its inhabitants: the islands’ ancient guardian, a colossal lepidopteran. Its vast, powerful yet delicate wings, colorful and translucent, shimmer in the sunlight. Its compound eyes give it an otherworldly, intelligent gaze. Long, slender legs extending beneath its body, and graceful antennae atop its crown, appear fragile in contrast to their immense size. As it soars gracefully through the skies, it casts reflections of vibrant rainbow light upon the waters below.\n\nOccasionally, it pauses to perch atop the highest mountain, the gentle flapping of its wings sending a soothing breeze to the villagers who dwell beneath, while it emits a hauntingly beautiful cry. Its song is loud, echoing, and otherworldly, yet somehow sweet and tender, and can be heard for miles.\n\nPua'Lele is one of the six great sacred beasts of Nuitai, representing **Lau **(Nature)\n","pics":[{"file":"art/wiki/beast/pualele-1.webp","caption":"Pua'Lele, the Guardian Moth"},{"file":"art/wiki/beast/pualele-2.webp","caption":"The Six Sacred Beasts"}]},{"id":"beast/pōhaku-nui","group":"beast","title":"Pōhaku Nui","file":"lore/beast/pōhaku-nui.md","state":"ok","md":"# Pōhaku Nui\n\nThe largest known Pōhaku, the great stone guardian Pōhaku Nui, is a colossal being taller than any mountain, which wades through the waters surrounding the [The Great Maelstrom](../location/the-great-maelstrom.md). It takes an entire year for Pōhaku Nui to complete a circuit, moving with slow, deliberate care as though mindful not to disturb the sea, one misstep could unleash a tsunami. At times, it pauses mid-journey to gaze longingly at the floating continent above.\n\nPōhaku Nui is one of the six sacred beasts of Nuitai, representing **Spirit **([Mana](../law/mana.md)).\n","pics":[{"file":"art/wiki/beast/pohaku-nui-1.webp","caption":"Pōhaku Nui, the Great Stone Guardian"}]},{"id":"beast/ringanaga","group":"beast","title":"Ringanaga","file":"lore/beast/ringanaga.md","state":"ok","md":"# Ringanaga\n\nPerhaps the most striking feature of the Matahari Atoll, is the splendor that is Ringanaga, the gold and white guardian beast of light that can be found flying in the skies above the city of [Kota Emas](../settlement/kota-emas.md). A long sky serpent making patterns and trails as it winds through the sky. It never descends very low or lands, and often disappears in the clouds or among the floating islands. It has always been there and as far as the people of the Matahari Atoll know no one has ever made contact with it. Only with the modern [Bandari](../ethnicity/bandari.md) invention of the telescope has anyone been able to “see it up close” and make out its finer details. It is believed to be a light dragon and a protector of [Kota Emas](../settlement/kota-emas.md), perhaps sent by or an aspect of [Shaka](../god/shaka.md) himself, although it has existed in these skies long before the followers of Shaka arrived in this ocean.\n\nRinganaga is one of the six great sacred beasts of Nuitai, the guardian and patron deity of Kota Emas and the natural embodiment of **La **(Light).\n","pics":[{"file":"art/wiki/beast/ringanaga-1.webp","caption":"Ringanaga, the Light Serpent"}]},{"id":"location/bayang-seas","group":"location","title":"Bayang Seas","file":"lore/location/bayang-seas.md","state":"ok","md":"# Bayang Seas\n\nTo the southwest of the great maelstrom, west of [The Matua Archipelago](../location/the-matua-archipelago.md) and still under the grey and stormy skies of those islands of death, are the scattered islands and shipwrecks of the [Bayang Seas](../location/bayang-seas.md). This is where the criminal underworld of Nuitai calls its home. Mangroves and swamps can be found all over these islands.\n\nFancy silks, tea, the practice of bowing, and the reverent teachings of [Shaka](../god/shaka.md) aren’t the only things the [Bandari](../ethnicity/bandari.md) missionaries and merchants have brought with them to Nuitai. With gunpowder, steel and advanced warships naturally come pirates. Pirates that have terrorized the coasts of [Bandar](../organization/bandar.md) have come to find their fortune in the Nuitai islands. It is an open secret that they make their hideouts in the Bayang Seas. They are a diverse group, from every race and background, but all adhere to [Undang Laut](../ritual/undang-laut.md), the pirate code, on pain of death.\n\nMost Bayang Raiders learn and practice the art of [Sila](../technology/sila.md) , [Bandari](../ethnicity/bandari.md) swordplay, but the cheap trick of drawing a pistol while swords are locked are not beneath them. Here also it is rumored that guilds of bandits, assassins and thieves, the [Penyamun](../organization/the-penyamun.md) make these murky waters and marshes their home, if not the sewers of [Kota Emas](../settlement/kota-emas.md) itself.\n","pics":[{"file":"art/wiki/location/bayang-seas-1.webp","caption":"The Bayang Seas"}]},{"id":"location/matahari-archipelago","group":"location","title":"Matahari Archipelago","file":"lore/location/matahari-archipelago.md","state":"ok","md":"# Matahari Archipelago\n\nThe sun-washed Matahari Archipelago lies directly west of [The Great Maelstrom](../location/the-great-maelstrom.md), a chain of hundreds of islands scattered across warm waters. It is the sea of the setting sun, with islands dense with colorful tropical jungles heavy with rainfall and the sound of birds singing and other wildlife, with white beaches on the coasts, and [Bandari](../ethnicity/bandari.md) carved temples and Shakan reliefs into the cliffs.\n\nThe forests are layered with towering dipterocarp trees, strangler figs, and dense palms. On coasts and river mouths grow mangroves and nipa palms. Bamboo and rattan fill the understory. Spice plants such as clove, nutmeg, and cinnamon are native or long naturalized. Orchids, pitcher plants, and ferns thrive in the humidity, while pandan (used by the Bandari to make fluffy green sponge cake) and banana give shade near villages.\n\nA wide variety of unique flora and fauna can be found here. Colorful birds such as hornbills and parrots, reptiles ranging from skittering lizards and pythons to saltwater crocodiles. Large mammals are more common in the north; tigers and rhinos, found nowhere else in Nuitai. There are no elephants. They are among the animals lost with Bandar, known only from old art and stories. Wild monkeys can also be found here, not just in the jungles but congregating around the temples and the cities. In the south, marsupials are more common, as are birds-of-paradise and monitor lizards.\n\nEight centuries ago, settlers from the sacred and mythic land of Bandar crossed the western ocean and found safe harbor here. For reasons unknown, the route that once carried them east has since returned to a state where no winds blow and colossal sea monsters roam once again. Some believe Shaka's blessing once calmed those waters to guide his people eastward and, when their journey was complete, withdrew his protection. This mystery is a source of tales for the faithful. Whatever the cause, the path home has been closed ever since, and no contact with Bandar has been possible. Now the archipelago stands as a bridge between old and new, its people born of two worlds, but belonging fully to neither. There are no Bandari alive today in Nuitai that have set foot in or seen the lands of the resplendent Bandar, it exists in legends and chronicles now only.\n\nAt the heart of the Matahari Archipelago, on the Matahari Atoll, is the wondrous golden city of [Kota Emas](../settlement/kota-emas.md), the Bandari-founded capital and center of trade, faith, and study in Nuitai’s western seas. River-canals run through the city like veins, lined with narrow boats and market stalls. Here the Nuitai-born Bandari choose their own Luminary by a test, believed to be the reincarnation of one of Shaka's closest disciples and a saint, and his home is in the golden temple in the heart of Kota Emas. There are a few other cities but mostly the outer islands of the archipelago are quieter, home to fishing villages, terraced rice fields, and outdoor shrines to [Shaka](../god/shaka.md), the [Akua](../law/akua.md), as well as other foreign spiritual practices that came from the far west long ago.\n\nKota Emas is the home of the archeological society, and here also in the Matahari islands, ancient [Lanigata](../ethnicity/lanigata.md) temples overgrown with vines can be found deep in the jungles as well as sunken ruins beneath the clear waters. Floating islands are also scattered in the skies above these western seas. While these wonders are not as numerous as they are in the [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md), scholars and archeologists are still just as busy here.\n\nThere are mythic beasts here in the Matahari archipelago as well. Colorful sea monsters swim between islands, some larger than the largest Bandari ships. The sacred beast [Ringanaga](../beast/ringanaga.md) flies high in the skies, weaving between the clouds and floating islands, its focal point the golden temple of Kota Emas, its reminder that the stranded Bandari are blessed by Shaka's light. Naga villages can be found deep in the forests, home to snake people that make snacks of lost wanderers, and among the population of the Bandari themselves cursed were-tigers known as Cindaku transform on sunny moonless days and wreak havoc.\n\n> **Type:** Archipelago\n","pics":[{"file":"art/wiki/location/matahari-archipelago-1.webp","caption":"The Matahari Islands"}]},{"id":"location/māla-iki-islands","group":"location","title":"Māla Iki Islands","file":"lore/location/māla-iki-islands.md","state":"ok","md":"# Māla Iki Islands\n\nThere is a small chain of islands to the northeast of the Great Maelstrom, stretching roughly two hundred miles across the [Calm Ring](../article/sailing.md). This chain is sometimes called the Māla Islands, named after the largest island Māla Iki, or \"Little Garden\", which is still relatively small. The people here have long lived in peace, with the most dangerous creatures found only in the deepest forests and mountains of the largest island.\n\nThe islands are lush and gentle, bathed in gentle rain and soft sunlight. The forests are thick with banyan*****, palm and breadfruit trees, and the air always carries the mingled scent of sea salt and fresh flowers. The beaches are pale and fine, giving way to clear shallows filled with coral and colorful darting fish. Rivers wind lazily down from misty ridges, feeding farmland and gardens heavy with fruit. Villages are built near the beaches and in the forests near the rivers, the homes resting low on the cool dry earth beneath thatched palm roofs, the walls woven from bamboo, with entryways covered with fabrics dyed with colorful patterns of indigo, turquoise and ochre. The floors are laid with lauhala mats over packed earth, covered with soft fabrics. Courtyards bloom with ferns and flowers. Shells, feathers, and small carved charms hang from the eaves, swaying in the sea breeze. Wood carved effigies of the [Akua](../law/akua.md) are found throughout the island, at the edges of fields, beside the docks, and along the forest paths.\n\nThe people of Māla Iki live simple, contented lives. Most are fisherfolk, weavers, or farmers. They grow taro and sweet potato in soft fertile soil, gather fruit from the forests, and catch fish in nets or with spears of polished wood. When the air grows hot, they rest in the shade and mend their tools. Work is not rushed here; nothing is. What the island provides is enough, and so long as the rains come and the seas stay calm, Māla Iki remains a place of quiet abundance. This is paradise in Nuitai.\n\nTrade with other islands is rare, for ocean travel is dangerous and few venture beyond sight of their own shores. When the weather is kind, small sailboats and outrigger canoes from neighboring islands sometimes arrive over crystal clear waters to barter cloth or tools for dried fruit, herbs, and simple jewelry. Māla Iki is known for its fine woven fabrics dyed with bright natural pigments, and for its carvings of beautifully intricate patterns and figures shaped from dead coral and driftwood.\n\nThe giant guardian moth, [Pua'Lele](../beast/pualele.md), makes its home on the highest mountaintops of Māla Iki. The flapping of its wings casting a gentle breeze to the villages below, the sight of it soaring in the sky reflecting colorful light on the water a common but beautiful sight in these islands. The rare priceless silk it produces reserved for the robes of the high priests and temple tapestries. Children craft effigies and play with kites in Pua'lele's image, and once a year a festival is held where floating lanterns are released into the night sky honoring the guardian of the islands.\n\nIn Māla Iki there are two religious sects. They live peacefully (and separately) despite their disagreements. One is an old spiritual order known as the [Priests of Māla](../organization/the-nature-priests-of-māla-iki.md) whose temple is the forest itself. The garden priests are part of the regular life of the people of Māla Iki, providing services and doubling as healers, midwives and teachers. Their syncretic faith, known elsewhere simply as [Māla](../organization/māla.md), is the most popular religion in present day Nuitai among the eastern Nuitagata and the garden priests can also be found in the [Lanuloa Archipelago](../location/the-lanuloa-archipelago.md) and on the Matahari Atoll. Māla Iki is also home to the rival order of these priests, the [Maki Sages](../organization/maki-sages.md), who did not accept the integration of [Shaka](../god/shaka.md) into their native Anuic beliefs. The Sages live deep in the forest of Māla Iki and are rarely seen.\n\nThe small island of [Kulāiwi](../settlement/kulāiwi.md), beside Māla Iki itself, has a single village of the same name.\n\nMāla Iki is the home of the characters [Kailo](../person/kailo-the-wandering-chef.md), [Hina](../person/hina-the-māla-priestess.md), and [Maika](../person/maika-the-maki-sage.md).\n\n******The reader may be interested to know that while these banyan trees are now a common and iconic feature of Māla Iki, they are not actually native to the islands themselves. They were first introduced by Bandari missionaries over a century ago.*\n","pics":[{"file":"art/wiki/location/mala-iki-islands-1.webp","caption":"Māla Iki, the Little Garden"},{"file":"art/wiki/location/mala-iki-islands-2.webp","caption":"The Lantern Festival of Māla Iki"}]},{"id":"location/sky-islands","group":"location","title":"Sky Islands","file":"lore/location/sky-islands.md","state":"stub","md":"# Sky Islands\n\nSpread across the skies of Nuitai are numerous inaccessible floating islands of various altitudes, shapes and sizes. The largest concentration of these sky islands can be found over [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md).\n","pics":[{"file":"art/wiki/location/sky-islands-1.webp","caption":"Floating Islands and Ruins"}]},{"id":"location/the-floating-continent","group":"location","title":"Floating Continent","file":"lore/location/the-floating-continent.md","state":"ok","md":"# Floating Continent\n\nHanging high above the maelstrom, in the sky, is probably the most incredible site in all of Nuitai; a floating continent. No one knows where it came from and no one has ever been able to reach it. It has been theorized that the continent rose out of the ocean and caused the maelstrom. The floating continent can be seen from anywhere in Nuitai and is used as a convenient reference point for sailors and navigators.\n","pics":[{"file":"art/wiki/location/the-floating-continent-1.webp","caption":"The Floating Continent"}]},{"id":"location/the-great-maelstrom","group":"location","title":"Great Maelstrom","file":"lore/location/the-great-maelstrom.md","state":"ok","md":"# Great Maelstrom\n\nThe central landmark of Nuitai is a striking and awe-inspiring feature: a giant, seemingly never-ending whirlpool, the core of which stretching over thousands of miles across the ocean. This is the great maelstrom, often simply called the Maelstrom, and it dominates both the seas and the skies of this region. The core is the point of no return, nut its vast currents ripple outward for thousands of miles beyond the core, shaping tides, weather, and even the very climate of the island chains surrounding it. Gentle enough at its outer edges to allow navigation, the direction of the currents caused by the great maelstrom encourages clockwise travel around the seas of Nuitai. This effect is exaggerated the closer one gets to the center. The waters grow increasingly chaotic as one approaches the center, with spiraling eddies, rogue waves, and hurricane-force winds forming in the intermediate zones. Here, only the most skilled and daring sailors dare to venture, skimming along the outer edges like surfers riding a colossal wave to gain speed. Entering too far inward brings the point of no return, where even the most powerful ship is drawn inexorably toward the maelstrom’s heart. Sailors respect the maelstrom’s might, offering prayers to Moanatu before venturing into its outer currents.\n\nThe Maelstrom also carries the ocean’s life in its currents. Its outer edges are rich fishing grounds, teeming with fish and other sea life swept in by upwelling waters, although larger predators patrol these zones, drawn by the abundance. The strange turbulence affects weather far beyond its surface: storms gather above, winds twist unpredictably, and the flow of heat through the seas is disrupted, creating pockets of unusually warm or cold water. Scattered islands ring the maelstrom, their arrangement forming a loose, circular pattern that has long been theorized to result from some ancient calamity tied to the whirlpool’s creation.\n\nSee [Sailing](../article/sailing.md) in Game Mechanics for details on zones, distances and travel speed.\n","pics":[{"file":"art/wiki/location/the-great-maelstrom-1.webp","caption":"The Great Maelstrom"}]},{"id":"location/the-lanuloa-archipelago","group":"location","title":"Lanuloa Archipelago","file":"lore/location/the-lanuloa-archipelago.md","state":"ok","md":"# Lanuloa Archipelago\n\nTo the east of the great maelstrom lies the Lanuloa Archipelago, a vast chain of islands stretching over a thousand miles from the southern [Māla Iki](../location/māla-iki-islands.md) isles to the northern waters of the Fire Islands. The Lanuloa region is the most populous and culturally central of the [Nuitagata](../ethnicity/nuitagata.md) territories, the beating heart of their oceanic civilization.\n\nThe forests and reefs of these islands are dense with strange and colorful wildlife, from birds of paradise and coral fish to creatures rarely seen elsewhere. Though its ecology resembles Māla Iki’s lush tropics, Lanuloa is rougher-edged. Storms strike harder, seas run deeper, and there are greater dangers. Stone golems, [Pohaku](../species/pohaku.md), still roam the perimeters of ancient ruins in greater number and size here than anywhere else in Nuitai, and giant sea serpents are known to rise from the depths without warning, so travel in between islands is perilous. Yet the people endure, navigating these hazards with the same grace and adaptability that define Nuitagata seamanship.\n\nLanuloa is famed not just for its people but for what lies beneath and above it: the greatest concentration of ruins left by the vanished Sky People. Floating islands drift high overhead, and half-buried temples hum faintly with dormant glyphs. These relics attract [Bandari](../ethnicity/bandari.md) scholars and explorers, whose presence has grown since the founding of the Nuitai chapter of the [Archaeological Society](../organization/archaeological-society-of-kota-emas.md) in distant [Kota Emas](../settlement/kota-emas.md). It is the goal of the scholars of this organization to unravel the mystery behind this ancient magical technology. The arrival of these outsiders, and the curiosity and bravery they awakened among local Nuitagata, has turned Lanuloa into a crossroads of faith, science, and myth.\n\nFor all the attention the ruins draw, Lanuloa is still a place of the living. Its people are farmers, sailors, artisans, and priests much like those of Māla Iki, guided by the same devotion to both [Shaka](../god/shaka.md) and [Lanu](../god/lanu.md), and the same respect for the living forests and ocean. The difference is one of temperament: where Māla Iki is serene and introspective, Lanuloa is pragmatic and resilient. Its culture is built on coexistence with uncertainty, the understanding that the sea, the storm, and the ancient past are neighbors, not adversaries.\n","pics":[{"file":"art/wiki/location/the-lanuloa-archipelago-1.webp","caption":"The Lanuloa Archipelago"},{"file":"art/wiki/location/the-lanuloa-archipelago-2.webp","caption":"A Lanuloan Islander"},{"file":"art/wiki/location/the-lanuloa-archipelago-3.webp","caption":"A Lanuloan Islander (ChatGPT)"}]},{"id":"location/the-light-realm","group":"location","title":"Light Realm","file":"lore/location/the-light-realm.md","state":"stub","md":"# Light Realm\n\n[Shaka](../god/shaka.md)'s realm of light. Followers of the Teachings of Shaka believe that through moral purity and devotion to Shaka, they may be reborn to join him in his realm.\n","pics":[{"file":"art/wiki/location/the-light-realm-1.webp","caption":"The Light Realm"}]},{"id":"location/the-matua-archipelago","group":"location","title":"Matua Archipelago","file":"lore/location/the-matua-archipelago.md","state":"ok","md":"# Matua Archipelago\n\nTo the south of [maelstrom](../location/the-great-maelstrom.md) where the seas are stormy and the sky is always cloudy and grey lies the Matua Archipelago, stretching roughly fifteen hundred miles from east to west along the [Driftbelt](../article/sailing.md). These islands are shrouded in perpetual mist and gloom, a land where the sea itself seems haunted. The coasts are lined with black sands and eerie songs of lost souls fill the opaque air. Amphibious horrors lurk in the shallow waters near the shores, and spirits float among the countless graveyards scattered across the islands.\n\nDespite its grim beauty, the Matua Archipelago is a place of profound spirituality and mystery. Its people have long coexisted with death, accepting it as an inevitable part of life. Among the natives of the Matua Archipelago live the [Callers](../organization/the-callers.md), spirit-speaking shamans who bridge the living and the dead, and the Ki’Ata [Witch Doctors](../organization/the-witch-doctors.md), the greatest potion masters in all of Nuitai. Both groups wield [Mana](../law/mana.md) in ways both wondrous and perilous, embodying the duality of life and death that defines the Matua islands. While solemn meditation on the acceptance of death is part of the culture here, there are some that have tested the limits of magic and alchemy to try to achieve immortality, which has always ended in death. Such dangerous experimentation is not discouraged here, but to cheat death is to try to get the best of [Moanatu](../god/moanatu.md), a fool's errand if you ask anyone who grew up walking along the black sands.\n\nThe people of the Matua islands make their lives where others would not dare. Their homes are built from black wood and roofed with palm leaves oiled to resist endless rain. They fish the shallows for eel and shellfish, harvest seaweed and salt, and cultivate hardy crops in black fertile soil growing taro, yam, and a red-fleshed fruit called blood guava that grows best under cloudy skies. Bone carving and shellwork are the islanders’ art: they fashion jewelry, charms, and spirit-masks to honor their ancestors and ward off malevolent spirits. Children grow up hearing ghost stories not to frighten them, but to teach respect.\n\nThe teachings of Shaka never took root here. To the Matua, death is both final and always near. The sea is both home and tomb. While all [Akua](../law/akua.md) are prayed to here, they especially honor [Moanatu](../god/moanatu.md), god of the underworld and the seas. The depths, the dead, and hidden things. They do so with quiet reverence, not worship but acknowledgment, as one might nod to a passing storm. His name is not invoked lightly. His child, [Moanaroa](../beast/moanaroa.md), prowls these waters, a colossal eel whose ghostly glowing scales drift like stars beneath the waves. It is interesting to note that Moanaroa is the only member of the guardian beasts that both protects *and *kills the inhabitants of the islands it calls home. Though it devours both monster and man, it is still revered. The islanders make offerings of black pearls and silver fish before voyages, lest they attract its hunger.\n\nThe inhabitants of the haunted isles fear few things more than the [Manogata](../species/manogata.md), shark people who rise from the deep to raid the coasts. While they are a danger no matter where one sails on the ocean, nowhere else in Nuitai but here do they actually come ashore. Their only known predator is Moanaroa. The reader may be surprised that the people here can be quite jovial, and have a strong sense of humor, if not morbid. The ancestor worshiping islanders of the Matua archipelago have learned to live beside ghosts and monsters alike. They still sing and dance around driftwood fires, and trade and commune in bustling markets under the rain, despite the gloom, because they know better than anyone that this life is fleeting and short, and should be appreciated to the fullest.\n\nDeep within the inner jungles and cavernous cliffs of the larger islands dwell the [Pekapeka](../species/pekapeka.md), small bat-folk who glide through the mists and roost in the stalactite forests of the Matua caves. Their soft chittering songs echo through the jungles at night. Though shy and rarely seen, they occasionally trade fruit, shells, and glow-moss with coastal villagers, and are regarded as lucky spirits of the dark forest rather than beasts.\n\nThe Matua Archipelago is home to the characters [Tawiri](../person/tawiri-the-elderly-caller.md) and [Kiki](../person/kiki-the-witch-doctor.md).\n","pics":[{"file":"art/wiki/location/the-matua-archipelago-1.webp","caption":"The Matua Islands"}]},{"id":"location/the-underworld","group":"location","title":"Underworld","file":"lore/location/the-underworld.md","state":"stub","md":"# Underworld\n\n[Moanatu](../god/moanatu.md)'s realm in the deepest, darkest depths of the sea. Perhaps even beneath [The Great Maelstrom](../location/the-great-maelstrom.md) itself. Believe to be where souls go after death in traditional [Anuic](../organization/anúa.md) beliefs.\n","pics":[{"file":"art/wiki/location/the-underworld-1.webp","caption":"The Underworld"}]},{"id":"location/tokelau---the-north-sea","group":"location","title":"Tokelau Sea","file":"lore/location/tokelau---the-north-sea.md","state":"ok","md":"# Tokelau Sea\n\nThe Tokelau Sea, also called the North Sea, lies to the north of the great maelstrom. It is arguably the most dangerous region of Nuitai to sail. Frigid cold, constant violent storms, and the largest sea monsters that rival the size of those outside the islands bordering the maelstrom. Islands in these waters are few and far between, small and inhospitable. Sailors say no one lives here, and almost no one knows otherwise. Most of the islands are [Lanigata](../ethnicity/lanigata.md) ruins hidden in the storms, and a few hold small villages of hardy otter people so isolated that the rest of Nuitai does not know they exist; their only visitors are the northern [Ikagata](../species/ikagata.md), who keep settlements and roads of their own below the storms. It is debatable whether it is safer to sail these seas to travel from the Kame Kingdom to Māla Iki or to ride the maelstrom itself.\n","pics":[{"file":"art/wiki/location/tokelau---the-north-sea-1.webp","caption":"The North Sea"}]},{"id":"location/velafi","group":"location","title":"Velafi Islands","file":"lore/location/velafi.md","state":"ok","md":"# Velafi Islands\n\nVelafi, also called the Fire Islands, lies to the southeast of the great maelstrom. While volcanoes can be found all over the islands of Nuitai, they are the most numerous and most active here than anywhere else. The skies above these islands are filled with steam and ash as rivers of magma flow eternally from the mountains into the oceans. Salamanders, lava dragons, fire spirits and other wildlife that are either borne of or resistant to fire call these islands their home.\n\nAs do the fiery Ahi’Mana Fire Dancers, followers of the Goddess [Mauga](../god/mauga.md), mistress of volcanoes. The fire dancers are a force to be reckoned with. They specialize in destruction, through both martial prowess and powerful fire magic, they can break through any defense. Only the foolish do not fear their wrath. Despite their terrifyingly destructive abilities, their movements are complex and beautiful. They are practitioners of [Lelua](../technology/lelua.md), a dance based martial art inspired by the mesmerizing unpredictable movements of fire. Most the Velafi wear woven sandals, since fresh lava rock is sharp and hot. The fire dancers do not. They go barefoot, and walking on hot coals is part of their training.\n\nDeep within the jungles of the islands of this flaming archipelago live also the famous Hunters of Nuitai. Masters of archery, spear fishing and knowledge of survival in the wild. They are known to light their weapons on fire and hide in green foliage using war paint as camouflage. Experts in both killing and healing, their patron deities are [Lanu](../god/lanu.md) and Mauga, goddesses of the forest and creation. They take life but also respect it.\n\n## How the islands are run\n\nVelafi are run by women, and the reason the islanders give is Mauga. She made the land, so the land passes the way she would pass it, from mother to daughter. When a lava flow cools into new ground, it belongs to the women of the line whose mountain made it. A man farms his wife's land or his mother's, never his own, and when he marries he moves into his wife's household.\n\nWomen also make the money. The shell strings that serve as currency across the south are strung and owned by women, so every trade with the islands passes through a woman's hands. That includes the silent trade on the beaches, where outsiders never meet the sellers: the strings left on the sand are a woman's property, and so is whatever is left in exchange.\n\nA sister outranks her brother in anything that touches Mauga. He owes her a share of his catch and his labour, and he defers to her at the shrines. Of all the curses on the islands, a sister's is the one men fear most.\n\nThe fire dances are property too. Each dance belongs to a maternal line, and a girl inherits the right to perform it from her mother. To dance one you have no right to is theft.\n\nIn nearly every village, the Hunters' villages among them, the senior women govern outright. The exception is the village of the fire dancers. There the women hold Mauga's rites, and the politics are left to the men, who sit in council and argue in public. Which men sit in that council is decided by the senior women, and a man who loses their favour loses his seat.\n\nTravelers to Velafi should take heed of the many dangers, from both the local wildlife and the locals themselves. This corner of Nuitai is not for the faint of heart\n","pics":[{"file":"art/wiki/location/velafi-1.webp","caption":"Velafi"}]},{"id":"settlement/kota-emas","group":"settlement","title":"Kota Emas","file":"lore/settlement/kota-emas.md","state":"ok","md":"# Kota Emas\n\nTo the west of the great maelstrom, extending one thousand miles from the north of the [Bayang Seas](../location/bayang-seas.md) and to the south of the [Kame Kingdom](../organization/kame-kingdom.md) in the [Calm Ring](../article/sailing.md), is the Matahari Archipelago. The main island is on the famed Matahari Atoll, surrounded by a lagoon and a barrier reef. Here can be found the largest and most diverse city in all of Nuitai, Kota Emas, the central hub of trade and Shaka worship, home of the Luminary. However there is a wide variety of people of all backgrounds and faiths living in this city, including strange races and peoples from all over the endless ocean that the natives of Nuitai could only dream of. The sounds of strange music and the smell of spices fill the air. Vendors with stalls parked on the edges of river roads sell breadfruit, star fruit and bowls of hot rice.\n\nThe most advanced architecture, technology and hundreds of advanced ships that sail in and out of the lagoon are a stark contrast to the humble quiet life of the islands east of the maelstrom. The largest and main temple to Shaka in Nuitai can be found here, as can the headquarters of the archeological society dedicated to investigating the ruins of the sky people, and a criminal underworld hidden in the back alleys and under the streets of the city. In Kota Emas, the main roads are essentially man-made rivers that must be traveled by small boats.\n\nMembers of the law arm of the temple of [Shaka](../god/shaka.md) train in barracks outside the city. The Zealots of [Bandar](../organization/bandar.md) are the warrior-priests of Shaka and keepers of order in Kota Emas, sworn to both uphold and defend the way of light; they root out injustice at the point of a blade. Far from mere soldiers, they are a living embodiment of devotion, their martial discipline woven into their worship. Masters of Sila, the blade based martial art perfected in the Bandari peninsula to the west, they strike with speed and precision while bolstering allies and breaking enemy ranks. They are a stark contrast to the pacifistic Shaka worshiping nature priests of Mala Iki.\n\nKota Emas was not built on arrival. The Bandari crossing came in wrecked, and the city was founded by its survivors a generation or two after the landing, about seven hundred years ago. Kota Emas keeps its founding day; the landing itself is half legend.\n\nPerhaps the most striking feature of the Matahari Atoll, is the gold and white guardian beast that can be found flying in the skies above the city of Kota Emas; [Ringanaga](../beast/ringanaga.md).\n","pics":[{"file":"art/wiki/settlement/kota-emas-1.webp","caption":"Kota Emas, the Golden City"}]},{"id":"settlement/kulāiwi","group":"settlement","title":"Kulāiwi","file":"lore/settlement/kulāiwi.md","state":"ok","md":"# Kulāiwi\n\n> \"Everyone on Kulāiwi is somebody's cousin. You can't sneak a taro cake without three aunties hearing about it by noon.\"\n> *A fisherman's son of Kulāiwi*\n\nKulāiwi is a small island in the [Māla Iki Islands](../location/māla-iki-islands.md), beside Māla Iki itself, the largest island of the chain. It has one village, also called Kulāiwi. The island and the village share the name.\n\n## Name\n\n*Kulāiwi* is the eastern word for a homeland. Literally it means \"plain of bones\": the land where a family's ancestors are buried. Velafi speakers say *Tulāivi* and Matua speakers *Turāiwi*. The islanders themselves use the eastern form.\n\n## Place\n\nThe Māla Iki Islands are a hotspot chain. The sea floor drifts clockwise, the way the current runs, so the newest and largest island, Māla Iki, sits at the Tokelau end, and the older, smaller islands trail away clockwise toward [Lanuloa](../location/the-lanuloa-archipelago.md). Kulāiwi is one of the small ones, close beside the large island.\n\nIt shares the chain's weather, the mildest anywhere in Nuitai: gentle rain, soft sunlight and warmth all year. Kulāiwi is one of the sunniest spots in it. Fruit trees, gardens and flowering plants grow thick across the island, and food is plentiful. The village is small and quiet, its houses are plain, and its people live simply.\n\n## People\n\nThe villagers are eastern [Nuitagata](../ethnicity/nuitagata.md), culturally part of the Lanuloa people, from the most isolated corner of the east. As elsewhere in the chain, nobody in the village has animal features. They speak with the eastern accent.\n\n[Kailo](../person/kailo-the-wandering-chef.md), the wandering chef, grew up in the village.\n","pics":[{"file":"art/wiki/location/mala-iki-islands-1.webp","caption":"Māla Iki, the Little Garden"}]},{"id":"ethnicity/bandari","group":"ethnicity","title":"Bandari","file":"lore/ethnicity/bandari.md","state":"ok","md":"# Bandari\n\nThe Bandari are a seafaring people hailing from the distant and now-lost country of [Bandar](../organization/bandar.md), somewhere far to the west of Nuitai. Eight centuries ago, their fleets of broad-hulled ships bearing the sun-mark of [Shaka](../god/shaka.md) crossed the endless ocean, bringing luxury goods, sophisticated craftsmanship, clothing, cuisine, culture, and organized religion that forever altered the island peoples circling [The Great Maelstrom](../location/the-great-maelstrom.md) .\n\nThey settled chiefly in the western seas of Nuitai, on the [Matahari Archipelago](../location/matahari-archipelago.md), founding the radiant city of [Kota Emas](../settlement/kota-emas.md), their golden beacon of faith and trade. Many also settled in the shadows of the [Bayang Seas](../location/bayang-seas.md), south of Matahari, where the lawful Zealots of Bandar have less influence.\n\nThey are known for their artistry, cosmopolitan culture, spiritual devotion to [The Teachings of Shaka](../organization/the-teachings-of-shaka.md), and seafaring skill. Bandari architecture and clothing favor gold, white, and deep reds; their cities are full of canals, prayer banners, and the scent of burning resin.\n\nThe spoken language of the Bandari, [Bandhasa](../language/bandhasa.md), is written using a script characterized by curvy flowing letters punctuated by loops. [Nuitai’lo](../language/nuitailo.md), the language of the native [Nuitagata](../ethnicity/nuitagata.md), had no written script before the arrival of the Bandari, relying on oral tradition, and so they the native people adopted this imported script for themselves.\n\n## Appearance and Varieties\n\nThere are two primary lineages among the Bandari: **Manusia **and **Vanara**. Though they share ancestry and culture, the two diverged in form and temperament over centuries.\n\n### Manusia\n\nThe Manusia are the more common lineage among the Bandari. Their name is the Bandhasa word for a person, and it has become the word for their shape: any people built like them is called Manusia-built, a habit everyone who is not Bandari resents a little. They still bear the indelible mark of their mythic ancestry. They are not too different in appearance from the native [Nuitagata](../ethnicity/nuitagata.md), though they lack the imposing height and goliath build of the latter.\n\nTheir features are vigorous and striking. Their skin tends toward lighter shades which, unlike that of the Nuitagata, is not traditionally adorned with tattoos. Eye colors range from deep bronze to molten gold. Their hair, in shades of brown, gold, or black, grows full and wild like dancing flames, often dark at the roots and sun-lightened at the tips.\n\nBushy eyebrows and heavy sideburns frame their faces, on women as much as on men. The men may also grow beards or moustaches, though plenty do not. Their brows, thick and expressive, often arch or curl in gentle waves reminiscent of stylized sunrays or the rolling motion of fire, lending their faces a vivid, almost luminous intensity.\n\nDespite this, the Manusia take great care to keep their hair neatly trimmed or bound for the sake of appearances. Their overall look is one of restrained vitality, reflecting the dignity and discipline of a people renowned for their learning, order, and faith.\n\n### Vanara\n\nSometimes known as the \"Children of the Forest,\" the rarer Vanara Bandari share much of the same vivid appearance as their Manusia kin. They have the same bold stylish brows, thick sideburns and wild flame like hair with sun-warmed hues that hint at their radiant ancestry. Yet where the Manusia are defined by discipline and poise, the Vanara embody motion and grace.\n\nSmaller and lighter than their Manusia cousins but just as devout and intelligent, Vanara are agile and quick, capable of feats of balance and speed unmatched by other peoples, only the amphibian [Ranagata](../species/anura.md) of the [Lanuroan](../location/the-lanuloa-archipelago.md) rainforests rival their skill for acrobatics. Dense gold and brown fur covers their entire body. They have long prehensile tails, strong enough to hang from tree branches or the rafters and balconies of crowded cities. Their athleticism makes them more naturally talented at channeling [Kolindala](../law/mana.md). Vanara are celebrated as skilled martial artists, spies, and scouts. They are common among the ranks of the [Penyamun](../organization/the-penyamun.md).\n\nAlthough Vanara sometimes face discrimination from the Manusia, stereotyped as thieves, both groups generally coexist peacefully. Many believe that Vanara Bandari were more common in the past and have sacred ancestry. Some depictions of [Shaka](../god/shaka.md) himself show him as a small figure with a furry tail and a veiled face, suggesting he may have been a Vanara himself. This same art tends to depict Shaka more as a warrior of the people or benevolent trickster rather than a serene sage.\n\n### Other Bandari Peoples\n\nIn addition to the Manusia and Vanara, there are a variety of other races that trace their ancestry from Bandar and identify as Bandari but through cultural identity rather blood lineage. They are also the descendants of people who sailed to Nuitai eight centuries ago and have lost contact with Bandar. For this reason \"Bandari\" can either refer to the race or the civilization.\n\nMany are Manusia-built, but lack the distinctive stylish eyebrows and hairstyles of the Manusia. Others are feline, avian, reptilian, aquatic, simian, and even proboscidean.\n\nMost follow the teachings of Shaka, but there are a variety of minority religion and spiritual traditions practices in Bandari territories as well, the most common of which predate Shaka but have the same cosmological foundations.\n\nThis variety of culture and religion can be more easily found in the urban areas of the Matahari islands, especially the cosmopolitan Kota Emas where the Shakan faith takes center stage but minority religions are tolerated. This diversity is also common in lawless underworld of the Bayang Seas. Pirate crews are by far the most diverse microcosms of the people of Nuitai, where ancestry is not considered relevant.\n\n## Society and Culture\n\nBandari life revolves around faith, craft, and discipline. The Teachings of Shaka guide moral conduct, shaping everything from architecture to cuisine.\n\nMeals are rich with spice and balance. Rice is a common staple steamed in coconut milk, grilled fish wrapped in banana leaves, and sweet pandan cakes offered at shrines. These popular foods can be found in lively market stalls along the canals of Kota Emas, along with various fruits and vegetables such as breadfruit and star fruit. Durians are banned due to their smell.\n\nThe Zealots of Bandar are famous for their martial art, [Sila](../technology/sila.md), blending swordsmanship with meditative movement, reflecting both physical mastery and spiritual clarity. In all things, the Bandari prize refinement, learning, and devotion. They brought modern science, philosophy, literature and scholarship to Nuitai. They are a people as polished and enduring as the golden temples of Kota Emas.\n\n## Technology and Craftsmanship\n\nThe Bandari are master shipwrights, builders, and artisans. Their broad-hulled jong and narrow lancaran ships are famed across the Maelstrom for their speed and beauty, built from hardwood and lacquered in red, black, and gold.\n\nBandari cities are threaded with canals, bridges, and tiered temples of stone and stucco, adorned with sun motifs and polished brass reliefs. Skilled metalworkers and weavers, they produce fine kris blades, intricate jewelry, and patterned silk bandanas and sarongs that shimmer like water in sunlight.\n","pics":[{"file":"art/wiki/ethnicity/bandari-2.webp","caption":"Bandari (Manusia)"},{"file":"art/wiki/ethnicity/bandari-1.webp","caption":"Bandari (Vanara)"},{"file":"art/wiki/ethnicity/bandari-3.webp","caption":"Elephant Folk (Gaja)"},{"file":"art/wiki/ethnicity/bandari-4.webp","caption":"Sun-Marked Ships"}]},{"id":"ethnicity/lanigata","group":"ethnicity","title":"Lanigata","file":"lore/ethnicity/lanigata.md","state":"ok","md":"# Lanigata\n\nScattered across the islands of Nuitai are the ruins, temples and statues created by the \"sky people,\" the Lanigata. They vanished ten thousand years ago and the only traces left of them are their architecture and magical technology which is still active. The Lanigata discovered how to harness [Mana](../law/mana.md) to carve glyphs into stone, allowing them to move stone (elevators, doors), preserve memory, or animate constructs.\n\nThe Nuitagata avoid the stone megaliths, for they sometimes awaken and attack anyone who ventures too near. The only warning that stone will move is when the strange symbols carved into the stone begin to hum and glow. Nobody living has seen a Lanigata. What they looked like is known only from their own art, which shows feathered serpent people carved into the ruins. The symbols alone were mysterious to a people who until foreign contact recorded and preserved knowledge through oral tradition. The sky is filled with floating islands, the largest of which above a colossal eternal maelstrom is [The Floating Continent](../location/the-floating-continent.md) and the silhouettes of mysterious serpentine beings can be seen flying high above the clouds. Occasionally artifacts or stone golems are known to come falling from the sky. These falling golems are a threat if they are not destroyed at the fall. Some of these giants can be seen on the horizon, walking waist deep in the ocean, a humbling site in addition to the occasional sea beast that pops its head out in the distance.\n","pics":[{"file":"art/wiki/location/sky-islands-1.webp","caption":"Floating Islands and Ruins"}]},{"id":"ethnicity/nuitagata","group":"ethnicity","title":"Nuitagata","file":"lore/ethnicity/nuitagata.md","state":"ok","md":"# Nuitagata\n\nThe Nuitagata are the most common native peoples of the islands of Nuitai. They are Manusia-built, as the Bandari put it, but a large and hardy folk; tall, strong, and broad of build. It is not unusual for some of them to reach heights of eight feet tall.\n\nTheir skin runs through shades of bronze. It is deepest in the east, on [Māla Iki](../location/māla-iki-islands.md) and across [Lanuloa](../location/the-lanuloa-archipelago.md), and lighter toward [Matua](../location/the-matua-archipelago.md), where the ash over the Fire Islands and the storms over Matua keep the sun off for most of the year. That is a tendency across whole islands and says nothing about any one person: a light-skinned easterner or a dark Matuan surprises nobody. Their dense, coarse hair falls in heavy waves, ranging in hue from dark brown to fiery red. Their eyes are strikingly varied, with pupils in every color of the spectrum; heterochromia is common. The men grow their hair long but keep it tied back, and they grow no facial hair at all. It is a longstanding tradition among the Nuitagata to mark their skin with tattoos. They go barefoot as a matter of habit, on sand, in the forest and on deck alike; shoes are something the Bandari wear. The exception is [Velafi](../location/velafi.md), where people wear woven sandals to cross the lava fields.\n\nThey are the descendants of the first inhabitants to settle the archipelago, long before the arrival of the Bandari or the rediscovery of the ruins of the [Lanigata](../ethnicity/lanigata.md). Their ancestors were unparalleled sailors and explorers. Their communities are scattered across nearly every island chain within the Calm Ring and Driftbelt, from the gentle shores of [Māla Iki](../location/māla-iki-islands.md) to the mist-shrouded [Matua Archipelago](../location/the-matua-archipelago.md) and the golden coast of Matahari.\n\nSpiritually, the Nuitagata traditionally follow the ancestral belief known as [Anúa](../organization/anúa.md), the native faith of Nuitai. Anúa teaches that the world itself and all things within it are divine, and that everything moves because of [Mana](../law/mana.md) the spiritual energy that animates existence, and nothing truly stands still. When missionaries from the distant country of [Bandari](../ethnicity/bandari.md) made contact with these islands and introduced the teachings of [Shaka](../god/shaka.md), many Nuitagata slowly began integrating these new ideas with their native beliefs, resulting in a variety of syncretic religions practices around the islands of the [maelstrom](../location/the-great-maelstrom.md).\n\nThe Nuitagata speak [Nuitai’lo](../language/nuitailo.md), a continuum of closely related dialects descended from a common ancestral tongue. Each island group has its own accent, rhythm, and vocabulary shaped by local tradition, but communication between regions remains possible. Travelers may stumble over idioms or ceremonial phrasing, yet the shared structure of Nuitai’lo allows mutual understanding across the ocean.\n\nBefore the arrival of the Bandari, the Nuitagata had no form of writing and relied purely on oral traditions. The glyphs of the ancient Lanigata were a mystery to them. Even today most native Nuitagata still cannot read, the literate among them typically being priests of Shaka or travelers, although this is slowly changing. They have adopted the foreign Bandari writing system, which was not designed for Nuitai'lo, which is resulted in complexity and phonetic inconsistency.\n","pics":[{"file":"art/wiki/ethnicity/nuitagata-1.webp","caption":"Native Islanders (Nuitagata)"},{"file":"art/wiki/ethnicity/nuitagata-2.webp","caption":"Islanders and Bandari Side by Side"},{"file":"art/wiki/ethnicity/nuitagata-3.webp","caption":"The Pua'agata, Boar Ancestors of the Chants"}]},{"id":"species/anura","group":"species","title":"Anura","file":"lore/species/anura.md","state":"ok","md":"# Anura\n\nThe Anura are one of the many intelligent species found throughout Nuitai. They are an amphibious people with large, bulging eyes atop their heads and a fondness for cuisine that primarily features insects. Known for their sharp intelligence and diverse regional forms, they come in two varieties.\n\n### Ranagata\n\nSmall and agile, these amphibious natives inhabit the eastern and northeastern regions of Nuitai, particularly [Māla Iki](../location/māla-iki-islands.md) and the [Lanuloa Archipelago](../location/the-lanuloa-archipelago.md). In the Māla Iki chain they keep to one forest on one island, apart from the Nuitagata villages, and an islander there can grow up without ever meeting one. They have bright colorful skin that is slippery to the touch, and large webbed feet that makes them graceful swimmers and natural acrobats. None rival the Ranagata passion for motion; diving contests, canopy races and daring leaps between treetop bridges are common pastimes.\n\nRanagata have long co-existed with the native [Nuitagata](../ethnicity/nuitagata.md) of the east and many practice [Anúic](../organization/anúa.md) traditions, typically as followers of [Lanu](../god/lanu.md). Fresh water is very important to the Ranagata, not just for drinking but for keeping their skin moist, and Lanu provides the gentle rain that nourishes the forests.\n\nRanagata typically build their homes in the high treetops of dense forests, with bridges connecting each structure creating floating villages in the canopies. Their native language is Rana'lo, characterized by rapid high pitched tonal ribbits that is a challenge for even the most skilled linguists to master.\n\n### Kaerujin\n\nWhere the Ranagata thrive among the trees and rain of the east, the Kaerujin embody a more earthen strength. Most Kaerujin live in the [Kame Kingdom](../organization/kame-kingdom.md), though many can also be found in [Kota Emas](../settlement/kota-emas.md), where peoples of every kind intermingle.\n\nThey are typically larger than their Ranagata cousins, with dry bumpy skin, and are less acrobatic and slow moving, preferring to stay on the low earth than the treetops. They are more stocky and round than slim or sleek, and more muted in color. They could easily be mistaken for the [Kame](../species/kame.md) they live with if not for their lack of shells.\n\nDespite their slower gait, they can be powerful warriors and a Kaerujin trained in [Wai’Kenpō](../technology/waikenpō.md) can be surprisingly agile and formidable in combat. While many Kaerujin practice the Kame spiritual tradition of [Wai'Ki](../organization/waiki.md), they revere their own Anuran pantheon rather than the [chelonian](../species/chelonians.md) gods of the Kame. Kaerujin are naturally talented at long sessions of still, silent meditation, and have been mistaken for boulders during their practice.\n\nThe Kaerujin language, Kaerugo, is a sister language of Kamego. It shares the same traits of open vowels, a steady even flow of syllables, and intricate politeness levels of grammar, but punctuated by deep, slow and throaty croaking sounds.\n\n[Bandari](../ethnicity/bandari.md) biologists have speculated that Anura of Ranagata and Kaerujin ancestries have evolved from or share a common ancestor with tree frogs and toads, respectively.\n","pics":[{"file":"art/wiki/species/anura-2.webp","caption":"Tree Frog Folk (Ranagata)"},{"file":"art/wiki/species/anura-1.webp","caption":"Toad Folk (Kaerujin)"}]},{"id":"species/chelonians","group":"species","title":"Chelonians","file":"lore/species/chelonians.md","state":"ok","md":"# Chelonians\n\n**Chelonian **is a collective term for turtlefolk who inhabit the warm coastal waters and reefs around the [Kame Kingdom](../organization/kame-kingdom.md) and the northwestern seas of Nuitai. Common chelonians share deep ancestral ties with the [Kame](../species/kame.md) but follow a simpler way of life, shaped by the tides and currents.\n\nMost Chelonian communities are nomadic sea-dwellers, traveling in small flotillas or living among coral islets. They possess a quiet, contemplative wisdom expressed through song, movement, and subtle changes in posture paired with low gurgling sounds rather than spoken language or writing.\n\nThough they do not build kingdoms or complex societies, and nuanced communication can be a challenge, the Chelonians’ harmony with the ocean and their instinctive craftsmanship inspire respect among the Kame, who see in them a reflection of their own origins and the endurance of nature.\n\nLike the Kame, chelonians are believed to also be descended from the great [Dai-Kame](../species/dai-kame.md), the ancient goliath sea turtles who roam the northern oceans as guardians of the deep.\n","pics":[{"file":"art/wiki/species/chelonians-1.webp","caption":"Sea Turtle Nomads (Chelonians)"}]},{"id":"species/dai-kame","group":"species","title":"Dai-Kame","file":"lore/species/dai-kame.md","state":"ok","md":"# Dai-Kame\n\nIt is debatable whether the chelonians or the Kame themselves are related to or descended from the massive gentle sea turtles that travel the waters of Nuitai, some so large as to be mistaken for islands themselves. Indeed some are so big and slow that flora and fauna have had time to grow on the backs of their shells. These giant turtles, sometimes known as Dai-Kame, are more common among the waters of the [Kame Kingdom](../organization/kame-kingdom.md) and are respected and protected by the Kame themselves.\n","pics":[{"file":"art/wiki/species/dai-kame-1.webp","caption":"Giant Sea Turtles (Dai-Kame)"}]},{"id":"species/ikagata","group":"species","title":"Ikagata","file":"lore/species/ikagata.md","state":"ok","md":"# Ikagata\n\nThe Ikagata are the native intelligent inhabitants of the ocean under the surface. Also known as \"the fish people\", the term is incredibly broad and as the ikagata themselves would point out, is about as specific as referring to all the races and peoples that walk on land as \"land people.\" There is an incredible genetic and cultural diversity of civilizations under the ocean, entire cities and countries hidden beneath the waves, but for those who can't breath underwater it is a world they will never see. The ikagata that live in the waters to the northwest of the [maelstrom](../location/the-great-maelstrom.md), around the [Kame Kingdom](../organization/kame-kingdom.md) are commonly squid people. Interestingly enough the word \"ika\" in the [Kame](../species/kame.md) language means squid. Their cultural center lies there too, in the northwest: the Ikagata keep the drowned ruins of the [Lanigata](../ethnicity/lanigata.md), and their roads run along the sea floor under the storms of [Tokelau](../location/tokelau---the-north-sea.md), where no surface ship goes, which is how one undersea people came to live in sky people ruins across all of Nuitai.\n","pics":[{"file":"art/wiki/species/ikagata-1.webp","caption":"Squid Folk (Ikagata)"}]},{"id":"species/kame","group":"species","title":"Kame","file":"lore/species/kame.md","state":"ok","md":"# Kame\n\nThe Kame are a [Chelonian](../species/chelonians.md) people who dwell within the [Kame Kingdom](../organization/kame-kingdom.md), a maritime realm nestled among the northwestern seas of Nuitai. Chelonians are a reptilian family of races with long necks and shells they can hide in. Among the chelonian kind, the Kame are the largest and most culturally developed, having cultivated language, medicine, and martial traditions unknown to their sea-dwelling kin. They are excellent swimmers, practitioners of medicine and martial artists, and have developed their own defensive form of martial art known as [Wai’Kenpō](../technology/waikenpō.md). The [Kame](../species/kame.md) practice their own form of Anuic beliefs known as [Wai'Ki](../organization/waiki.md). The Kame are pescatarians, that is, the only meat they eat comes from the sea. However some Kame who are especially devoted to the Kami of nature are full on vegetarians, eschewing even fish. It is believed that the Kame are descended from or distantly related to the [Dai-Kame](../species/dai-kame.md), the giant turtles that can be found roaming in the northwestern seas of Nuitai.\n","pics":[{"file":"art/wiki/species/kame-1.webp","caption":"Turtle Folk (Kame)"}]},{"id":"species/liokai","group":"species","title":"Liokai","file":"lore/species/liokai.md","state":"stub","md":"# Liokai\n\nGiant seahorses that can be ridden as mounts.\n","pics":[{"file":"art/wiki/species/liokai-1.webp","caption":"Giant Seahorses (Liokai)"}]},{"id":"species/manogata","group":"species","title":"Manogata","file":"lore/species/manogata.md","state":"ok","md":"# Manogata\n\nOne of the most terrifying inhabitants of the world of Nuitai are the Manogata, also known as the “Shark People.” They are technically [Ikagata](../species/ikagata.md), fish-people. They are intelligent, with their own spoken language although one has lived long enough to try to learn it, they have clothes and weapons, but no one has been able to make peaceful contact. The Manogata are violent, almost no one who encounters them survives and there is no warning when they attack ships and sailors. They have been known to take people beneath the waves, perhaps to eat them. Thankfully they rarely come ashore, it’s possible they cannot survive above the water for too long.\n","pics":[{"file":"art/wiki/species/manogata-1.webp","caption":"Shark People (Manogata)"}]},{"id":"species/mokomoko","group":"species","title":"Mokomoko","file":"lore/species/mokomoko.md","state":"ok","md":"# Mokomoko\n\nThe **Mokomoko** are a race of small, frilled running lizards native to [Velafi](../location/velafi.md). Though small and unassuming, the Mokomoko are clever artisans and builders, crafting tools and shelters with remarkable ingenuity. While some Mokomoko tribes are fiercely hostile, most have been known to peacefully coexist and trade with the **Nuitai**, even though direct communication is impossible. Notably, they possess a natural resistance to fire, making them uniquely adapted to their volcanic homeland. With rare exceptions, Mokomoko tend to flee and hide at the slightest hint of danger.\n","pics":[{"file":"art/wiki/species/mokomoko-1.webp","caption":"Frilled Lizard Folk (Mokomoko)"}]},{"id":"species/nagas","group":"species","title":"Nagas","file":"lore/species/nagas.md","state":"ok","md":"# Nagas\n\nSentient, serpent-like beings originally from [Bandar](../organization/bandar.md) , the Nagas now inhabit the cave systems of the Matahari Atoll and the sewers of [Kota Emas](../settlement/kota-emas.md). They are highly dangerous and aggressive toward outsiders; few who encounter them survive. Their cunning intelligence, venomous bite, and mastery of stealth make them formidable predators in both wilderness and urban environments.\n","pics":[{"file":"art/wiki/species/nagas-1.webp","caption":"Snake People (Nagas)"},{"file":"art/wiki/species/nagas-2.webp","caption":"Nagas (ChatGPT)"}]},{"id":"species/nakahiahi","group":"species","title":"Nakahiahi","file":"lore/species/nakahiahi.md","state":"ok","md":"# Nakahiahi\n\nGiant red serpents that wind they way in and out of the volcanoes of [Velafi](../location/velafi.md). The same serpents have been observed entering the crater of one island and emerging from the vents of others, suggesting there may be an extensive network of subterranean lava tubes and volcanic conduits linking the archipelago; a hidden plumbing of molten rock that the Nakahi'ahi use to traverse great distances beneath the islands’ scorched surface.\n","pics":[{"file":"art/wiki/species/nakahiahi-1.webp","caption":"Lava Serpents (Nakahiahi)"}]},{"id":"species/pekapeka","group":"species","title":"Pekapeka","file":"lore/species/pekapeka.md","state":"ok","md":"# Pekapeka\n\nThe Pekapeka are chiropterans. Small, winged people native to the deep jungles and limestone caverns of the [Matua Archipelago](../location/the-matua-archipelago.md) . Barely half the height of a Nuitai adult, they are covered in fine, dusky fur and possess wide, membranous wings that allow them to glide silently between trees or across cave openings. Enormous dark eyes and long, tufted ears give them a perpetual look of curiosity.\n\nThe Pekapeka live in roost-tribes, hanging in clustered groups from the ceilings of vast caverns strung with vines and glowing fungi. They are nocturnal foragers who gather fruit, insects, and cave fish, and they cultivate patches of bioluminescent moss that they harvest for light and trade. Their society is simple but cooperative; they weave small tools from bone and reed, and craft beautiful shell and feather ornaments that they exchange with the Matuan islanders for salt, cloth, and carved idols.\nCommunication between Pekapeka and other peoples is limited to gestures and sound-patterns, soft clicks, hums, and rhythmic wingbeats, yet they understand tone and intention with uncanny intuition. The native Matua Nuitagata regard them with affection and superstition, leaving bowls of sweet fruit at cave mouths as offerings to these charming inhabitants of the haunted isles.\n\nDespite their timid nature, Pekapeka are clever and quick. They can sense vibrations in the air and \"see\" sound. Though sentient, the Pekapeka are gentle and childlike in spirit. They neither build kingdoms nor wage wars, but fill the dark jungles with soft music and laughter.\n","pics":[{"file":"art/wiki/species/pekapeka-1.webp","caption":"Bat Folk (Pekapeka)"}]},{"id":"species/pohaku","group":"species","title":"Pohaku","file":"lore/species/pohaku.md","state":"ok","md":"# Pohaku\n\nThe sky people, the [Lanigata](../ethnicity/lanigata.md), left traces of their existence all across Nuitai. The most astonishing relics of their advanced civilization are the animated stone golems, known to the people of Nuitai as Pohaku, that still guard the ancient temples.\n\nThey vary in size, from towering stone figures shaped like people to mountains that move. Some patrol specific areas, awakening only when something approaches; others are eternally dormant or wander aimlessly without purpose.\n\nHow the Pohaku move remains a mystery. Scholars believe it has something to do with the glowing glyphs carved into their stone bodies. Somehow, the [Lanigata](../ethnicity/lanigata.md) discovered how to imbue [Mana](../law/mana.md) into stone, giving it life. Yet the Pohaku are ten thousand years old, and some believe the [Mana](../law/mana.md), or the souls, use to animate them are now trapped, unable to be reborn or move on.\n\nThe largest known Pohaku is the great stone guardian [Pōhaku Nui](../beast/pōhaku-nui.md)\n","pics":[{"file":"art/wiki/species/pohaku-1.webp","caption":"Stone Golems (Pohaku)"}]},{"id":"species/sarimanok","group":"species","title":"Sarimanok","file":"lore/species/sarimanok.md","state":"ok","md":"# Sarimanok\n\n> **Sarimanok**\n> - **Kind:** giant bird, flightless, ridden as a mount\n> - **Native to:** the jungles of the [Matahari Archipelago](../location/matahari-archipelago.md)\n> - **Kept in:** the [Lanuloa Archipelago](../location/the-lanuloa-archipelago.md), in stables\n> - **Size:** big enough to carry a grown rider, like a horse\n> - **Name:** a working name\n\nThe sarimanok is a giant running bird, shaped like a rooster and big enough to ride. It is the\ncommon mount of the Lanuloa Archipelago, where it is bred and kept in stables, the way horses are\nkept in other worlds.\n\n## Appearance\n\nA sarimanok stands on long, strong legs built for running, with heavy clawed feet. Its plumage is\nbright: a red comb and head, a gold neck, wings and body in blues, greens and reds, and a long,\nsweeping tail of curling feathers in every color, which trails behind it at a run. It cannot fly.\nRiders fit it with a woven saddle and a bridle, often hung with tassels and small bells.\n\n## Origin\n\nSarimanoks are not native to Lanuloa. They hatch wild in the jungles of Matahari, where flocks\nstill run free. [Bandari](../ethnicity/bandari.md) ships carried them east as eggs, and they took\nhold in Lanuloa, the region the Bandari touched most. There they became the ordinary way to\ntravel overland.\n\n## Keeping\n\nLanuloans breed sarimanoks and keep them in stables, as other peoples keep horses.\n","pics":[{"file":"art/wiki/species/sarimanok-3.webp","caption":"The Sarimanok"},{"file":"art/wiki/species/sarimanok-1.webp","caption":"A Lanuloan Rider on a Sarimanok"},{"file":"art/wiki/species/sarimanok-2.webp","caption":"A Lanuloan Rider on a Sarimanok (ChatGPT)"}]},{"id":"organization/anúa","group":"organization","title":"Anúa","file":"lore/organization/anúa.md","state":"ok","md":"# Anúa\n\nThe native animist faith of the people of Nuitai. Anúa teaches that the natural world itself is divine, and that the people and animals that inhabit it are spirits themselves. Everything from the rocks to the trees to the clouds themselves are imbued with [Mana](../law/mana.md) , a spiritual force that permeates the universe, the source of all magic. Anuic beliefs typically involve devotion to one or more [Akua](../law/akua.md), gods that are personifications of the forces of nature.\n\nWithin the last century, the teachings of [Shaka](../god/shaka.md) has been spread by the foreign [Bandari](../ethnicity/bandari.md) throughout Nuitai. At present day most of the native islanders of Nuitai now follow some religious practice that combines traditional Anuic beliefs with the more modern salvationist teachings of [Shaka](../god/shaka.md), which introduced structure moral codes and the idea that actions in this life affect one's reincarnation into the next.\n","pics":[{"file":"art/wiki/organization/anua-1.webp","caption":"Anúa, the Native Faith"}]},{"id":"organization/archaeological-society-of-kota-emas","group":"organization","title":"Archaeological Society of Kota Emas","file":"lore/organization/archaeological-society-of-kota-emas.md","state":"empty","md":"# Archaeological Society of Kota Emas\n","pics":[{"file":"art/wiki/organization/archaeological-society-of-kota-emas-1.webp","caption":"The Archaeological Society"}]},{"id":"organization/bandar","group":"organization","title":"Bandar","file":"lore/organization/bandar.md","state":"stub","md":"# Bandar\n\nThe homeland of the [Bandari](../ethnicity/bandari.md) people, somewhere far to the west of Nuitai\n","pics":[{"file":"art/wiki/organization/bandar-1.webp","caption":"Bandar, the Lost Homeland"}]},{"id":"organization/devotion-to-mauga","group":"organization","title":"Devotion to Mauga","file":"lore/organization/devotion-to-mauga.md","state":"stub","md":"# Devotion to Mauga\n\nA sect of [Anúa](../organization/anúa.md) dedicated to the goddess of Fire, [Mauga](../god/mauga.md). Practiced in [Velafi](../location/velafi.md).\n","pics":[{"file":"art/wiki/organization/devotion-to-mauga-1.webp","caption":"Devotion to Mauga"}]},{"id":"organization/kame-kingdom","group":"organization","title":"Kame Kingdom","file":"lore/organization/kame-kingdom.md","state":"ok","md":"# Kame Kingdom\n\nTo the northwest of the maelstrom, north of the Matahari Atoll and west of the treacherous seas of [Tokelau](../location/tokelau---the-north-sea.md), is the Kame Kingdom. It is an archipelago of islands marked by sacred caves, crystal clear springs and hidden grottos teeming with native life and rumored healing powers, all carefully protected by the guardians known as the Wai'Ki Wardens. This archipelago is verdant and green, the lakes and other bodies of water along the coast covered with algae. The inhabitants of the Kame Kingdom, the [Kame](../species/kame.md), are a chelonian people; walking, talking turtles far more intelligent than ordinary sea turtles. The Kame are famous for their healing arts, and natural medicine is their primary export.\n\n Swimming in the surrounding seas of this kingdom are colossal turtles known as [Dai-Kame](../species/dai-kame.md), including [Kyoumikame](../beast/kyoumikame.md), the largest and oldest known Dai-Kame, revered as a guardian of the islands. The kingdom is ruled by the reclusive King Kamehameha, whose presence is more often spoken of in legend than seen.\n\nAmong the Kame’s cultural inventions is the game of [Kaigara](../ritual/kaigara.md), a slow and strategic shell-capturing contest that reflects the patience and wisdom of Kame society.\n\n### The King and the Council of Springs\n\nThough King Kamehameha, the Ōkame, is spoken of with reverence, few among the living can claim to have met him. Decisions are instead made through the \"Senkai\" or the Council of Springs, an assembly of senior Wai’Ki Wardens and island elders. The council chambers are part of the natural environment, within a flooded cavern, surrounding the reflection pool. There are five elders.\n\nThe elders of the Senkai can take a very long time to come to any decision. This slow, contemplative process frustrates foreign merchants who come seeking trade, for a single question of tariffs or treaties can take entire seasons to resolve. While the Senkai governs by consensus, the Ōkame always has the last word, although he rarely chooses to speak, trusting the elders’ judgment and intervening only in moments of great importance.\n\n> The [Kame](../species/kame.md) practice their own form of Anuic beliefs known as [Wai'Ki](../organization/waiki.md), which gracefully absorbed the teachings of [Shaka](../god/shaka.md) following contact the [Bandari](../ethnicity/bandari.md) missionaries. Unlike the Nuitagata however, who adopted the more common and communal Path of the Golden Sun, the Kame were more receptive to the introspective Path of the Polished Mirror\n","pics":[{"file":"art/wiki/organization/kame-kingdom-2.webp","caption":"The Turtle Kingdom"},{"file":"art/wiki/organization/kame-kingdom-1.webp","caption":"The Council of Springs"}]},{"id":"organization/maki-sages","group":"organization","title":"Maki Sages","file":"lore/organization/maki-sages.md","state":"ok","md":"# Mak

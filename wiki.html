i Sages\n\nThe Maki Sages are a group of [Lanu](../god/lanu.md) worshipers who broke off from the [Priests of Māla](../organization/the-nature-priests-of-māla-iki.md) a century ago when they integrated [The Teachings of Shaka](../organization/the-teachings-of-shaka.md) , later formalized in [Māla](../organization/māla.md) doctrine as the worship of [La Lanu](../god/la-lanu.md), the Akua Iki of sunlight, which the Sages saw as an encroachment upon [Lanu](../god/lanu.md) ’s traditional domain of sunlight. To the Sages, La as [Shaka](../god/shaka.md) is a reflection of mortal misunderstanding. They believe the divine should not be redefined by foreign tongues.\n\nThey are hermits who can be found deeper in the more dangerous parts of the forests of [Māla Iki](../location/māla-iki-islands.md). They differentiate themselves by donning a purple spiral on their green robes, the symbol of [Mana](../law/mana.md), and unlike the pacifistic priests of Māla have mastered martial spell-casting and the use of nature magic for self defense as well as healing, a necessity if one is to live among the more unforgiving of [Lanu](../god/lanu.md) ’s children. The Maki Sages still dance and spin using similar forms, but with slightly more speed that begins with softness and develops into force.\n","pics":[{"file":"art/wiki/organization/maki-sages-1.webp","caption":"Maki Sages"}]},{"id":"organization/matua-ancestor-worship","group":"organization","title":"Matua Ancestor Worship","file":"lore/organization/matua-ancestor-worship.md","state":"empty","md":"# Matua Ancestor Worship\n","pics":[{"file":"art/wiki/organization/matua-ancestor-worship-1.webp","caption":"Matua Ancestor Shrine"}]},{"id":"organization/māla","group":"organization","title":"Māla","file":"lore/organization/māla.md","state":"ok","md":"# Māla\n\nMāla is one of the most widely practiced spiritual traditions among the [Nuitagata](../ethnicity/nuitagata.md) peoples of the eastern seas. While the practice of both Anua and Shaka worship in paralell are common, Mala attempts to make the fusion explicit in its doctrine.\n\nMala originated on the Māla Iki Islands (hence the name) through the teachings of the Priests of Māla, who sought to reconcile their native animist faith, [Anúa](../organization/anúa.md), and their devotion to [Lanu](../god/lanu.md) with the doctrines of light and recurrence brought by [Bandari](../ethnicity/bandari.md) missionaries devoted to the [Teachings of Shaka](../organization/the-teachings-of-shaka.md). The resulting synthesis regards all natural life as sacred while also embracing the purifying and illuminating aspects of [Shaka](../god/shaka.md)’s light. One can be reborn into Shaka's [light world](../location/the-light-realm.md) by devoting oneself to not just his teachings, but also Lanu and her creations in this world. Some interpretations consider Shaka to be an Akua Iki or aspect of Lanu as her light, a re-interpretation of the native sun god [La Lanu](../god/la-lanu.md).\n\nMāla spread from [Māla Iki](../location/māla-iki-islands.md) across the [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md) and is more prominent in the northeast of Nuitai, becoming less common further south.\n\nThe practice varies by island but retains the same symbolism. Priests wear robes of green and gold, dance beneath forest canopies, and recite prayers facing both the rising sun and bowing to the forests. Offerings of fruit, woven garlands, and clean water are made to honor Lanu’s gentle breeze and Shaka’s warm light. Though rooted in pacifism, Māla is not passive or esoteric. Its followers teach that harmony must be tended like a garden, through patience, humility, and labor.\n\nA minority of traditionalists in Mala Iki, known as the [Maki Sages](../organization/maki-sages.md), reject the inclusion of Shaka into the pantheon of [Akua](../law/akua.md) and continue to devote themselves only to Lanu.\n","pics":[{"file":"art/wiki/organization/the-nature-priests-of-mala-iki-2.webp","caption":"Nature Priests of Māla"}]},{"id":"organization/sarpa","group":"organization","title":"Sarpa","file":"lore/organization/sarpa.md","state":"ok","md":"# Sarpa\n\nSarpa is the ancient cosmological and religious tradition of the [Bandari](../ethnicity/bandari.md) people, predating [The Teachings of Shaka](../organization/the-teachings-of-shaka.md). It formed the spiritual foundation upon which [Shaka](../god/shaka.md) later built his philosophy.\n\nSarpa teaches that all existence moves within an endless cycle known as The Spiral, an unbroken chain of life, death, and rebirth. Unlike the monistic [Anúic](../organization/anúa.md) belief of the [Nuitagata](../ethnicity/nuitagata.md), which treats all being as manifestations of a single substance called [Mana](../law/mana.md), Sarpa makes a distinction between **Atoma** and **Kolindala**.\n\n**Atoma** is the individual soul, the enduring self that is reborn from life to life, carrying merit, memory, and identity through what the Bandari call eternal recurrence. **Kolindala**, by contrast, is the radiant current of magical vitality that permeates the cosmos. It does not reincarnate, nor does it possess selfhood. Instead it is the universal energy that mages, martial artists, and mystics can refine or channel. To the Nuitagata, all of this is Mana.\n\nIn Sarpic thought, an Atoma moves through the Spiral within the current of Kolindala, just as a traveler moves within a river: one is the voyager, the other the medium through which passage is made.\n\nThe serpent is the central symbol of Sarpa, representing the continuity and sacred movement of life. Snakes are considered holy and protected animals, embodying wisdom, renewal, and the Spiral itself. The faith’s emblem is a serpent coiled in a spiral.\n\n[Matahari](../god/matahari.md), the sun god later associated with Shaka, was once a prominent Sarpic deity. Followers of Sarpa still venerate Matahari as the living sun and do not equate him directly with Shaka. While most Sarpic adherents respect Shaka as a great teacher, they view him as mortal or, in some sects, as an avatar or emanation of Matahari rather than a divine being in his own right.\n\nSarpa is not a single organized religion but a family of related traditions that revere different deities, known as Devas, from the old Sarpic pantheon. Each denomination focuses on a different Deva and has a different interpretation of their role in the cosmic order. Though the Teachings of Shaka have become the dominant and central faith in Bandari civilization, Sarpic communities persist as minorities, maintaining the older rites, serpent symbolism, and eternal cosmology that once defined ancient Bandari spirituality.\n\nAlthough ancient Sarpa once employed a caste-like system of social roles, modern Sarpic communities no longer follow it. Followers of Shaka often claim that the abandonment of caste was one of Shaka’s greatest moral victories, but Sarpic adherents reject this interpretation. They argue that the original system was never meant to enforce hereditary hierarchy, but to guide individuals toward roles suited to their character and talents. In their view, it was only later historical distortions that hardened it into a rigid class structure. Contemporary Sarpic orders formally renounce caste as outdated, holding that the ancient ideal was one of balanced contribution rather than inequality.\n\nIn the crowded markets of [Kota Emas](../settlement/kota-emas.md), it is common to see Sarpic fortune tellers and snake handlers offering readings of one's destiny within the Spiral. Some read patterns in a serpent’s movements, others read palms or cast die, and a few keep small shrines where passersby ask questions while a sacred snake rests coiled nearby. Sages fall into deep meditation amid swirling incense, interpreting the shapes that form in the drifting smoke. Others use rhythmic drumming or looping dance steps, drawing on [Kolindala](../law/mana.md) to enter a state of trance before giving counsel.\n\nThese practices and small performances are part of everyday life for many Sarpic communities, blending spirituality with street spectacle, and earning a living. Yet they sit uneasily with devout followers of Shaka. To them, relying on omens risks clouding moral judgment, and consulting a diviner is sometimes viewed as a quiet breach of Shakan discipline. Even so, the booths remain busy, and people often seek guidance discreetly despite the lingering controversy.\n","pics":[{"file":"art/wiki/organization/sarpa-2.webp","caption":"Serpent Fortune Tellers"},{"file":"art/wiki/organization/sarpa-1.webp","caption":"Sarpa, the Serpent Faith"},{"file":"art/wiki/organization/sarpa-3.webp","caption":"The Devas Together"}]},{"id":"organization/the-callers","group":"organization","title":"Callers","file":"lore/organization/the-callers.md","state":"ok","md":"# Callers\n\nThe Matua Callers are the shamans of the [Matua Archipelago](../location/the-matua-archipelago.md) , wielders of dark Mana who commune with the spirits of the dead. Clad in robes of black and purple adorned with bones and skulls, they are both revered and feared by their people.\n\nUnlike necromancers, the Callers do not enslave the dead. The spirits they summon come willingly, often ancestors of the Callers themselves, though not always. This communion is built on respect, a sacred dialogue between the living and those who have passed into [Moanatu](../god/moanatu.md) ’s domain. A relationship must be built with the dead. However, such communion carries grave danger. Malevolent entities may impersonate spirits, or the dead themselves may return wrathful. Because of this, only the wisest and eldest Callers are permitted to work in solitude.\n\nThis practice of \"voluntary necromancy\" is not considered taboo in the Matua Archipelago, in fact the Callers have been known to provide services. Funerary rites, corpse preparation, comforting the grieving, and helping the grieving contact lost loved ones for one last goodbye. Some callers, for the price, contact the dead for information, this has even been used as a form of investigation. Be wary if you plan to commit the sinful act of cold blooded murder in this archipelago, your victim just might tell on you.\n\nThough they do not worship [Akua](../law/akua.md) in the traditional sense, the Callers pay homage to [Moanatu](../god/moanatu.md), the Akua of Death, who rules both sea and underworld. He is acknowledged rather than petitioned; he is the realm the dead are in, and a realm cannot be asked for anything. Their prayers go to his aspects instead. Funerary work is addressed to [Matei](../god/matei.md), who walks souls down to the drowned realm, and the work of uncovering what is concealed is addressed to [N'garo](../god/ngaro.md), the princess of secrets, whose domain covers both the truth nature hides from a scholar and the truth a family buries. Many among the callers also acknowledge the teachings of Anúa, although they follow older traditions, and while they are not hostile to [Bandari](../ethnicity/bandari.md) they have completely rejected the teachings of Shaka, which claims souls are reborn after death, and the status of one's rebirth depends on the deeds and purity of the soul in a previous life. The Callers eschew such moralized cosmology.\n\nIn battle, Callers can channel Mana not only to summon spirits for aid, but to hurl lightning or unleash curses, a dangerous art that can consume even the wielder if misused.\n","pics":[{"file":"art/wiki/organization/the-callers-1.webp","caption":"The Callers"}]},{"id":"organization/the-nature-priests-of-māla-iki","group":"organization","title":"Nature Priests of Māla Iki","file":"lore/organization/the-nature-priests-of-māla-iki.md","state":"ok","md":"# Nature Priests of Māla Iki\n\nIn [Māla Iki](../location/māla-iki-islands.md) there is an old spiritual order known as the Priests of Māla whose temple is the forest itself. They practice [Māla](../organization/māla.md) , a syncretic variation of [Anúa](../organization/anúa.md) , the native faith of the people of Nuitai. Anúa teaches that the natural world itself is divine, and that the people and animals that inhabit it are spirits themselves. Everything from the rocks to the trees to the clouds themselves are imbued with [Mana](../law/mana.md), a spiritual force that permeates the universe, the source of all magic.\n\nThe Priests of Māla bow to the world and to themselves, and practice slow and gentle, sacred ritual dances, marked by gestures such as spinning in circles and raising one’s arms from the ground to the sky, to encourage the growth of crops and the healing of wounds. They don green and yellow robes to honor the sun and the forests, and white to honor the sky.\n\nThe Priests of Māla once revered only [Lanu](../god/lanu.md) , an [Akua](../law/akua.md) whose domain is the sun, the sky and the forests. When the [Bandari](../ethnicity/bandari.md) missionaries arrived and spread the teachings of [Shaka](../god/shaka.md) , the people of Māla Iki were receptive, they did not believe this religion that spoke of the purifying power of the sun’s light, the cycle of death and rebirth, and the interconnectedness of all things, contradicted their Anuic beliefs. It helped that the missionaries did not belittle or disrespect their native beliefs, in fact they seemed quite curious about them. The result was Māla a spiritual practice that synergized the beliefs of Anua and worship of Lanu with the teachings of Shaka, who they accepted as [La](../god/la-lanu.md) , an Akua Iki born of Lanu’s light, integrating his teachings into their veneration of the natural world.. They donned the crest of Shaka’s sun but still danced in the forest.\n\nHowever, some priests rejected the identification of Shaka as La, seeing it as a foreign incursion and a corruption of Lanu’s light, and broke off into a separate sect known as the [Maki Sages](../organization/maki-sages.md).\n","pics":[{"file":"art/wiki/organization/the-nature-priests-of-mala-iki-2.webp","caption":"Nature Priests of Māla"},{"file":"art/wiki/organization/the-nature-priests-of-mala-iki-1.webp","caption":"Māla Priests and Maki Sages"}]},{"id":"organization/the-penyamun","group":"organization","title":"Penyamun","file":"lore/organization/the-penyamun.md","state":"ok","md":"# Penyamun\n\nThe Penyamun are the shadow network of [Bandar](../organization/bandar.md). They have dens of agents in [Kota Emas](../settlement/kota-emas.md) and the [Bayang Seas](../location/bayang-seas.md), their influence felt mostly in the western half of Nuitai. They are operators of stealth for hire. Spies, assassins and thieves. If you need something dirty done quietly, you have the coin, but don't have the morals, you contact the Penyamun. They steal secrets and goods for clients, smuggle information and contraband (if small) between ports, carry out quiet “removals” when a client needs someone gone, and maintain an invisible influence over city politics through bribery, blackmail, and espionage. As there is some overlap in their domains, mostly to do with smuggling and thievery, Penyamun have been known from time to time to clash with the lanun of Nuitai, the pirates of the [Bayang Seas](../location/bayang-seas.md). While the Penyamun carry out their orders quietly, professionally, in an organized structure, pirates are a loud and rowdy that answer to no one and take what they want on the seas by cannon fire. Due to their agility, the Vanara variety of the [Bandari](../ethnicity/bandari.md) people are common among their ranks.\n","pics":[{"file":"art/wiki/organization/the-penyamun-1.webp","caption":"Shadow Guild Spies"}]},{"id":"organization/the-teachings-of-shaka","group":"organization","title":"Teachings of Shaka","file":"lore/organization/the-teachings-of-shaka.md","state":"ok","md":"# Teachings of Shaka\n\nThe Teachings of Shaka form the foundation of a major faith originating in the country of [Bandar](../organization/bandar.md), west of Nuitai. The religion centers on the moral and spiritual philosophy attributed to [Shaka](../god/shaka.md), a mortal teacher whose illumination two thousand years ago revealed the nature of recurrence, defined moral conduct, and paved a path of liberation from the cycle of physical existence. This religion is a moral reinterpretation, and sometimes considered a branch, of the much older [Sarpic](../organization/sarpa.md) tradition.\n\n### Core Beliefs\n\nAccording to Shaka’s teachings, all souls, [Atoma](../law/mana.md), are continuously recycled upon death. Life and death form a single, unbroken spiral of recurrence. While recurrence was a novel concept to the Nuitagata before the arrival of the Bandari, it was already a core cosmological assumption in Bandar for centuries before Shaka merely framed the Spiral as a prison that could be escaped by following the moral path he described. By devoting oneself to the principles taught by Shaka, the believer may escape this cycle and be reborn into Shaka’s realm of light, a paradise beyond material existence.\n\nTemples, ritual observances, and pilgrimages structure daily life. The religion provides moral guidance, communal cohesion, and a framework for understanding both life and the mysteries of death.\n\nIn Nuitai, the principal site of pilgrimage is [Kota Emas](../settlement/kota-emas.md), and it is customary for worshipers to bow in its direction during daily prayer.\n\n### Spread and Syncretism\n\nWhen the [Bandari](../ethnicity/bandari.md) first arrived in Nuitai, they settled on the golden coasts of the Matahari islands and founded the settlement of Kota Emas. From there the teachings slowly spread to the islands surrounding the [Great Maelstrom](../location/the-great-maelstrom.md) through trade and missionary activity, and were adapted by many of the island cultures of Nuitai.\n\nThe peoples of Māla Iki, the Lanuloa Archipelago, and the [Matahari Archipelago](../location/matahari-archipelago.md) integrated the new faith with their native Anuic traditions, some incorporating Shaka as an Akua Iki of light and moral order, identifying him with [La Lanu](../god/la-lanu.md).\n\nThe [Kame](../species/kame.md) adopted his doctrines and integrated it with their discipline of [Wai'Ki](../organization/waiki.md), emphasizing meditation and personal mastery.\n\nIn contrast, the [Matua Archipelago](../location/the-matua-archipelago.md) and the [Velafi](../location/velafi.md) rejected Shaka’s teachings altogether, maintaining adherence to older [Anuic](../organization/anúa.md) and ancestral practices.\n\nThis contact produced a wide range of syncretic variations across Nuitai, collectively referred to as the Shakan Paths.\n\n### Schools of Thought\n\nAs the religion matured in its originating country of Bandar, two principal interpretations developed: one devotional and exoteric, the other philosophical and introspective. Both claim continuity with the original [Bandari](../ethnicity/bandari.md) scriptures but differ in emphasis and method.\n\n#### The Path of the Golden Sun\n\nThe most widespread form of the faith, often practiced by the general population of both Bandar and Nuitai. It emphasizes devotion, ritual purity, and salvation through Shaka’s grace. Followers believe that moral conduct, prayer, and pilgrimage lead the soul to be reborn into Shaka’s realm. Communal worship, purification rites, and festivals of light are central to practice.\n\nThis path is the foundation for most syncretic expressions of the religion across Nuitai, where it has blended with local beliefs and Akua worship. Soteriological and comforting in nature, it is no wonder that this version of the teachings spread like wildfire among the poor and downtrodden masses.\n\nFor the native Nuitagata of the northeast in particular, Shaka has literally ascended to the status of an Akua and joined as a newcomer to the traditional pantheon, representing the light of the sun, previously the domain of [Lanu](../god/lanu.md), the goddess of life and nature. While the Path of the Golden Sun is more common than its counterpart everywhere, it has an even stronger foothold in the eastern half of Nuitai where the native population is largest, particularly in [Māla Iki](../location/māla-iki-islands.md), the [Lanuloa Archipelago](../location/the-lanuloa-archipelago.md).\n\n#### The Path of the Polished Mirror\n\nA less common but influential school focused on personal cultivation and direct understanding. Adherents teach that enlightenment is achieved not through divine intervention but through inner realization of truth. The “mirror” symbolizes the mind cleared of illusion, reflecting the world as it truly is.\n\nThe Path of the Polished Mirror appeals primarily to scholars, mystics, and individuals of education or privilege. It is particularly associated with urban centers such as **Kota Emas** and with the **Kame**, who have incorporated its principles into their discipline of Wai’Ki.\n\nThis school does not deny the existence of Shaka’s realm but interprets it as a metaphor for awakening, the state in which the individual perceives the unity of all things and transcends recurrence through understanding rather than faith. Some even go as far to as claim that Shaka himself was no different than any mortal and did not ascend himself, treating the teachings more as philosophy than faith, although this strictly secular interpretation is a minority view even within the Path of the Polished Mirror itself, and traditionalists of these school accuse the secular minority of giving the Polished Mirror a heretical reputation.\n\nThe Path of the Polished Mirror is more common in the cosmopolitan western half of Nuitai, where the settled Bandari population is largest, particularly in Kota Emas. This is the school of Shaka's teachings that the Kame integrated into their practice of Wai'Ki, the shelled inhabitants of the Kame Kingdom found its patient contemplative nature more fitting to their world view and way of life.\n\n### Contemporary Practice\n\nToday, both paths coexist across the Maelstrom. The more common Path of the Golden Sun dominates public and rural worship all over Nuitai, while the more esoteric Path of the Polished Mirror persists in monasteries, academic circles, and the higher clergy in cosmopolitan Kota emas.\n\nDoctrinal disputes between the two schools are rare but enduring. In history, their relationship wasn’t purely antagonistic or separate; it was fluid, overlapping, and occasionally tense. Both paths still honor Shaka and follow the same core doctrines, and it is not uncommon for adherents might move between both paths over a lifetime.\n","pics":[{"file":"art/wiki/organization/the-teachings-of-shaka-1.webp","caption":"The Path of the Golden Sun"},{"file":"art/wiki/organization/the-teachings-of-shaka-2.webp","caption":"The Path of the Polished Mirror"}]},{"id":"organization/the-witch-doctors","group":"organization","title":"Witch Doctors","file":"lore/organization/the-witch-doctors.md","state":"ok","md":"# Witch Doctors\n\nThe Ki’Ata Witch Doctors of the Matua Archipelago are master alchemists, perhaps the most gifted in all of Nuitai. Using only what nature provides, such as herbs, minerals, and sea-borne reagents, they can craft elixirs that heal or harm, revive or ruin. Their work blurs the line between life and death. With a mortar, pestle, and bottle, a skilled Witch Doctor can draw a soul back from the brink or brew poisons that bring agony worse than dying. Like the hunters of [Velafi](../location/velafi.md), the Ki’Ata embrace both creation and destruction, embodying the eternal balance of Mana. Their art is feared but necessary, for in the Matua Archipelago, death is never far away.\n","pics":[{"file":"art/wiki/organization/the-witch-doctors-1.webp","caption":"The Witch Doctors"}]},{"id":"organization/waiki","group":"organization","title":"WaiKi","file":"lore/organization/waiki.md","state":"ok","md":"# WaiKi\n\nThe religion of the [Kame](../species/kame.md) people, [Anúic](../organization/anúa.md) in nature but with an emphasis on the sanctity of water, springs, and natural flow. They believe water is the source of all life. The teachings of Wai'Ki emphasize attuning oneself to the effortless patterns of life, living in harmony with nature, moving with rather than against the currents, and cultivating a quiet understanding and acceptance of the world without judgement. This has led some to believe the [Kame](../species/kame.md) to be too complacent. Naturally, they place great importance on the protection, sanctity and reverence of the springs and grottos of their islands, which is a task the Wai’Ki Wardens, also known as the spring guardians or grotto guardians, are charged with maintaining. The Wai’Ki Wardens themselves are masters of defense and the healing arts.\n\nDespite their recognition of the permeation of [Mana](../law/mana.md) (which they call \"Ki\"), the [Kame](../species/kame.md) have their own pantheon separate from the traditional [Akua](../law/akua.md) of the rest of Nuitai. There are analogs to be observed between the chelonian gods and the more common [Akua](../law/akua.md) , with some overlap. For example; they worship two separate gods of their own that represent aspects of what is considered ’s domains, the ocean mother and the father of death. But the pantheon of the [Kame Kingdom](../organization/kame-kingdom.md) is occupied by beings that look much like turtles, as one might expect, if the statues carved into the rock faces are anything to go by.\n\nWhen the [Bandari](../ethnicity/bandari.md) missionaries arrived in the [Kame Kingdom](../organization/kame-kingdom.md), after they recovered from the shock of meeting giant turtle people who can talk and bow like normal people, and spread the teachings of Shaka, the [Kame](../species/kame.md) were receptive and open minded but slow to accept this new religion, but over time allowed temples to be built on their islands and the teachings to be practiced freely. Followers of the teachings of Shaka make up a significant portion of the [Kame](../species/kame.md) people, and those who do walk the path of Shaka have successfully integrated these new beliefs with the old Wai’Ki practice of reverence for the springs, bowing to Shaka in the temples and bowing to the springs in the caves. This was not a difficult transition as the practices of mindfulness, meditation and the acceptance of the spiral of death were recognizable to the [Kame](../species/kame.md), what changed was the soteriological emphasis on moral conduct, how actions in this life dictate the next, and an organizational structure that bowed in the direction of [Kota Emas](../settlement/kota-emas.md) and [Bandar](../organization/bandar.md).\n","pics":[{"file":"art/wiki/organization/waiki-1.webp","caption":"Wai'Ki, the Faith of the Springs"}]},{"id":"law/akua","group":"law","title":"Akua","file":"lore/law/akua.md","state":"ok","md":"# Akua\n\nThe Akua are the gods of Nuitai. They are personifications or great spirits that embody aspects of [Mana](../law/mana.md). The three primary Akua Nui that traditionally represent the head of the Nuitai pantheon are [Lanu](../god/lanu.md), the goddess of life and nature, [Mauga](../god/mauga.md), the goddess of fire and change, and [Moanatu](../god/moanatu.md), the god of the sea and death.\n\nIn the world of Nuitai, there are beings regarded as being halfway between the three great Akua Nui and mortals. They are known as the Akua Iki. Sometimes referred to as “demi-gods,” they each embody an aspect or “piece” of a greater Akua Nui. [Hau](../god/hau.md) is the wind, [Matei](../god/matei.md) is the transition from life to death, [La](../god/la-lanu.md) is the sun and it's light.\n\nAkua Iki can take mortal form and interact with mortals, they have magic powers and can pop in and out of existence. They are not stable, some walking the world for centuries before splitting or merging with other Akua Iki. Some are merged aspects of two or all three of the Akua Nui.\n\nThe [Kame](../species/kame.md) have their own pantheon of Akua which they refer to as the Kamekami.\n","pics":[{"file":"art/wiki/law/akua-1.webp","caption":"The Three Great Akua"}]},{"id":"law/laniakea","group":"law","title":"Laniakea","file":"lore/law/laniakea.md","state":"stub","md":"# Laniakea\n\nThe [Nuitai’lo](../language/nuitailo.md) word for the cosmos and everything in it.\n","pics":[{"file":"art/wiki/law/the-spiral-1.webp","caption":"The Spiral"}]},{"id":"law/mana","group":"law","title":"Mana","file":"lore/law/mana.md","state":"ok","md":"# Mana\n\n> \"Stand still and you are a stone. Stones do not burn.\"\n> *A Lelua teacher in Velafi, to a new student*\n\n**Mana** is the current that moves through everything in [Laniakea](../law/laniakea.md). Waves, wind, growth, fire and thought are all carried by it. Mana is never created or destroyed; it only moves from one place and form to another.\n\nEvery people of Nuitai knows it under some name. The [Kame](../species/kame.md) call it **Ki**. The [Bandari](../ethnicity/bandari.md) call it **Kolindala** and, following [Sarpa](../organization/sarpa.md), treat it as separate from the individual soul, the **Atoma**. To the Nuitagata, both are Mana.\n\n## Mana and the gods\n\nThe [Akua](../law/akua.md) are vast gatherings of Mana that each embody a force of nature. No god holds Mana itself. In the Anuic view the gods are made of it.\n\n## Channeling\n\nPeople use Mana by feeling the current and moving with it. Movement made in time with the flow adds to it, the way a push at the right moment sends a swing higher. Different kinds of movement give different effects, and breathing is part of every technique.\n\nMost people who channel learn a dance or a martial art and become stronger, faster or harder to hurt. A rare few masters can throw fire or lightning with almost no movement at all, and the greatest can channel through breath alone. Channeling costs stamina, and drawing past one's limit can leave a person bedridden or dead. See [Channeling](../technology/channeling.md).\n\n## Where Mana gathers\n\nThe Nuitagata hold that Mana collects where it is used. Each time a person channels, a little of the current stays with them, so a master or a great chief carries more of it, and others can feel it. Objects gather it the same way: a canoe of a thousand voyages, a club carried through a hundred fights, a family heirloom.\n\nThe [Velafi](../location/velafi.md) and the [Matua](../location/the-matua-archipelago.md) also believe gathered Mana can be taken. Defeating a champion or stealing an heirloom takes what was gathered in it, and breaking a tapu scatters it back into the flow. The [Lanuloa](../location/the-lanuloa-archipelago.md) do not hold this view.\n\nThe Bandari do not believe Mana gathers in people or gives them authority. In [Kota Emas](../settlement/kota-emas.md), authority belongs to the city's government and the temple of Shaka, not to whoever carries the most Mana, although the temple's high priests are among the strongest channelers in the city.\n\n## Mana in stone\n\nThe [Lanigata](../ethnicity/lanigata.md) carved glyphs into stone that bound Mana inside it. The stones they carved, the [Pōhaku](../species/pohaku.md), still move today, ten thousand years after the Lanigata vanished. Nobody knows how this works. Mana responds only to motion, and stone does not move on its own. See [Stone Speech](../article/stone-speech.md).\n\n## Mana and the dead\n\nEach tradition gives its own account of what happens to a person's Mana at death, and each can point to something that supports it.\n\n- **Anúa.** At death a person's Mana is released and taken up by what lives on around them: the soil, the sea, the next things to grow. See [Anúa](../organization/anúa.md).\n- **The Teachings of Shaka.** The Atoma is reborn again and again along the [Spiral](../law/the-spiral.md). A life of devotion and moral purity lets it be reborn instead into the [Light Realm](../location/the-light-realm.md), Shaka's own realm. See [Teachings of Shaka](../organization/the-teachings-of-shaka.md).\n- **The Callers of Matua.** The dead remain themselves in [Moanatu](../god/moanatu.md)'s realm, and come when called. Summoned, they do not speak; they point, go back to where something happened, or act out a moment. See [Callers](../organization/the-callers.md).\n\nPeople outside the Caller tradition often read the summoned dead as echoes rather than the dead themselves.\n","pics":[{"file":"art/wiki/law/mana-1.webp","caption":"Mana in Motion"}]},{"id":"law/the-spiral","group":"law","title":"Spiral","file":"lore/law/the-spiral.md","state":"empty","md":"# Spiral\n","pics":[{"file":"art/wiki/law/the-spiral-1.webp","caption":"The Spiral"}]},{"id":"language/bandhasa","group":"language","title":"Bandhasa","file":"lore/language/bandhasa.md","state":"ok","md":"# Bandhasa\n\nThe language of the [Bandari](../ethnicity/bandari.md) people. There are regional variations between the north and south of the [Matahari Archipelago](../location/matahari-archipelago.md), as well as distinct dialects spoken in [Kota Emas](../settlement/kota-emas.md) and the [Bayang Seas](../location/bayang-seas.md).\n\nBandhasa has a smooth, syllable-timed rhythm that is evenly paced, and can be described as almost musical in nature. The vowels are as clear and consistent as golden bells ringing in time, and the consonants are generally soft and not heavily aspirated.\n\nThe overall sound of Bandhasa is smooth and gentle on the ear. For many listeners, it comes across as calm, deliberate, and friendly, with a melodic balance that mirrors its simplicity in structure and the clarity Bandari culture strives for.\n"},{"id":"language/glossary","group":"language","title":"Glossary","file":"lore/language/glossary.md","state":"ok","md":"# Glossary\n\nThe words a reader meets across Nuitai, what they mean, and how to say them. Most come from\n[Nuitai'lo](nuitailo.md), the language of the islands. A few come from\n[Bandhasa](bandhasa.md), the language of the [Bandari](../ethnicity/bandari.md) in the west.\n\n## How Nuitai'lo sounds\n\nEvery syllable in Nuitai'lo is one consonant followed by one vowel. Two consonants never sit\nside by side, which is why the words run long and soft: *kawaki*, *toguma*, *ahimahana*.\n\n- An apostrophe is a catch in the throat, the small stop in the middle of \"uh-oh.\" *Pua'a* is\n  said \"poo-ah-ah,\" with a stop before the last syllable.\n- A line over a vowel, as in *ā* or *ō*, makes it long.\n- Every **h** is said out loud.\n- In names from [Velafi](../location/velafi.md), **g** is said \"ng.\" *Leilagi* sounds like\n  \"Leilangi.\"\n\nBandhasa does not follow these rules, which is one easy way to tell a Bandari name from an\nisland one: *Karvara*, *Damar*, *Kota Emas*.\n\n## The three accents\n\nNuitai'lo is spoken with three accents along the arc of the islands. The same word changes a\nlittle depending on who says it.\n\n| | The east (Māla Iki and Lanuloa) | Velafi | Matua |\n|---|---|---|---|\n| Where Matua says **t** | k | t | t |\n| Where Matua says **k** | a catch, ' | a catch, ' | k |\n| Where Matua says **ng** | n | ng, written g | ng |\n| Where Matua says **r** | l | l | r |\n| Where the others say **w** | w | v | w |\n\n[Matua](../location/the-matua-archipelago.md) keeps the oldest sounds. The east is the softest.\nSo the word for the gods is *Akua* in the east and *Atua* everywhere else, and water is *Wai*\nuntil someone from Velafi calls it *Vai*.\n\nA name is written the way its home region says it. In conversation, though, everyone uses\ntheir own accent. [Tawiri](../person/tawiri-the-elderly-caller.md) is from Matua and calls\nherself Tawiri, and [Kailo](../person/kailo-the-wandering-chef.md), from the east, calls her\n*Kawili*. Neither of them is wrong.\n\n| Name | The east | Velafi | Matua |\n|---|---|---|---|\n| [Kailo](../person/kailo-the-wandering-chef.md) | **Kailo** | Tailo | Tairo |\n| [Maika](../person/maika-the-maki-sage.md) | **Maika** | Maita | Maita |\n| [Hina](../person/hina-the-māla-priestess.md) | **Hina** | Sina | Hina |\n| [Tawiri](../person/tawiri-the-elderly-caller.md) | Kawili | Tavili | **Tawiri** |\n| [Leilagi](../person/leilagi-the-huntress.md) | Leilani | **Leilagi** | Reirangi |\n| [Olola](../person/olola-the-fire-dancer.md) | Olola | **Olola** | Orora |\n| [Kiki](../person/kiki-the-witch-doctor.md) | Kiki | 'I'i | **Kiki** |\n| [Māla Iki](../location/māla-iki-islands.md) | **Māla Iki** | Māla Iti | Māra Iti |\n| [Lanuloa](../location/the-lanuloa-archipelago.md) | **Lanuloa** | Lanuloa | Lanuroa |\n| [Velafi](../location/velafi.md) | Welahi | **Velafi** | Werahi |\n| [Matua](../location/the-matua-archipelago.md) | Makua | Matua | **Matua** |\n| [Kulāiwi](../settlement/kulāiwi.md) | **Kulāiwi** | Tulāivi | Turāiwi |\n| [Tokelau](../location/tokelau---the-north-sea.md) | Ko'olau | To'elau | Tokerau |\n| Nuitai | Nuikai | Nuitai | Nuitai |\n| [Mauga](../god/mauga.md) | Mauna | **Mauga** | Maunga |\n| [Moanatu](../god/moanatu.md) | Moanaku | Moanatu | **Moanatu** |\n| [Ngaro](../god/ngaro.md) | Nalo | Galo | **Ngaro** |\n\nThe spelling in bold is the one used in writing, the home region's own.\n\n## Word roots\n\nMost Nuitai'lo words are built from a few short roots. Knowing them makes the names readable.\n\n| Root | Meaning |\n|---|---|\n| **ahi** | fire |\n| **ata** | shadow |\n| **gata** | person, people. Used for races and species, never for a culture |\n| **haku** | something made: a golem, a construct |\n| **kua** | death, the ancestors, the past |\n| **la** | light, life, the sun |\n| **lani** | sky, the heavens |\n| **lau** | nature, growing things |\n| **lelo**, **'lo** | speech, language |\n| **mā** | magic |\n| **mana** | spirit, spiritual energy |\n| **nui** | great, big, lasting |\n| **pō** | stone |\n| **tai** | the sea, the tide, the coast |\n| **wai** | water |\n\n## Words built from the roots\n\n| Word | Meaning | Made of |\n|---|---|---|\n| **Nuitai** | \"Endless Ocean,\" the world itself | nui + tai |\n| **Nuitai'lo** | \"sea speech,\" the islanders' language | Nuitai + lelo |\n| **[Nuitagata](../ethnicity/nuitagata.md)** | the people of Nuitai | Nuitai + gata |\n| **[Lanigata](../ethnicity/lanigata.md)** | the sky people | lani + gata |\n| **Tuangata** | the ancestors, \"people of the past\" | kua + gata |\n| **Lalani** | the sun, \"light in the sky\" | la + lani |\n| **Kualani** | \"the past sky\" | kua + lani |\n| **[Laniakea](../law/laniakea.md)** | the universe and everything in it | |\n| **Māgata** | a mage or sorcerer | mā + gata |\n| **[Māla](../organization/māla.md)** | life magic; also a garden. Māla Iki means \"Little Garden\" | mā + la |\n| **Māki** | nature magic | mā + ki |\n| **Mākua** | death magic; also a parent or elder | mā + kua |\n| **Mālani** | sky magic | mā + lani |\n| **[Pōhaku](../species/pohaku.md)** | a stone golem or guardian | pō + haku |\n| **[Pōlelo](../article/stone-speech.md)** | stone speech, the glyph writing of the Lanigata | pō + lelo |\n| **[Ahi'Wai](../profession/ahiwai-warrior.md)** | elemental magic, and the fire-and-water fighting school | ahi + wai |\n| **La'gata** | \"the Founder,\" the islanders' title for [Shaka](../god/shaka.md) | la + gata |\n\n## Gods and spirits\n\n| Name | Who they are |\n|---|---|\n| **[Akua](../law/akua.md)** | the gods of the islands, all of them together |\n| **[Lanu](../god/lanu.md)** | one of the three great gods: life, nature, growth and the sky |\n| **[La Lanu](../god/la-lanu.md)** | the sun and its light, a side of Lanu |\n| **Kihana** | birth and motherhood, a side of Lanu. She walks souls into the world |\n| **[Mauga](../god/mauga.md)** | one of the three great gods: fire, volcanoes and the making of the islands |\n| **Afi** | fire itself as a spirit, a side of Mauga |\n| **[Moanatu](../god/moanatu.md)** | one of the three great gods: the stormy sea, the depths and the underworld |\n| **[Matei](../god/matei.md)** | the passage from life to death. She walks souls out of the world |\n| **[Ata](../god/ata.md)** | darkness and the fear of it. Not evil: the fear keeps you alive |\n| **[Ngaro](../god/ngaro.md)** | what is hidden in the dark: secrets, forgetting and lies |\n| **[Marama](../god/marama.md)** | the moon and the tides |\n| **Akea** | the stars, the night sky and finding your way at sea, shared by Lanu and Moanatu |\n| **[Wai](../god/wai.md)** | water |\n| **[Hau](../god/hau.md)** | the wind |\n\n## Sacred beasts\n\n| Name | What it is |\n|---|---|\n| **[Pua'Lele](../beast/pualele.md)** | a colossal rainbow-winged moth, the guardian of Māla Iki |\n| **[Mo'afi](../beast/moafi.md)** | a giant red salamander living in Velafi's largest volcano |\n| **[Moanaroa](../beast/moanaroa.md)** | a colossal glowing eel in the dark waters of Matua |\n| **[Pōhaku Nui](../beast/pōhaku-nui.md)** | the largest stone golem, taller than a mountain, circling the Great Maelstrom |\n| **[Kyoumikame](../beast/kyoumikame.md)** | the oldest giant turtle, as big as an island, in the waters of the Kame Kingdom |\n| **[Ringanaga](../beast/ringanaga.md)** | a gold and white sky serpent over Kota Emas that never lands |\n\n*Pua'a* means boar. It is also the name of the god of animals, and has nothing to do with Pua'Lele.\n\n## Places\n\nEvery place has an English name beside its own, the name an English speaker would use.\n\n| Name | In English |\n|---|---|\n| **[Māla Iki](../location/māla-iki-islands.md)** | Little Garden |\n| **[Lanuloa](../location/the-lanuloa-archipelago.md)** | the Long Lanu Islands |\n| **[Velafi](../location/velafi.md)** | the Fire Islands |\n| **[Matua](../location/the-matua-archipelago.md)** | the Ancestral Archipelago |\n| **[Matahari](../location/matahari-archipelago.md)** | the Sun Archipelago |\n| **[Kota Emas](../settlement/kota-emas.md)** | the Golden City |\n| **[Bayang](../location/bayang-seas.md)** | the Pirates' Den |\n| **[Tokelau](../location/tokelau---the-north-sea.md)** | the North Sea |\n| **[Kulāiwi](../settlement/kulāiwi.md)** | a small island in Māla Iki, and its one village |\n\n*Vela-* in front of a word means \"from Velafi.\" A *velamelon* is a melon grown there.\n\n## Peoples and faiths\n\n| Name | What it is |\n|---|---|\n| **[Nuitagata](../ethnicity/nuitagata.md)** | the islanders |\n| **[Bandari](../ethnicity/bandari.md)** | the people who came from the far west and founded Kota Emas. Islanders call them *Benali* |\n| **[Bandar](../organization/bandar.md)** | the homeland of the Bandari, far to the west. Islanders call it *Bena* |\n| **[Anúa](../organization/anúa.md)** | the native faith of the islands, which holds that everything has Mana in it |\n| **Halabena** | \"the Way of Truth,\" the islanders' name for the [Teachings of Shaka](../organization/the-teachings-of-shaka.md). The Bandari do not call it that |\n| **[Lelua](../technology/lelua.md)** | the fiery acrobatic martial art of the Velafi fire dancers |\n\nA people is named after its place: the Lanuloa, the Velafi, the Matua. The ending *-gata* is\nonly for a race or species, never for a culture.\n\n## Words from elsewhere\n\n- **Ki** is the [Kame](../species/kame.md) word for [Mana](../law/mana.md). Scholars treat\n  the two as the same thing seen through two cultures.\n- **Bayang** is Bandhasa for shadow. It also means the criminal underworld.\n\n## Names and family names\n\nNames run in two orders, split east and west.\n\nIn the west, among the Bandari and the Kame, the **family name comes first**: Kirasame Ren,\nKarvara Citra, Damar Jago, Asap Setia. Bandari go by their family name. Only close friends\nuse the given one, so to almost everyone he is Damar, and Jago only to a few.\n\nIn the east, among the islanders, the **given name comes first**, and people go by it. Every\nislander in the story so far has only the one name.\n\nThe reason is how each side keeps its records. Island family trees are sung, and a chant names\nthe person first and then traces back through the ancestors. Bandari family trees are filed in\ntemple registers, which sort by household, so the household comes first.\n\nA person raised outside the culture they were born to uses the order of the people who raised\nthem. That makes name order a tell: see [Kiki](../person/kiki-the-witch-doctor.md) and\n[the Penyamun Agent](../person/the-penyamun-agent.md).\n"},{"id":"language/malalo","group":"language","title":"Malalo","file":"lore/language/malalo.md","state":"stub","md":"# Malalo\n\nThe common language of the [Ikagata](../species/ikagata.md) peoples. Unintelligible on the surface.\n"},{"id":"language/nuitailo","group":"language","title":"Nuitai’lo","file":"lore/language/nuitailo.md","state":"ok","md":"# Nuitai’lo\n\nNuitai’lo is the language of the native [Nuitagata](../ethnicity/nuitagata.md) people. It features a consonant–vowel syllable structure, limited consonant clusters, frequent glottal stops, and a tendency toward reduplication.\n\nThree accents are heard along the arc of the islands: one in the east, across the [Māla Iki Islands](../location/māla-iki-islands.md) and [The Lanuloa Archipelago](../location/the-lanuloa-archipelago.md), one in [Velafi](../location/velafi.md), and one in [The Matua Archipelago](../location/the-matua-archipelago.md).\n\nMatua keeps the older sounds of the language. Where Matua says t the east says k. Where Matua says r, both the east and the Fire Islands say l. Where Matua and the Fire Islands say ng the east says n, and the Velafi alone say v where everyone else says w. So the word for “sun,” “day,” or “light” is La in the east and in the Fire Islands and Ra in Matua, the gods are Akua in the east and Atua everywhere else, water is Wai until a Velafi calls it Vai, and the islands that are written Matua are called Matua by the people who live on them. Neither form is wrong. Which one is heard depends on who is speaking.\n\nBefore the arrival of the [Bandari](../ethnicity/bandari.md), Nuitai’lo lacked a written form, and all record keeping was oral. The Nuitagata later adapted the Bandari script for their language, though it does not perfectly represent its sounds. A name is written the way its own region says it, and each speaker still says it in their own accent. The fire dancer Olola is from Velafi and calls herself Olola; a speaker from Matua calls her Orora. Despite this, many Nuitagata remain illiterate, reflecting broader social and historical factors rather than linguistic ones.\n"},{"id":"technology/channeling","group":"technology","title":"Channeling","file":"lore/technology/channeling.md","state":"ok","md":"# Channeling\n\n> \"Water does not hurry, and it is never late.\"\n> *A saying of Wai'Kenpō masters in the Kame Kingdom*\n\n**Channeling** is the use of [Mana](../law/mana.md). A channeler feels the current of Mana and moves with it. Movement made in time with the flow adds to it, the way a push at the right moment sends a swing higher.\n\n## Movement and breath\n\nWhat a channeler does with Mana depends on how they move. Each tradition is a set of practiced forms, and the forms decide the effect.\n\n- **[Lelua](../technology/lelua.md)**, the fire dance of [Velafi](../location/velafi.md), is fast, aggressive and unpredictable: spins, flying kicks, sudden changes of direction. Its masters produce fire.\n- **[Wai'Kenpō](../technology/waikenpō.md)**, the water fist of the [Kame](../species/kame.md), is slow, strong and circular, built on defense. Its masters move water.\n- **Sarpic mystics** of [Kota Emas](../settlement/kota-emas.md) use drumming and looping dance steps to enter a trance before they give counsel. See [Sarpa](../organization/sarpa.md).\n\nBreathing is part of every technique. It calms the channeler, sharpens focus and saves strength, and each tradition pairs its forms with its own way of breathing.\n\n## From dancers to masters\n\nMost people who channel never project anything. They learn a dance or a martial art, and Mana makes them stronger, faster, more agile or harder to hurt. This is the common use of Mana across Nuitai.\n\nFewer learn to send Mana outward: fire from the end of a kick, a heal laid on someone else, a spirit called up, a lightning strike from a [Caller](../organization/the-callers.md). The further a channeler masters a tradition, the less movement the same effect takes. A beginner dances for it; a master gestures.\n\nA rare few can channel through breath alone, since breathing is also movement. Restraining a channeler stops almost anyone. It does not stop them.\n\n## The cost\n\nChanneling costs stamina. Drawing past one's limit can leave a person bedridden for days or weeks, and it can kill. Traditions differ in how fast they spend it: Lelua burns through a dancer's strength the quickest, and slow styles like Wai'Kenpō last the longest.\n\nSome traditions carry their own risks. A Lelua dancer who loses control can burn. A Caller who summons the dead risks being possessed, or deceived by something pretending to be the dead.\n\n## Who channels\n\nEvery people of Nuitai channels, under its own name for Mana. The Kame call it **Ki**. The [Bandari](../ethnicity/bandari.md) call it **Kolindala**, and the high priests of the temple of Shaka are among the strongest channelers in Kota Emas. Among the Nuitagata, channeling is also how a person gathers Mana: each time someone channels, a little of the current stays with them. See [Mana](../law/mana.md).\n"},{"id":"technology/lelua","group":"technology","title":"Lelua","file":"lore/technology/lelua.md","state":"ok","md":"# Lelua\n\nLelua is the fiery acrobatic martial art performed by the fire dancers of the [Velafi](../location/velafi.md), in southeast Nuitai. Supposedly they learned it directly from [Mauga](../god/mauga.md) herself, or rather through her [Akua](../law/akua.md) Iti aspect Afi, the personification of fire. This flashy kinesthetic art doubles as both a ritual dance honoring the goddess of volcanoes and a powerful fighting style, built on momentum, heat, and pure offense.\n\nIn combat, Lelua has almost no static defense. Its protection comes from constant motion, evasive spins, feints, and the sheer unpredictability of the user. It is fast, aggressive, and overwhelming by design.\n\nLelua reflects the nature of fire. It is explosive, unpredictable, emotional, and always moving. Practitioners channel emotions such as passion, rage, excitement, and raw will into their motions. There is no emphasis on blocking or guarding. The style is meant to overwhelm and confuse opponents through speed, intensity, and constant forward pressure. In its ritual forms, Lelua serves as an expression of devotion to Mauga, celebrating destruction, creation, and transformation. In battle, those same movements translate directly into devastating strikes.\n\nVisually, Lelua is defined by acrobatic, dance-like motion. Practitioners rely on spins, rapid twirls, flying kicks, somersaults, cartwheels, falls, rolls, and sudden changes in direction. These movements build momentum for powerful attacks and make the fighter difficult to predict or pin down. Even without magic, Lelua is famous for being flashy, fast, and dangerous. It is also a very difficult martial art to master. Fire dancers train and fight barefoot, and walking across hot coals is part of that training, on islands where everyone else wears sandals against the lava rock.\n\nMost practitioners of Lelua use [Mana](../law/mana.md) simply to enhance their strength, stamina, and agility. Devotional fire dancers, however, have refined their bodies and spirits enough to literally produce fire through movement. Transforming Mana into magic, flame bursts forth at the end of kicks, punches, or landings, and skilled dancers can even ignite their own bodies for short periods. This power carries real risk. The same fire that empowers them can consume them if they lose control. Much as the [Callers](../organization/the-callers.md) risk possession when they call the dead, an untrained dancer who channels Mana as fire can set themselves alight.\n\nLelua is traditionally an unarmed form of combat, but it adapts well to lightweight weapons. With [Bandari](../ethnicity/bandari.md) influence in the last century or so, fire dancers have been known to use swords, staffs, throwing knives, and other tools, lighting them on fire during performances or combat. These weapons are handled with the same acrobatic flair as the unarmed forms, sometimes juggled, spun, or thrown with impressive showmanship. While the people of the Fire Islands rejected Bandari religion and culture, they saw the utility of steel and adapted it to their martial arts.\n\nThe Fire Islands are famous throughout Nuitai for their fire dancers, and travelers sometimes encounter Lelua performers far from home. They can be seen as street performers as far west as [Kota Emas](../settlement/kota-emas.md) . Some are trained dancers, others are simply enthusiasts who learned bits of the style abroad. Either way, a Lelua performance is something unforgettable: intense, bright, and impossible to ignore.\n","pics":[{"file":"art/wiki/profession/fire-dancer-1.webp","caption":"Fire Dancers"}]},{"id":"technology/sila","group":"technology","title":"Sila","file":"lore/technology/sila.md","state":"stub","md":"# Sila\n\nA sword-based martial art developed in [Bandar](../organization/bandar.md).\n","pics":[{"file":"art/wiki/profession/bandari-zealot-1.webp","caption":"Zealots of the Sun"}]},{"id":"technology/waikenpō","group":"technology","title":"Wai’Kenpō","file":"lore/technology/waikenpō.md","state":"ok","md":"# Wai’Kenpō\n\nInspired by the flow and motion of water. Wai’Kenpō, or \"The Way of the Water Fist\" is a famous martial art, with a philosophy of self defense over attack, and has spread its influence throughout Nuitai, however none are as proficient at it as the [Kame](../species/kame.md) themselves, and only spellcasters who harness the power of [Mana](../law/mana.md) can hope to break the defense of their most skilled martial artists. Wai’Kenpō was developed by devout practitioners of [Wai'Ki](../organization/waiki.md).\n","pics":[{"file":"art/wiki/profession/waiki-warden-1.webp","caption":"Spring Wardens"}]},{"id":"ritual/charu","group":"ritual","title":"Charu","file":"lore/ritual/charu.md","state":"ok","md":"# Charu\n\nCharu is a strategy board game invented in Bandar. Popular among the Bandari, one can find old men playing Charu in the parks of Kota Emas, or among bored sailors on long voyages. Unlike Kaigara, in which pieces are placed and stay their to build territory, Charu is played with carved pieces that move around the board attacking other pieces, each piece is unique and has different abilities and possible moves it can make. Players capture their opponents pieces and the game ends when one player captures the opponents \"general.\" The most powerful piece on the board is the Luminary, which can move in any direction and be called back to the board under special circumstances, but is not the piece that decides the game.\n\nCharu is a faster and more dynamic game than Kaigara, and while cheap travel versions are common, one can find expensive and elaborate Charu sets in the noble shops of Kota Emas where pieces are made of marble, obsidian, jade or even gold. A start contrast to games of Kaigara where even the king of the Kame Kingdom is known to play with simple cowrie shells and chalk.\n","pics":[{"file":"art/wiki/ritual/charu-1.webp","caption":"Charu, the Strategy Game"}]},{"id":"ritual/kaigara","group":"ritual","title":"Kaigara","file":"lore/ritual/kaigara.md","state":"ok","md":"# Kaigara\n\nKaigara, also known as \"Shells\", is a popular game invented by the slow moving [Kame](../species/kame.md) of the [Kame Kingdom](../organization/kame-kingdom.md). It is played on a smooth stone surface with a grid drawn in chalk, where players put down black and white cowrie shells to try and capture their opponents shells. It is a game that requires strategy and patience. Some [Kame](../species/kame.md) have been known to play the same game for years.\n","pics":[{"file":"art/wiki/ritual/kaigara-1.webp","caption":"Kaigara, the Shell Game"}]},{"id":"ritual/undang-laut","group":"ritual","title":"Undang Laut","file":"lore/ritual/undang-laut.md","state":"stub","md":"# Undang Laut\n\nThe law of the ocean, pirate code of the Bayang Seas.\n","pics":[{"file":"art/wiki/ritual/undang-laut-1.webp","caption":"Undang Laut, the Pirate Code"}]},{"id":"profession/ahiwai-warrior","group":"profession","title":"Ahi’Wai Warrior","file":"lore/profession/ahiwai-warrior.md","state":"ok","md":"# Ahi’Wai Warrior\n\nAhi’Wai Warriors are masters of martial arts. They combine the fiery offense of [Lelua](../technology/lelua.md) with the fluid defense of [Wai’Kenpō](../technology/waikenpō.md) to become the ultimate physical fighters, changing stances when necessary. They are a strong matchup against enemies that rely on purely physical combat, as well as **Lau **and **Ahi **type enemies.\n\n**Elements:** **Ahi **and **Wai**\n\n**Roles: **Physical Fighter and Defender\n\n**Casting Method: **Martial Arts\n\n**Augments: ****Ahi ****→ ****Wai **physical damage\n\n**Abilities:**\n\n- Counterattack\n\n- Taunt/Provoke\n\n- Burning Weapons\n","pics":[{"file":"art/wiki/profession/ahiwai-warrior-1.webp","caption":"Ahi'Wai Warrior"}]},{"id":"profession/bandari-zealot","group":"profession","title":"Bandari Zealot","file":"lore/profession/bandari-zealot.md","state":"empty","md":"# Bandari Zealot\n","pics":[{"file":"art/wiki/profession/bandari-zealot-1.webp","caption":"Zealots of the Sun"}]},{"id":"profession/cindaku-heretic","group":"profession","title":"Cindaku Heretic","file":"lore/profession/cindaku-heretic.md","state":"empty","md":"# Cindaku Heretic\n","pics":[{"file":"art/wiki/profession/cindaku-heretic-1.webp","caption":"Cindaku Heretic"}]},{"id":"profession/fire-dancer","group":"profession","title":"Fire Dancer","file":"lore/profession/fire-dancer.md","state":"empty","md":"# Fire Dancer\n","pics":[{"file":"art/wiki/profession/fire-dancer-1.webp","caption":"Fire Dancers"}]},{"id":"profession/lanun-pirate","group":"profession","title":"Lanun Pirate","file":"lore/profession/lanun-pirate.md","state":"empty","md":"# Lanun Pirate\n","pics":[{"file":"art/wiki/profession/lanun-pirate-1.webp","caption":"Pirates of the Shadow Seas"}]},{"id":"profession/lau-mauga-hunter","group":"profession","title":"Lau Mauga Hunter","file":"lore/profession/lau-mauga-hunter.md","state":"empty","md":"# Lau Mauga Hunter\n","pics":[{"file":"art/wiki/profession/lau-mauga-hunter-1.webp","caption":"Jungle Hunters"}]},{"id":"profession/maelstrom-navigator","group":"profession","title":"Maelstrom Navigator","file":"lore/profession/maelstrom-navigator.md","state":"empty","md":"# Maelstrom Navigator\n","pics":[{"file":"art/wiki/profession/maelstrom-navigator-1.webp","caption":"Maelstrom Navigator"}]},{"id":"profession/maki-sage","group":"profession","title":"Maki Sage","file":"lore/profession/maki-sage.md","state":"ok","md":"# Maki Sage\n\nThe [Maki Sage](../organization/maki-sages.md) is a master of nature magic. They channel the spirits of the forest to cast powerful healing spells but also magical attacks that cause nature damage, which are especially effective against marine monsters.\n\n**Elements: ****Lau ****+ ****Mana**\n\n**Roles: **Healing and magical offense\n\n**Casting Method: **Ritual Dance\n\n**Augments:***** *****Mana*****→ *****Lau **magic damage\n\n**Special Abilities:**\n\n- Healing\n\n- Cure status ailments\n\n- Offensive **Lau **spells\n","pics":[{"file":"art/wiki/organization/maki-sages-1.webp","caption":"Maki Sages"}]},{"id":"profession/matua-caller","group":"profession","title":"Matua Caller","file":"lore/profession/matua-caller.md","state":"ok","md":"# Matua Caller\n\n[The Callers](../organization/the-callers.md) are not just necromancers. They have a respectful relationship with the dead, and spirits are not summoned against their will, but come to the caller’s aid voluntarily. These spirits are usually Matua, the ancestors of the callers. Calling on the spirits of the underworld does not come without a price however; possession is always a risk. Using dark energies, callers can do a lot of damage, casting spells that terrify and debilitate their enemies. They hold two patron [Akua](../law/akua.md): [Matei](../god/matei.md), who guides lost souls to [Moanatu](../god/moanatu.md)'s drowned realm, for the work with the dead, and [N'garo](../god/ngaro.md) for the hidden knowledge the trade depends on.\n\n**Elements: ****Mana **and** Ata**\n\n**Roles:** Magical attacker and Saboteur\n\n**Casting Method: **Ritual Dance\n\n**Augments: ****Mana ****→ Ata **magic damage\n\n**Abilities:**\n\n- Summon spirits from the [Underworld](../location/the-underworld.md)\n\n- Lightning attacks\n\n- Curses\n","pics":[{"file":"art/wiki/organization/the-callers-1.webp","caption":"The Callers"}]},{"id":"profession/māla-priest","group":"profession","title":"Māla Priest","file":"lore/profession/māla-priest.md","state":"ok","md":"# Māla Priest\n\n[The Nature Priests of Māla Iki](../organization/the-nature-priests-of-māla-iki.md) practice a syncretic religion that combines [Anúic](../organization/anúa.md) devotion to [Lanu](../god/lanu.md) with [Teachings of Shaka](../organization/the-teachings-of-shaka.md). They are pacifists who specialize in healing and protection by calling on the spirits of the forest and divine light through ritual dance.\n\n**Elements: ****Lau **and **La**\n\n**Roles: **Healing and Support\n\n**Casting Method:** Ritual Dance\n\n**Abilities:**\n\n- Healing\n\n- Cure status ailments\n\n- Regen\n","pics":[{"file":"art/wiki/organization/the-nature-priests-of-mala-iki-2.webp","caption":"Nature Priests of Māla"}]},{"id":"profession/penyamun-agent","group":"profession","title":"Penyamun Agent","file":"lore/profession/penyamun-agent.md","state":"stub","md":"# Penyamun Agent\n\nElements: **Ahi **and **Ata**\n\nRoles: Fighter and Saboteur\n\nCasting Method: ???\n\nAugments: **Ahi **→ **Ata **physical damage\n\nAbilities:\n\n- Throw\n\n- Hide\n\n- First Strike\n\n- Guarantee to run away\n","pics":[{"file":"art/wiki/person/the-penyamun-agent-1.webp","caption":"The Shadow Guild Agent"}]},{"id":"profession/shakan-priest","group":"profession","title":"Shakan Priest","file":"lore/profession/shakan-priest.md","state":"empty","md":"# Shakan Priest\n","pics":[{"file":"art/wiki/profession/shakan-priest-1.webp","caption":"Shakan Priest"}]},{"id":"profession/stone-scribe","group":"profession","title":"Stone Scribe","file":"lore/profession/stone-scribe.md","state":"empty","md":"# Stone Scribe\n","pics":[{"file":"art/wiki/profession/stone-scribe-1.webp","caption":"Stone Scribe (Stone Speech)"}]},{"id":"profession/waiki-warden","group":"profession","title":"Wai’Ki Warden","file":"lore/profession/waiki-warden.md","state":"ok","md":"# Wai’Ki Warden\n\nWai’Ki Wardens, sentinels of the sacred springs, are masters of [Wai’Kenpō](../technology/waikenpō.md); a defensive martial art developed in the [Kame Kingdom](../organization/kame-kingdom.md), inspired by the flow and motion of water. They also have a connection to and familiarity of nature that gives them knowledge of healing. This combined with their defensive martial prowess makes them invaluable for keeping any party alive.\n\n**Elements: Wai + Lau**\n\n**Roles: **Healing and Defense\n\n**Casting Method: **Martial Arts\n\n**Abilities:**\n\n- Defend while healing\n","pics":[{"file":"art/wiki/profession/waiki-warden-1.webp","caption":"Spring Wardens"}]},{"id":"profession/witch-doctor","group":"profession","title":"Witch Doctor","file":"lore/profession/witch-doctor.md","state":"empty","md":"# Witch Doctor\n","pics":[{"file":"art/wiki/organization/the-witch-doctors-1.webp","caption":"The Witch Doctors"}]},{"id":"document/shakas-animal-lives","group":"document","title":"Shakas Animal Lives","file":"lore/document/shakas-animal-lives.md","state":"ok","md":"# Shakas Animal Lives\n\n\"Shaka’s Animal Lives\" is a beloved [Bandari](../ethnicity/bandari.md) children’s book said to have been compiled centuries ago by the monk [Tamba Uli](../person/tamba-uli.md), who sought to teach the youngest initiates about the [Spiral](../law/the-spiral.md) through allegory. Each story recounts one of [Shaka](../god/shaka.md)’s earlier incarnations, sometimes as a fox or hare, sometimes as a tree learning patience or a man rediscovering kindness. Some of the animals featured in these fables are unknown outside [Bandar](../organization/bandar.md) and have since passed into legend for [Matahari](../location/matahari-archipelago.md)-born Bandari, who will never see them in their lives.\n\nOne fable has long divided readers. In early versions, Shaka appears as a clever monkey who teaches the gods humility. The tale remains controversial, as some believe Shaka himself was a Vanara Bandari, and its telling often rekindles old debates best left resting.\n","pics":[{"file":"art/wiki/document/shakas-animal-lives-1.webp","caption":"Shaka's Animal Lives"}]},{"id":"article/cindaku","group":"article","title":"Cindaku","file":"lore/article/cindaku.md","state":"ok","md":"# Cindaku\n\nThe Cindaku are not a people. They are people who have been cursed.\n\nA Cindaku is a weretiger, and like any other such affliction the curse sits on\ntop of whoever already existed. Out of transformation a Cindaku looks exactly as\nthey always did, because they are exactly who they always were: a\n[Manusia](../ethnicity/bandari.md) clerk, a [Vanara](../ethnicity/bandari.md)\ndockhand, a [Nuitagata](../ethnicity/nuitagata.md) fisherman. There is no Cindaku\nface, no Cindaku build, and no Cindaku bloodline you could point to in a crowd.\nAnyone can become one. That is the entire problem with them.\n\nThe transformation is triggered by a clear sunny day on which the moon is not in\nthe sky. Brought from [Bandar](../organization/bandar.md) by someone already\ncursed aboard the first crossing, the curse is now found chiefly among\nthe Bandari population of the\n[Matahari Archipelago](../location/matahari-archipelago.md), which is the sea of\nthe setting sun and cloudless for much of the year.\n\n## Why it is a religious catastrophe and not a medical one\n\nA Nuitagata village that acquires a weretiger has acquired a dangerous animal\nproblem, and treats it as one. The\n[Callers](../organization/the-callers.md) of Matua have a word for the cursed and\na procedure for restraining them, and under [Anúa](../organization/anúa.md) a man\nwho becomes a tiger has been visited by something, which is frightening but not\nshameful.\n\nAmong the Bandari it is a different matter entirely, and the difference is\ndoctrinal. [The Teachings of Shaka](../organization/the-teachings-of-shaka.md)\nhold the sun to be Shaka's light, the same light as his\n[realm](../location/the-light-realm.md), and the Bandari of Matahari understand\ntheir presence on these islands as a blessing granted under it. The curse takes a\ndevout Shakan and makes him a beast on precisely the days that light is\nunobstructed, and spares him under cloud and moon. A faith that reads clear\nweather as favour cannot read that as anything but judgement.\n\nSo the clergy of Kota Emas do not treat the Cindaku as sick. They treat them as\nfound out. Excommunication follows, and the curse is held to be a visible verdict\non a hidden sin, which conveniently removes any obligation to ask what the sin\nwas. Those cast out are recorded in the temple registers as heretics regardless\nof what they profess, which is how a man can be excommunicated for a condition\nand still consider himself a believer. See\n[Karvara Citra, the Apostate](../person/karvara-citra-the-apostate.md), who is\none.\n\nNot everyone accepts the reading. The [Maki Sages](../organization/maki-sages.md)\nobserve that the curse crosses the water to Nuitagata who have never heard of\nShaka and are therefore in no position to have offended him, and that a verdict\nwhich falls on the ignorant is not a verdict. Shakan scholars answer that the\ncurse originated in Bandar and travels with Bandari, which is a claim about\nshipping rather than theology, and the Sages say so.\n\n## What is not settled\n\nHow the curse passes is not agreed upon, and no authority in Nuitai can compel\nthe others to its view. The temple holds it inherited, which makes it a family\nmatter and justifies watching the relatives of the cast out. The\n[Archaeological Society](../organization/archaeological-society-of-kota-emas.md)\nhas argued it spreads by the bite, like an illness, which would make it a problem\nof quarantine and not of sin. The\n[witch doctors](../organization/the-witch-doctors.md) of Matua say it is laid, not\ncaught, and will quote a price for laying one.\n\nThese positions cannot all be right, and the disagreement is load-bearing. It is\nthe reason no two ports handle a Cindaku the same way.\n","pics":[{"file":"art/wiki/species/cindaku-1.webp","caption":"Weretigers (Cindaku)"}]},{"id":"article/element-job-system","group":"article","title":"Element Job System","file":"lore/article/element-job-system.md","state":"ok","md":"# Element Job System\n\nThis is how fighting works in Nuitai.\n\nThere are six elements. Every character has two of them, and that pair is their\njob: what they can do, what they are bad at, and who they work well beside. The pair never changes.\n\nSix elements make fifteen possible pairs, and all fifteen exist. The fifteen are\nlisted in [The Fifteen Jobs](the-fifteen-jobs.md). This page is the rulebook.\n\n---\n\n## Rules\n\n1. Six elements. Two each. The pair is your job.\n2. **Ahi** and **Mana** are the only elements that can hurt anyone. The other four\n   heal, protect, strengthen and weaken.\n3. Mix two elements and one says what the technique is, the other says what it\n   does. Every pair makes at least two techniques.\n4. The elements form two rock, paper, scissors triangles, three elements in each.\n   Every element beats one and loses to one. Hit a weakness, double damage. Hit a\n   strength, half.\n5. Two characters can mix one element each. One character can mix their own two,\n   but it costs two turns.\n6. Three characters can fight in a party at once.\n\n---\n\n## The six elements at a glance\n\n| Element | Colour | Role | What it does | Beats | Loses to |\n|---|---|---|---|---|---|\n| 🟥 **Ahi** · Fire | Red | Fighter | Physical damage | Lau | Wai |\n| 🟩 **Lau** · Nature | Green | Healer | Heals and cures | Wai | Ahi |\n| 🟦 **Wai** · Water | Blue | Defender | Protects allies | Ahi | Lau |\n| 🟨 **La** · Light | Gold | Enhancer | Strengthens allies | Ata | Mana |\n| ⬛ **Ata** · Shadow | Black | Saboteur | Weakens enemies | Mana | La |\n| 🟪 **Mana** · Spirit | Purple | Blaster | Magic damage | La | Ata |\n\n---\n\n## 🟥 Ahi · Fire\n\n| | |\n|---|---|\n| **Colour** | 🟥 Red |\n| **Role** | Fighter |\n| **Deals** | Physical damage |\n| **Strong against** | Lau |\n| **Weak against** | Wai |\n\n**Ahi hits things. It also lets everyone else hit things.**\n\nAhi is the plainest of the six. It does physical damage, more of it than anything\nelse, and it needs no setup to work. If you have never played a game like this,\ntake Ahi and you will not be lost.\n\nWhat makes it worth more than its damage is the job it lends. Four of the six\nelements cannot hurt anybody on their own. Lau heals, Wai protects, La\nstrengthens, Ata weakens. Pair any of them with Ahi and the pair gets a physical\nattack in the other element: a nature strike, a water strike, a light strike, a\nshadow strike. Ahi supplies the hitting. The partner supplies what the enemy is\nbeing hit with.\n\nThe cost is that Ahi does not defend. It has no way to guard, shield an ally or\ntake a hit for anyone. Its answer to being attacked is to kill the thing faster.\nFights where that is not working are the fights where you want Wai on the field.\n\n**How it fights.** Spins, flying kicks, landings that end in a burst of flame.\nConstant forward motion, because stopping is what gets an Ahi fighter killed. The\nstyle is loud and hard to predict, and it is as much a performance as a fight.\n\n**Watch out for.** Wai. Water puts fire out, and an Ahi attack into a Wai enemy\ndoes half damage.\n\n---\n\n## 🟩 Lau · Nature\n\n| | |\n|---|---|\n| **Colour** | 🟩 Green |\n| **Role** | Healer |\n| **Deals** | Nothing, on its own |\n| **Strong against** | Wai |\n| **Weak against** | Ahi |\n\n**Lau is the reason the party is still standing.**\n\nLau restores health and clears the things that stop a character working: poison,\nsleep, fear, whatever the fight has inflicted. It is the only element that does\nthis. Items exist, but items run out and a Lau character does not.\n\nLau cannot attack by itself. A Lau character pairs with Ahi or Mana and turns their healing\nelement outward, and nature's attacks tend to be the slow kind: things that grow,\nspread, take root and keep working after the turn ends.\n\n**How it fights.** Slow circling steps, arms rising from the ground toward the\nsky. The same gestures used to coax a crop out of the dirt, aimed at a wound\ninstead. Practitioners who have had to defend themselves speed it up: it begins\nsoft and ends hard.\n\n**Watch out for.** Ahi. Fire burns everything green.\n\n---\n\n## 🟦 Wai · Water\n\n| | |\n|---|---|\n| **Colour** | 🟦 Blue |\n| **Role** | Defender |\n| **Deals** | Nothing, on its own |\n| **Strong against** | Ahi |\n| **Weak against** | Lau |\n\n**Wai is the only element that can protect somebody else.**\n\nAny character can **Defend** and reduce the damage they personally take. Only Wai\ncan stand in front of an ally. Wai draws attacks onto itself, takes hits meant for\nother people, and decides where the enemy's damage goes instead of merely\nsurviving it.\n\nThat changes what a fight is. Without Wai, a party races the enemy to see who runs\nout of health first. With Wai, the party chooses who gets hit, which means the\nhealer and the fragile heavy hitter both get to keep doing their jobs.\n\nLike Lau, Wai cannot attack unaided. Its philosophy is self defence over attack. It\nmoves with the current and lets the attack go somewhere it was never going to hurt\nanyone.\n\n**How it fights.** Unhurried, and nearly impossible to land a hit on. Everything\nredirects. The best practitioners are said to be unbreakable by anything short of\nreal magic, a reputation they earned by never attacking first.\n\n**Watch out for.** Lau. Growing things drink water, and that is the one matchup\nwhere all that patience gets drained out from under you.\n\n---\n\n## 🟨 La · Light\n\n| | |\n|---|---|\n| **Colour** | 🟨 Gold |\n| **Role** | Enhancer |\n| **Deals** | Nothing, on its own |\n| **Strong against** | Ata |\n| **Weak against** | Mana |\n\n**La makes everyone else better at their job.**\n\nLa strengthens allies: harder hits, tougher skin, faster turns. On paper it is the\nleast exciting of the six, because nothing it does shows up as a number with your\nname on it. In practice it multiplies the whole party, and a multiplier beats an\naddition the moment a fight lasts more than a few turns.\n\nLa is the counterpart to Ata, and the two are worth learning together. La makes\nyour side stronger, Ata makes their side weaker, and against one large enemy they\ndo almost the same work by opposite routes. Against a crowd they do not, and which\none you want is one of the real decisions in building a party.\n\nLa also cleans. Light purifies shadow, so La is the element that answers curses,\ncorruption and the kinds of lingering harm ordinary healing does not touch.\n\n**How it fights.** Formal and deliberate, closer to a rite than a technique. La is\nthe light of a faith that teaches escape from an endless cycle, and its gestures\nlook like what they are: devotion aimed at a problem.\n\n**Watch out for.** Mana. The current of the world is older than any teaching about\nit, and it goes straight through light without slowing down.\n\n---\n\n## ⬛ Ata · Shadow\n\n| | |\n|---|---|\n| **Colour** | ⬛ Black |\n| **Role** | Saboteur |\n| **Deals** | Nothing, on its own |\n| **Strong against** | Mana |\n| **Weak against** | La |\n\n**Ata makes the enemy worse at being the enemy.**\n\nAta weakens: softer hits, thinner armour, slower turns, poison, fear, confusion.\nWhere La lifts the party up, Ata drags the opposition down, and a weakened enemy\nis worth as much as a stronger party for most of a fight.\n\nAta is at its best in fights that go long. A boss with twenty times your health\ndoes not care about one more point of damage, but it cares a great deal about\nhitting half as hard for the rest of the battle. Against fragile enemies that die\nin a turn, Ata is wasted effort.\n\nShadow is not evil here. Ata is decay, dark and\nthe dead, and the people who work with it treat all three as ordinary parts of a\nworking world. Fear has its uses. Something has to break down what has died.\n\n**How it fights.** Quietly, and usually first. Ata's work is done before the enemy\nunderstands why nothing is landing. Its practitioners deal with the dead by asking\nrather than commanding, and the technique carries that: the power is borrowed, and\nborrowing has terms.\n\n**Watch out for.** La. Light finds everything, and Ata has no answer to being\nfound.\n\n---\n\n## 🟪 Mana · Spirit\n\n| | |\n|---|---|\n| **Colour** | 🟪 Purple |\n| **Role** | Blaster |\n| **Deals** | Magic damage |\n| **Strong against** | La |\n| **Weak against** | Ata |\n\n**Mana is Ahi's opposite number: the other way to hurt something.**\n\nMana does magic damage, and it is the second of the two elements that can attack\nat all. Everything said about Ahi lending its job is true of Mana too,\nwith one difference. Ahi's job is a physical hit. Mana's job is a magic one. Pair\nLau with Ahi and you get a nature strike, which lands on the enemy's physical\ndefence. Pair Lau with Mana and you get a nature blast, which lands on its magic\ndefence.\n\nSo the rule of thumb: **find out which defence the enemy is worse at, then pick\nthe partner.**\n\nMana also reaches furthest. Where the other five each do one thing, Mana is the\nraw material the other five are made from, which is why a Mana character can\nproduce effects outside their own lane. Fire, water, lightning, without being a\nfire or water specialist at all.\n\n**How it fights.** Motion, because motion is what Mana is. Nothing still has any\npower. Every technique is a movement, and a character who cannot move cannot do\nanything at all.\n\n**Watch out for.** Ata. Shadow corrupts spirit, and a Mana attack into an Ata\nenemy does half damage.\n\n---\n\n## What beats what\n\nSix elements, two triangles, three to a triangle. **The triangles never touch.**\nNothing in the material triangle has any relationship to anything in the spiritual\none. That is deliberate, so you can learn one and come back later for the other.\n\n**The material triangle**\n\n> 🟥 Ahi burns 🟩 Lau → 🟩 Lau drinks 🟦 Wai → 🟦 Wai quenches 🟥 Ahi → back to the start\n\n**The spiritual triangle**\n\n> 🟨 La purifies ⬛ Ata → ⬛ Ata corrupts 🟪 Mana → 🟪 Mana outlasts 🟨 La → back to the start\n\n| Your attack | Double damage against | Half damage against | Normal against |\n|---|---|---|---|\n| 🟥 **Ahi** | Lau | Wai | Ahi, La, Ata, Mana |\n| 🟩 **Lau** | Wai | Ahi | Lau, La, Ata, Mana |\n| 🟦 **Wai** | Ahi | Lau | Wai, La, Ata, Mana |\n| 🟨 **La** | Ata | Mana | La, Ahi, Lau, Wai |\n| ⬛ **Ata** | Mana | La | Ata, Ahi, Lau, Wai |\n| 🟪 **Mana** | La | Ata | Mana, Ahi, Lau, Wai |\n\nAn element hitting itself does normal damage.\n\n---\n\n## Jobs: the fifteen pairs\n\nYour two elements are your job. You get the technique of each, plus the two\nyour pair makes together.\n\n| | 🟥 **Ahi** | 🟩 **Lau** | 🟦 **Wai** | 🟨 **

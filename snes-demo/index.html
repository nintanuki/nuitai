# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "nuitai"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/nuitai
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("nuitai.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("nuitai.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

    <script type="application/javascript">
    (() => {
        // A tap shorter than a frame still reaches the game: each button
        // pressed counts as held until the game has read it once.
        window.nuitai_pad = 0
        let tapped = 0
        window.nuitai_pad_read = () => {
            const mask = window.nuitai_pad | tapped
            tapped = 0
            return mask
        }
        if (!NUITAI_TOUCH) return
        document.body.classList.add("touch")

        const $ = (id) => document.getElementById(id)
        const dpad = $("pad-dpad"), face = $("pad-face")
        const L = $("pad-l"), R = $("pad-r"), select = $("pad-select"), start = $("pad-start")
        const GAP = 10
        let placed = ""

        function place(el, x, y, w, h) {
            el.style.left = Math.round(x) + "px"
            el.style.top = Math.round(y) + "px"
            el.style.width = Math.round(w) + "px"
            el.style.height = Math.round(h) + "px"
        }

        // The game's picture, whole: 256 by 224 pixels, eight wide to seven high.
        function aspect() {
            return canvas.width > 1 && canvas.height > 1 ? canvas.width / canvas.height : 8 / 7
        }

        function placeScreen(x, y, w, h) {
            const s = canvas.style
            s.position = "fixed"
            s.margin = "0"
            s.right = "auto"
            s.bottom = "auto"
            place(canvas, x, y, w, h)
            placed = s.cssText
        }

        function layout() {
            const vw = window.innerWidth, vh = window.innerHeight, ar = aspect()
            const shoulderH = Math.max(30, Math.min(40, vh * 0.07))
            const pillH = 28
            if (vh >= vw) {
                // Portrait: the picture across the top, the pad under it.
                let sw = vw, sh = sw / ar
                const need = shoulderH + pillH + 110 + GAP * 5
                if (vh - sh < need) { sh = vh - need; sw = sh * ar }
                placeScreen((vw - sw) / 2, 0, sw, sh)
                const top = sh + GAP, room = vh - top - GAP
                let D = Math.min(vw * 0.42, 180, room - shoulderH - pillH - GAP * 3)
                const used = shoulderH + D + pillH + GAP * 3
                const y0 = top + Math.max(0, (room - used) / 2)
                const sideW = Math.min(vw * 0.3, 130)
                place(L, GAP, y0, sideW, shoulderH)
                place(R, vw - GAP - sideW, y0, sideW, shoulderH)
                const yPad = y0 + shoulderH + GAP * 1.5
                place(dpad, GAP * 1.5, yPad, D, D)
                place(face, vw - GAP * 1.5 - D, yPad, D, D)
                const pillW = Math.min(vw * 0.24, 100), yPill = yPad + D + GAP * 1.5
                place(select, vw / 2 - GAP / 2 - pillW, yPill, pillW, pillH)
                place(start, vw / 2 + GAP / 2, yPill, pillW, pillH)
            } else {
                // Landscape: the picture in the middle, the D-pad left, the face buttons right.
                const minSide = 150
                let sh = vh, sw = sh * ar
                if (vw - sw < minSide * 2) { sw = vw - minSide * 2; sh = sw / ar }
                placeScreen((vw - sw) / 2, (vh - sh) / 2, sw, sh)
                const side = (vw - sw) / 2
                const D = Math.min(side - GAP * 2, 180, vh - shoulderH - pillH - GAP * 4)
                const used = shoulderH + D + pillH + GAP * 3
                const y0 = Math.max(GAP, (vh - used) / 2)
                const sideW = Math.min(side - GAP * 2, 130)
                place(L, GAP, y0, sideW, shoulderH)
                place(R, vw - GAP - sideW, y0, sideW, shoulderH)
                const yPad = y0 + shoulderH + GAP * 1.5
                place(dpad, (side - D) / 2, yPad, D, D)
                place(face, vw - side + (side - D) / 2, yPad, D, D)
                const pillW = Math.min(side - GAP * 2, 100), yPill = yPad + D + GAP * 1.5
                place(select, (side - pillW) / 2, yPill, pillW, pillH)
                place(start, vw - side + (side - pillW) / 2, yPill, pillW, pillH)
            }
            const D = dpad.offsetWidth
            for (const b of face.children) {
                b.style.width = b.style.height = Math.round(D * 0.36) + "px"
                b.style.fontSize = Math.round(D * 0.15) + "px"
            }
            L.style.fontSize = R.style.fontSize = Math.round(shoulderH * 0.5) + "px"
            select.style.fontSize = start.style.fontSize = "12px"
        }

        // What each finger holds. Fingers can slide from button to button,
        // and around the D-pad, as thumbs do on a real pad.
        const fingers = new Map()

        function dpadBits(x, y) {
            const r = dpad.getBoundingClientRect()
            const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2)
            const dist = Math.hypot(dx, dy)
            if (dist > r.width * 0.7) return 0
            if (dist < r.width * 0.1) return 0
            // Each direction covers 120 degrees around its arm, so the four
            // diagonals are narrow and a thumb on an arm stays straight.
            const a = Math.atan2(dy, dx) * 180 / Math.PI
            const near = (c) => Math.abs(((a - c + 540) % 360) - 180) < 60
            return (near(-90) ? 1 << 8 : 0) | (near(90) ? 1 << 9 : 0)
                 | (near(180) ? 1 << 10 : 0) | (near(0) ? 1 << 11 : 0)
        }

        function update() {
            let mask = 0
            for (const [x, y] of fingers.values()) {
                // A button under the finger first; the D-pad reaches a
                // little past its edges, but never over another button.
                const hit = document.elementFromPoint(x, y)
                const b = hit && hit.closest && hit.closest("[data-b]")
                if (b) { mask |= 1 << Number(b.dataset.b); continue }
                const d = dpadBits(x, y)
                if (d > 0) mask |= d
            }
            tapped |= mask & ~window.nuitai_pad
            window.nuitai_pad = mask
            for (const b of document.querySelectorAll("#pad [data-b]"))
                b.classList.toggle("on", !!(mask & (1 << Number(b.dataset.b))))
            for (const d of document.querySelectorAll("#pad [data-d]"))
                d.classList.toggle("on", !!(mask & (1 << Number(d.dataset.d))))
        }

        document.addEventListener("pointerdown", (e) => {
            fingers.set(e.pointerId, [e.clientX, e.clientY]); update()
        })
        document.addEventListener("pointermove", (e) => {
            if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, [e.clientX, e.clientY]); update() }
        })
        const lift = (e) => { if (fingers.delete(e.pointerId)) update() }
        document.addEventListener("pointerup", lift)
        document.addEventListener("pointercancel", lift)
        const letGo = () => { fingers.clear(); update() }
        window.addEventListener("blur", letGo)
        document.addEventListener("visibilitychange", letGo)

        // No scrolling, zooming, text picking or long-press menus while playing.
        const stop = (e) => e.preventDefault()
        for (const kind of ["touchstart", "touchmove", "touchend", "gesturestart", "dblclick", "contextmenu"])
            document.addEventListener(kind, stop, { passive: false })

        layout()
        window.addEventListener("resize", layout)
        window.addEventListener("orientationchange", () => setTimeout(layout, 200))
        // The game sizes its canvas when it opens its window; place it again then.
        new MutationObserver(() => {
            if (canvas.style.cssText !== placed) layout()
        }).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] })
    })()
    </script>

    <script type="application/javascript">
    // F11 fills the screen, as in the desktop game (Frankie, 10/25). The game
    // takes every key the page gets, so the browser never sees F11; the page
    // catches it first and asks for fullscreen itself, which a browser only
    // allows inside the key press.
    window.addEventListener("keydown", (e) => {
        if (e.key !== "F11") return
        e.preventDefault()
        e.stopImmediatePropagation()
        if (document.fullscreenElement) document.exitFullscreen()
        else document.documentElement.requestFullscreen()
    }, { capture: true })
    </script>

</body>

<text x="466" y="30" font-size="13" style="fill:var(--soft)">N ↑</text>
<text x="905" y="50" font-size="26" font-weight="bold">The whirlpool's currents</text>
<text x="905" y="76" font-size="14" style="fill:var(--soft)">For an ordinary ship making 5 knots, about 138 miles a day.</text>
<text x="905" y="94" font-size="14" style="fill:var(--soft)">Days are an eighth of the way round, about one region to the next.</text>
<rect x="905" y="124" width="22" height="22" rx="4" fill="var(--calm-f)" stroke="var(--calm)" stroke-width="2"/>
<text x="939" y="141" font-size="18" font-weight="bold" style="fill:var(--calm)">The Calm Ring</text>
<text x="939" y="161" font-size="13" style="fill:var(--soft)">Outer Sea, 3,500 to 5,000 miles out, current 0.5 knots</text>
<text x="939" y="181" font-size="14">Clockwise 1.1×, about 22 days</text>
<text x="939" y="199" font-size="14">Counterclockwise 0.9×, about 27 days</text>
<rect x="905" y="236" width="22" height="22" rx="4" fill="var(--drift-f)" stroke="var(--drift)" stroke-width="2"/>
<text x="939" y="253" font-size="18" font-weight="bold" style="fill:var(--drift)">Mariner's Drift</text>
<text x="939" y="273" font-size="13" style="fill:var(--soft)">the Driftbelt, 2,500 to 3,500 miles out, current 1.25 knots</text>
<text x="939" y="293" font-size="14">Clockwise 1.25×, about 14 days</text>
<text x="939" y="311" font-size="14">Counterclockwise 0.75×, about 23 days</text>
<rect x="905" y="348" width="22" height="22" rx="4" fill="var(--surge-f)" stroke="var(--surge)" stroke-width="2"/>
<text x="939" y="365" font-size="18" font-weight="bold" style="fill:var(--surge)">Sailor's Run</text>
<text x="939" y="385" font-size="13" style="fill:var(--soft)">the Surge Zone, 1,500 to 2,500 miles out, current 2.5 knots</text>
<text x="939" y="405" font-size="14">Clockwise 1.5×, about 8 days</text>
<text x="939" y="423" font-size="14">Counterclockwise 0.5×, about 23 days</text>
<rect x="905" y="460" width="22" height="22" rx="4" fill="var(--tempest-f)" stroke="var(--tempest)" stroke-width="2"/>
<text x="939" y="477" font-size="18" font-weight="bold" style="fill:var(--tempest)">Storm's Edge</text>
<text x="939" y="497" font-size="13" style="fill:var(--soft)">the Tempest Ring, 1,000 to 1,500 miles out, current 5 knots</text>
<text x="939" y="517" font-size="14">Clockwise 2×, about 4 days</text>
<text x="939" y="535" font-size="14">Counterclockwise: no headway at all</text>
<rect x="905" y="572" width="22" height="22" rx="4" fill="var(--eye-f)" stroke="var(--eye)" stroke-width="2"/>
<text x="939" y="589" font-size="18" font-weight="bold" style="fill:var(--eye)">The Abyssal Spiral</text>
<text x="939" y="609" font-size="13" style="fill:var(--soft)">the Eye's Reach, 500 to 1,000 miles out, current faster than any ship</text>
<text x="939" y="629" font-size="14">Clockwise only, and inward: no way back out.</text>
<rect x="905" y="664" width="22" height="22" rx="4" fill="var(--core-f)" stroke="var(--core)" stroke-width="2"/>
<text x="939" y="681" font-size="18" font-weight="bold" style="fill:var(--core)">The Heart of Moanatu</text>
<text x="939" y="701" font-size="13" style="fill:var(--soft)">the Core, 0 to 500 miles out</text>
<text x="939" y="721" font-size="14">Certain death. No ship has ever come back.</text>
</svg>
